appId: com.topodrive.socrates.desktop
productName: Socrates
electronVersion: 31.7.7
directories:
  output: release
  buildResources: build
files:
  - main.js
  - package.json
extraResources:
  - from: dist
    to: dist
    filter:
      - '**/*'
win:
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Socrates
  artifactName: SocratesSetup-${version}-x64.${ext}
