<!DOCTYPE html>
<html lang="zh-CN" data-theme="socrates" data-mode="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Socrates — API 密钥</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<link href="/base.css" rel="stylesheet">
<style>
.apikey-list{max-width:600px;margin:0 auto}
.apikey-card{background:hsl(var(--bg-000));border:0.5px solid hsl(var(--border-300)/0.1);border-radius:12px;padding:18px 22px;margin-bottom:10px;display:flex;align-items:center;gap:14px;transition:border-color var(--anim-fast),box-shadow var(--anim-fast)}
.apikey-card:hover{border-color:hsl(var(--border-300)/0.18)}
.apikey-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.apikey-dot.active{background:hsl(145 50% 50%)}
.apikey-dot.inactive{background:hsl(var(--text-500)/0.3)}
.apikey-info{flex:1;min-width:0}
.apikey-label{font-size:14px;font-weight:500;color:hsl(var(--text-100))}
.apikey-model{font-size:12px;color:hsl(var(--text-500));margin-top:1px}
.apikey-del{background:none;border:none;color:hsl(var(--text-500));cursor:pointer;padding:6px;border-radius:6px;transition:color var(--anim-fast),background var(--anim-fast);flex-shrink:0}
.apikey-del:hover{color:hsl(0 60% 60%);background:hsl(0 60% 50%/0.08)}
.apikey-form{background:hsl(var(--bg-000));border:0.5px solid hsl(var(--border-300)/0.1);border-radius:12px;padding:24px 28px 28px;margin-bottom:24px}
.apikey-form h3{font-size:15px;font-weight:600;color:hsl(var(--text-100));margin-bottom:16px}
.apikey-field{margin-bottom:14px}
.apikey-field label{display:block;font-size:12px;color:hsl(var(--text-400));margin-bottom:4px;font-weight:500}
.apikey-field input,.apikey-field select{width:100%;padding:10px 14px;border-radius:8px;border:0.5px solid hsl(var(--border-300)/0.15);background:hsl(var(--bg-200));font-size:14px;color:hsl(var(--text-100));font-family:inherit;outline:none;transition:border-color .15s}
.apikey-field input:focus,.apikey-field select:focus{border-color:hsl(var(--accent-000)/0.4)}
.apikey-field .hint{font-size:11px;color:hsl(var(--text-500));margin-top:4px}
.apikey-empty{text-align:center;padding:48px 20px;color:hsl(var(--text-500))}
.apikey-empty svg{width:36px;height:36px;margin-bottom:12px;opacity:0.25}
.apikey-empty p{font-size:14px}
.apikey-msg{font-size:13px;padding:10px 16px;border-radius:8px;margin-bottom:14px;display:none}
.apikey-msg.ok{display:block;background:hsl(145 50% 45%/0.08);color:hsl(145 50% 50%);border:0.5px solid hsl(145 50% 45%/0.15)}
.apikey-msg.err{display:block;background:hsl(0 60% 50%/0.08);color:hsl(0 60% 55%);border:0.5px solid hsl(0 60% 50%/0.12)}
@media(max-width:720px){.apikey-card{padding:14px 16px}.apikey-form{padding:18px 20px}}
</style>
<script>
!function(){
  try{
    var p=localStorage.getItem("socrates-lang");
    if(!p)return;
    var c=document.documentElement.lang;
    var here=window.location.pathname;
    if(p==="zh"&&c.indexOf("zh")!==0){
      var target=here.replace(/\.html$/,"");
      window.location.replace(target==="/"||target===""?"/zh/":"/zh"+target);
    }else if(p==="en"&&c.indexOf("en")!==0){
      var target2=here.replace(/^\/zh/,"").replace(/\.html$/,"");
      window.location.replace(target2==="/"||target2===""?"/":target2);
    }
  }catch(e){}
}();
</script>
</head>
<body>
<div class="bg-grid"></div>
<div class="bg-glow"></div>
<div class="page">

<nav>
  <div class="nav-inner">
    <a href="/" class="nav-logo"><em>S</em>ocrates</a>
    <div class="nav-links">
      <a href="/pricing">套餐</a>
      <a href="/guide">指南</a>
      <a href="/about">关于</a>
      <a href="/contact">联系</a>
      <a href="/account">账户</a>
      <a class="lang-switch">EN</a>
      <a href="https://app.topodrive.top" class="cta-btn">开始学习</a>
    </div>
  </div>
</nav>

<div class="page-header">
  <div class="section-eyebrow">设置</div>
  <h1>API <strong>密钥</strong></h1>
  <p>管理你的 LLM 提供商密钥。密钥在静态时加密存储，不会对外分享。</p>
</div>

<section style="padding-top:0">
  <div class="section-inner">
    <div id="apikey-content" style="max-width:600px;margin:0 auto">
      <div class="apikey-form sr" id="addKeyForm">
        <h3>添加提供商密钥</h3>
        <div id="keyMsg" class="apikey-msg"></div>
        <div class="apikey-field">
          <label for="keyLabel">标签</label>
          <input id="keyLabel" placeholder="例如：我的 OpenAI 密钥" autocomplete="off">
        </div>
        <div class="apikey-field">
          <label for="keyUrl">API 地址</label>
          <select id="keyUrl">
            <option value="https://api.openai.com/v1">OpenAI — api.openai.com</option>
            <option value="https://api.anthropic.com/v1">Anthropic — api.anthropic.com</option>
            <option value="https://api.together.xyz">Together.ai</option>
            <option value="https://api.groq.com/openai/v1">Groq</option>
            <option value="https://api.deepseek.com">DeepSeek</option>
            <option value="">自定义地址</option>
          </select>
          <input id="keyUrlCustom" style="display:none;margin-top:8px" placeholder="https://your-endpoint.com/v1">
        </div>
        <div class="apikey-field">
          <label for="keyModel">模型</label>
          <input id="keyModel" placeholder="例如：gpt-5.5、claude-opus-4-8">
          <div class="hint">输入你的提供商使用的模型 ID。</div>
        </div>
        <div class="apikey-field">
          <label for="keyValue">API 密钥</label>
          <input id="keyValue" type="password" placeholder="sk-…">
          <div class="hint">存储前加密。保存后不再显示。</div>
        </div>
        <button class="btn btn-primary" onclick="addKey()">保存密钥</button>
      </div>
      <div id="keyList" class="sr sr-d1">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">
          <span style="font-size:12px;font-weight:600;color:hsl(var(--text-400));text-transform:uppercase;letter-spacing:.04em">已配置的提供商</span>
          <span id="keyCount" style="font-size:12px;color:hsl(var(--text-500))"></span>
        </div>
        <div id="keyItems"></div>
      </div>
    </div>
  </div>
</section>

<footer>
  <div class="footer-inner">
    <div class="footer-brand">
      <div class="footer-tag"><em>S</em>ocrates</div>
      <p>AI 驱动的苏格拉底式导师。循序渐进，学无止境。</p>
    </div>

      <div class="footer-col-title">产品</div>
      <a href="/pricing">套餐</a>

      <div class="footer-col-title">公司</div>

    <div class="footer-col">
      <div class="footer-col-title">账户</div>

<script>
/* ── Scroll reveal ─────────────────────────────────── */
var srObs = new IntersectionObserver(function(e){
  e.forEach(function(entry){if(entry.isIntersecting)entry.target.classList.add('in')});
},{threshold:0.1,rootMargin:'0px 0px -40px 0px'});
document.querySelectorAll('.sr').forEach(function(el){srObs.observe(el)});

/* ── API key management ────────────────────────────── */
function msg(text, type) {
  var el = document.getElementById('keyMsg');
  el.textContent = text;
  el.className = 'apikey-msg ' + (type || '');
}

function renderKeys(providers) {
  var container = document.getElementById('keyItems');
  var count = document.getElementById('keyCount');
  if (!providers || providers.length === 0) {
    container.innerHTML = '<div class="apikey-empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/></svg><p>尚未配置 API 密钥。请在上方添加。</p></div>';
    count.textContent = '0 个已配置';
    return;
  }
  count.textContent = providers.length + ' 个已配置';
  container.innerHTML = providers.map(function(p) {
    return '<div class="apikey-card">' +
      '<span class="apikey-dot ' + (p.is_active ? 'active' : 'inactive') + '"></span>' +
      '<div class="apikey-info"><div class="apikey-label">' + esc(p.label || p.model) + '</div><div class="apikey-model">' + esc(p.url) + ' — ' + esc(p.model) + '</div></div>' +
      '<button class="apikey-del" onclick="deleteKey(\'' + p.id + '\')" title="删除"><svg viewBox="0 0 16 16" width="14" height="14" fill="currentColor"><path d="M4.646 4.646a.5.5 0 0 1 .708 0L8 7.293l2.646-2.647a.5.5 0 0 1 .708.708L8.707 8l2.647 2.646a.5.5 0 0 1-.708.708L8 8.707l-2.646 2.647a.5.5 0 0 1-.708-.708L7.293 8 4.646 5.354a.5.5 0 0 1 0-.708z"/></svg></button>' +
    '</div>';
  }).join('');
}

function esc(s) { return String(s).replace(/[&<>"]/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]}) }

function loadKeys() {
  fetch('/api/api-key', { credentials: 'same-origin' }).then(function(r) {
    if (r.status === 401) { window.location.href = '/account'; return null; }
    return r.json();
  }).then(function(d) {
    if (d) renderKeys(d.providers);
  }).catch(function(){});
}

function addKey() {
  var label = document.getElementById('keyLabel').value.trim();
  var urlEl = document.getElementById('keyUrl');
  var url = urlEl.value || document.getElementById('keyUrlCustom').value.trim();
  var model = document.getElementById('keyModel').value.trim();
  var key = document.getElementById('keyValue').value.trim();

  if (!url) { msg('请选择或输入 API 地址。', 'err'); return; }
  if (!model) { msg('请输入模型名称。', 'err'); return; }
  if (!key) { msg('请输入你的 API 密钥。', 'err'); return; }

  msg('保存中…', '');
  fetch('/api/api-key', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'X-CSRF-Token': getCookie('csrf') || '' },
    body: JSON.stringify({ label: label || model, url: url, model: model, key: key }),
    credentials: 'same-origin'
  }).then(function(r) { return r.json(); }).then(function(d) {
    if (d.error) { msg(d.error, 'err'); return; }
    msg('密钥保存成功。', 'ok');
    document.getElementById('keyLabel').value = '';
    document.getElementById('keyValue').value = '';
    loadKeys();
  }).catch(function(){ msg('连接错误。', 'err'); });
}

function deleteKey(id) {
  if (!confirm('删除此 API 密钥？')) return;
  fetch('/api/api-key/' + id, {
    method: 'DELETE',
    headers: { 'X-CSRF-Token': getCookie('csrf') || '' },
    credentials: 'same-origin'
  }).then(function(r) { return r.json(); }).then(function(d) {
    if (d.error) { msg(d.error, 'err'); return; }
    loadKeys();
  }).catch(function(){ msg('连接错误。', 'err'); });
}

/* CSRF cookie reader */
function getCookie(name) {
  var m = document.cookie.match(new RegExp('(?:^|;)\\s*' + name.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + '=([^;]*)'));
  return m ? m[1] : null;
}

/* Custom URL toggle */
document.getElementById('keyUrl').addEventListener('change', function(){
  document.getElementById('keyUrlCustom').style.display = this.value === '' ? 'block' : 'none';
});

/* Load keys on page load */
(function(){
  /* Fetch CSRF token first */
  fetch('/api/auth/csrf-token', { credentials: 'same-origin' }).catch(function(){}).then(function(){ loadKeys(); });
})();
</script>
