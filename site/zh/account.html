<style>
/* ── Account dashboard layout ────────────────────────── */
.acct-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;max-width:860px;margin:0 auto}
.acct-card{background:hsl(var(--bg-000));border:0.5px solid hsl(var(--border-300)/0.1);border-radius:16px;padding:28px 32px 32px;box-shadow:0 2px 12px hsl(var(--always-black)/0.08);transition:border-color var(--anim-fast),box-shadow var(--anim-fast)}
.acct-card:hover{border-color:hsl(var(--border-300)/0.18);box-shadow:0 4px 20px hsl(var(--always-black)/0.12)}
.acct-card.full{grid-column:1/-1}
.acct-card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;padding-bottom:16px;border-bottom:0.5px solid hsl(var(--border-300)/0.08)}
.acct-card-title{font-size:14px;font-weight:600;color:hsl(var(--text-100));text-transform:uppercase;letter-spacing:.04em}

/* Subscription hero */
.acct-sub{text-align:center;padding-bottom:12px}
.acct-sub-plan{font-family:var(--font-display);font-size:32px;font-weight:400;color:hsl(var(--text-000));letter-spacing:-.02em}
.acct-sub-plan strong{font-weight:500;color:hsl(var(--accent-000))}
.acct-sub-price{font-size:16px;color:hsl(var(--text-400));margin:4px 0 12px}
.acct-sub-price strong{font-size:28px;font-weight:500;color:hsl(var(--text-000))}
.acct-badge{display:inline-flex;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;padding:4px 14px;border-radius:999px}
.acct-badge.active{background:hsl(145 50% 45%/0.12);color:hsl(145 50% 50%);border:0.5px solid hsl(145 50% 45%/0.2)}
.acct-badge.cancelled{background:hsl(35 80% 50%/0.12);color:hsl(35 80% 55%);border:0.5px solid hsl(35 80% 50%/0.2)}
.acct-badge.expired{background:hsl(0 60% 50%/0.1);color:hsl(0 60% 55%);border:0.5px solid hsl(0 60% 50%/0.15)}
.acct-sub-meta{display:flex;justify-content:center;gap:32px;margin-top:16px;flex-wrap:wrap}
.acct-sub-meta-item{text-align:center}
.acct-sub-meta-label{font-size:11px;color:hsl(var(--text-500));text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px}
.acct-sub-meta-value{font-size:18px;font-weight:500;color:hsl(var(--text-000))}
.acct-actions{display:flex;gap:10px;justify-content:center;margin-top:24px;flex-wrap:wrap}

/* Usage bars */
.acct-usage{margin-bottom:16px}
.acct-usage:last-child{margin-bottom:0}
.acct-usage-header{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px}
.acct-usage-label{color:hsl(var(--text-400))}
.acct-usage-count{color:hsl(var(--text-100));font-weight:500}
.acct-usage-bar{height:4px;border-radius:4px;background:hsl(var(--bg-300));overflow:hidden}
.acct-usage-fill{height:100%;border-radius:4px;transition:width var(--anim-slow)}
.acct-usage-fill.green{background:linear-gradient(90deg,hsl(145 50% 45%),hsl(145 50% 55%))}
.acct-usage-fill.gold{background:linear-gradient(90deg,hsl(var(--accent-000)),hsl(var(--brand-100)))}
.acct-usage-fill.blue{background:linear-gradient(90deg,hsl(210 60% 50%),hsl(210 60% 60%))}
.acct-usage-fill.red{background:linear-gradient(90deg,hsl(0 60% 50%),hsl(0 60% 60%))}

/* Invoices */
.acct-table{width:100%;border-collapse:collapse;font-size:13px}
.acct-table th,.acct-table td{padding:10px 0;text-align:left;border-bottom:0.5px solid hsl(var(--border-300)/0.06)}
.acct-table th{font-size:10px;font-weight:600;color:hsl(var(--text-500));text-transform:uppercase;letter-spacing:.06em}
.acct-table tr:last-child td{border-bottom:none}
.acct-table td{color:hsl(var(--text-400))}
.acct-table td:last-child{text-align:right}
.acct-table .paid{color:hsl(145 50% 50%)}
.acct-table .pending{color:hsl(35 80% 55%)}

/* Payment method */
.acct-pm{display:flex;align-items:center;gap:14px;padding:14px 18px;border-radius:12px;background:hsl(var(--bg-200)/0.5);border:0.5px solid hsl(var(--border-300)/0.08)}
.acct-pm-icon{width:40px;height:28px;border-radius:4px;background:hsl(var(--bg-300));display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:hsl(var(--text-500));flex-shrink:0}
.acct-pm-info{flex:1;min-width:0}
.acct-pm-name{font-size:14px;font-weight:500;color:hsl(var(--text-100))}
.acct-pm-desc{font-size:12px;color:hsl(var(--text-500));margin-top:1px}
.acct-pm-badge{font-size:10px;padding:2px 10px;border-radius:999px;background:hsl(145 50% 45%/0.1);color:hsl(145 50% 50%)}

/* Token heatmap (GitHub-style) — 7 days × 24 hours */
.acct-heatmap-grid{display:grid;grid-template-columns:64px repeat(24,1fr);gap:4px;margin-top:8px}
.acct-heatmap-day-label{font-size:10px;color:hsl(var(--text-500));text-transform:uppercase;letter-spacing:.04em;display:flex;align-items:center}
.acct-heatmap-row{display:contents}
.acct-heatmap-cell{aspect-ratio:1/1;border-radius:3px;background:hsl(var(--bg-300));transition:transform var(--anim-fast);position:relative}
.acct-heatmap-cell:hover{transform:scale(1.25);z-index:2}
.acct-heatmap-cell[data-level="0"]{background:hsl(var(--bg-300)/0.4)}
.acct-heatmap-cell[data-level="1"]{background:hsl(35 85% 50%/0.18)}
.acct-heatmap-cell[data-level="2"]{background:hsl(35 85% 50%/0.4)}
.acct-heatmap-cell[data-level="3"]{background:hsl(35 85% 50%/0.7)}
.acct-heatmap-cell[data-level="4"]{background:hsl(35 85% 55%)}
.acct-heatmap-axis{display:flex;justify-content:space-between;font-size:10px;color:hsl(var(--text-500));margin-top:8px;letter-spacing:.04em;padding-left:68px}
.acct-heatmap-tooltip{position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);background:hsl(var(--bg-100));color:hsl(var(--text-100));font-size:11px;padding:4px 8px;border-radius:6px;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity var(--anim-fast);border:0.5px solid hsl(var(--border-300)/0.2);z-index:3}
.acct-heatmap-cell:hover .acct-heatmap-tooltip{opacity:1}
.acct-heatmap-legend{display:flex;align-items:center;gap:6px;margin-top:12px;font-size:11px;color:hsl(var(--text-500));justify-content:flex-end}
.acct-heatmap-legend-cells{display:flex;gap:3px}
.acct-heatmap-legend-cells span{width:11px;height:11px;border-radius:2px;background:hsl(var(--bg-300)/0.4)}
.acct-heatmap-legend-cells span:nth-child(2){background:hsl(35 85% 50%/0.18)}
.acct-heatmap-legend-cells span:nth-child(3){background:hsl(35 85% 50%/0.4)}
.acct-heatmap-legend-cells span:nth-child(4){background:hsl(35 85% 50%/0.7)}
.acct-heatmap-legend-cells span:nth-child(5){background:hsl(35 85% 55%)}
.acct-heatmap-summary{display:flex;gap:24px;margin-bottom:14px;font-size:13px;color:hsl(var(--text-400))}
.acct-heatmap-summary strong{color:hsl(var(--text-100));font-weight:500}
.acct-heatmap-empty{text-align:center;color:hsl(var(--text-500));font-size:13px;padding:24px 0}
/* Token 用量趋势 — 平滑折线图 */
.trend-chart-wrap{position:relative;width:100%;overflow:hidden}
.trend-chart-wrap svg{display:block;width:100%;height:auto}
.trend-chart-wrap .trend-line{fill:none;stroke:hsl(var(--accent-000));stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.trend-chart-wrap .trend-area{fill:url(#trendGrad);opacity:0.25}
.trend-chart-wrap .trend-dot{fill:hsl(var(--accent-000));r:3;opacity:0;transition:opacity .15s}
.trend-chart-wrap:hover .trend-dot{opacity:1}
.trend-chart-wrap .trend-dot:hover{r:5}
.trend-chart-wrap .trend-grid{stroke:hsl(var(--text-500));stroke-width:0.5;opacity:0.15}
.trend-chart-wrap .trend-axis-label{fill:hsl(var(--text-500));font-size:10px;text-anchor:middle}
.trend-chart-wrap .trend-y-label{fill:hsl(var(--text-500));font-size:10px;text-anchor:end}

/* Danger zone */
.acct-danger{padding:20px 24px;border-radius:12px;border:0.5px solid hsl(0 60% 50%/0.15);background:hsl(0 60% 50%/0.03)}
.acct-danger-title{font-size:13px;font-weight:600;color:hsl(0 60% 60%);margin-bottom:6px}
.acct-danger p{font-size:12px;color:hsl(var(--text-500));line-height:1.6;margin-bottom:14px}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:6px;padding:10px 22px;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;transition:all var(--anim-fast);border:none;font-family:inherit}
.btn-primary{background:hsl(var(--accent-000));color:hsl(var(--bg-400))!important}
.btn-primary:hover{background:hsl(var(--accent-100));transform:translateY(-1px);box-shadow:0 4px 16px hsl(var(--accent-000)/0.25)}
.btn-outline{background:transparent;color:hsl(var(--text-100))!important;border:0.5px solid hsl(var(--border-300)/0.2)}
.btn-outline:hover{background:hsl(var(--bg-300))}
.btn-ghost{background:transparent;color:hsl(var(--text-400))!important}
.btn-ghost:hover{color:hsl(var(--text-100))!important}
.btn-danger{background:hsl(0 60% 50%/0.1);color:hsl(0 60% 60%)!important;border:0.5px solid hsl(0 60% 50%/0.2)}
.btn-danger:hover{background:hsl(0 60% 50%/0.18)}
.btn-sm{padding:7px 16px;font-size:12px}

/* Loading / error / sign-in states */
.acct-state{text-align:center;padding:80px 20px}
.acct-state svg{width:44px;height:44px;margin-bottom:16px;opacity:0.25}
.acct-state h2{font-family:var(--font-display);font-size:22px;font-weight:400;color:hsl(var(--text-000));margin-bottom:8px;letter-spacing:-.02em}
.acct-state p{font-size:14px;color:hsl(var(--text-500));line-height:1.7;max-width:360px;margin:0 auto}
.acct-state .btn{margin-top:20px}
.acct-spinner{animation:acctSpin .8s linear infinite;color:hsl(var(--accent-000)/0.4)}
@keyframes acctSpin{to{transform:rotate(360deg)}}

@media(max-width:720px){
.acct-grid{grid-template-columns:1fr}
.acct-card{padding:20px}
.acct-sub-meta{gap:16px}
.acct-actions{flex-direction:column;align-items:center}
/* 热力图移动端适配：允许横向滚动 */
#usageHeatmapCard{overflow-x:auto;-webkit-overflow-scrolling:touch}
.acct-heatmap-grid{min-width:580px}
.acct-heatmap-summary{gap:16px;flex-wrap:wrap}
.acct-heatmap-cell{width:14px;height:14px}
}
</style>
<script>
!function(){
  try{
    var p=localStorage.getItem("socrates-lang");
    if(!p)return;
    var c=document.documentElement.lang;
    var here=window.location.pathname;
    if(p==="zh"&&c.indexOf("zh")!==0){
      var target=here.replace(/\.html$/,"");
      window.location.replace(target==="/"||target===""?"/zh/":"/zh"+target);
    }else if(p==="en"&&c.indexOf("en")!==0){
      var target2=here.replace(/^\/zh/,"").replace(/\.html$/,"");
      window.location.replace(target2==="/"||target2===""?"/":target2);
    }
  }catch(e){}
}();
</script>
<style>
/* ── Toast notifications ──────────────────────────── */
.toast-container{position:fixed;bottom:24px;right:24px;z-index:9999;display:flex;flex-direction:column;gap:10px;pointer-events:none}
.toast{pointer-events:auto;background:hsl(var(--bg-000));border:0.5px solid hsl(var(--border-300)/0.15);border-radius:10px;padding:14px 18px;box-shadow:0 8px 32px hsl(var(--always-black)/0.3);min-width:280px;max-width:400px;display:flex;align-items:center;gap:12px;animation:toastIn .25s var(--ease-out);font-size:13px;color:hsl(var(--text-100));line-height:1.4}
.toast.success{border-left:3px solid hsl(145 50% 50%)}
.toast.error{border-left:3px solid hsl(0 60% 55%)}
.toast.info{border-left:3px solid hsl(var(--accent-000))}
.toast.warning{border-left:3px solid hsl(35 80% 55%)}
.toast-icon{flex-shrink:0;width:20px;height:20px}
.toast-text{flex:1;min-width:0;word-break:break-word}
.toast-close{flex-shrink:0;width:20px;height:20px;border-radius:4px;background:transparent;border:none;color:hsl(var(--text-400));cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;padding:0;line-height:1}
.toast-close:hover{color:hsl(var(--text-100));background:hsl(var(--bg-300))}
@keyframes toastIn{from{opacity:0;transform:translateY(16px) scale(.95)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes toastOut{from{opacity:1;transform:translateY(0) scale(1)}to{opacity:0;transform:translateY(16px) scale(.95)}}
/* ── Custom confirm dialog ────────────────────────── */
.confirm-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:9998;display:none;align-items:center;justify-content:center;animation:fadeIn .15s}
.confirm-overlay.show{display:flex}
.confirm-box{background:hsl(var(--bg-000));border:0.5px solid hsl(var(--border-300)/0.15);border-radius:16px;padding:28px 24px 20px;width:90%;max-width:400px;box-shadow:0 12px 48px hsl(var(--always-black)/0.4);animation:slideUp .2s var(--ease-out)}
.confirm-title{font-size:16px;font-weight:600;color:hsl(var(--text-000));margin-bottom:8px}
.confirm-msg{font-size:13px;color:hsl(var(--text-400));line-height:1.6;margin-bottom:20px}
.confirm-actions{display:flex;gap:10px;justify-content:flex-end}
.confirm-btn{padding:8px 20px;border-radius:8px;font-size:13px;font-weight:500;border:none;cursor:pointer;font-family:inherit}
.confirm-btn.cancel{background:hsl(var(--bg-300));color:hsl(var(--text-200))}
.confirm-btn.cancel:hover{background:hsl(var(--bg-400));color:hsl(var(--text-100))}
.confirm-btn.danger{background:hsl(0 60% 50%/0.12);color:hsl(0 60% 60%);border:0.5px solid hsl(0 60% 50%/0.2)}
.confirm-btn.danger:hover{background:hsl(0 60% 50%/0.2)}
.confirm-btn.primary{background:hsl(var(--accent-000));color:hsl(var(--bg-400))}
.confirm-btn.primary:hover{background:hsl(var(--accent-100))}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{opacity:0;transform:translateY(12px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
/* ── Modal overlay ────────────────────────────────── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:9997;display:none;align-items:center;justify-content:center;animation:fadeIn .15s}
.modal-overlay.show{display:flex}
.modal-box{background:hsl(var(--bg-000));border:0.5px solid hsl(var(--border-300)/0.15);border-radius:16px;padding:24px;width:90%;max-width:480px;max-height:80vh;overflow-y:auto;box-shadow:0 12px 48px hsl(var(--always-black)/0.4);animation:slideUp .2s var(--ease-out)}
.modal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;padding-bottom:14px;border-bottom:0.5px solid hsl(var(--border-300)/0.08)}
.modal-title{font-size:15px;font-weight:600;color:hsl(var(--text-000))}
.modal-close{width:28px;height:28px;border-radius:6px;border:none;background:transparent;color:hsl(var(--text-400));cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:20px}
.modal-close:hover{background:hsl(var(--bg-300));color:hsl(var(--text-100))}
.modal-body{font-size:13px;color:hsl(var(--text-400));line-height:1.6}
.modal-input{width:100%;padding:10px 14px;border-radius:8px;border:0.5px solid hsl(var(--border-300)/0.2);background:hsl(var(--bg-200));font-size:14px;color:hsl(var(--text-100));font-family:inherit;outline:none;margin-bottom:14px}
.modal-input:focus{border-color:hsl(var(--accent-000)/0.5)}
.modal-label{font-size:12px;color:hsl(var(--text-400));display:block;margin-bottom:4px}
.modal-btn{padding:10px 22px;border-radius:8px;font-size:13px;font-weight:500;border:none;cursor:pointer;font-family:inherit}
.modal-btn.primary{background:hsl(var(--accent-000));color:hsl(var(--bg-400))}
.modal-btn.primary:hover{background:hsl(var(--accent-100))}
.modal-btn.full{width:100%;text-align:center}
</style>
</head>

<script>
/* ── Scroll-reveal ─────────────────────────────────── */
var srObs = new IntersectionObserver(function(entries) {
  entries.forEach(function(entry) { if (entry.isIntersecting) entry.target.classList.add('in'); });
}, { threshold: 0.1, rootMargin: '0px 0px -40px 0px' });

/* ── Real account data from API ────────────────────── */
(function(){
  var grid = document.getElementById('acct-grid');
  var loginHTML = '<div class="acct-state" style="grid-column:1/-1">' +
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="44" height="44"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l5-5-5-5M13 12H3"/></svg>' +

  function loadAccount() {
    grid.innerHTML = '<div class="acct-state" style="grid-column:1/-1"><svg class="acct-spinner" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="48" height="48"><circle cx="12" cy="12" r="10" stroke-dasharray="50" stroke-dashoffset="50" stroke-linecap="round"/></svg><p>正在加载账户数据…</p></div>';

    var controller = new AbortController();
    var timeout = setTimeout(function() { controller.abort(); }, 10000);

    fetch('/api/account/usage', { credentials: 'same-origin', signal: controller.signal })
      .then(function(r) {
        clearTimeout(timeout);
        if (r.status === 401) {
          grid.innerHTML = '<div class="acct-state" style="grid-column:1/-1"><svg class="acct-spinner" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="48" height="48"><circle cx="12" cy="12" r="10" stroke-dasharray="50" stroke-dashoffset="50" stroke-linecap="round"/></svg><p>正在准备登录…</p></div>';
          Promise.all([
            fetch('/api/auth/csrf-token', { credentials: 'same-origin' }).catch(function(){}),
            fetch('/api/captcha/generate', { credentials: 'same-origin' }).then(function(r){return r.json();}).catch(function(){return null;})
          ]).then(function(results) {
            var captcha = results[1];
            grid.innerHTML = loginHTML;
            if (captcha && captcha.token) {
              document.getElementById('captchaToken').value = captcha.token;
              document.getElementById('captchaQuestion').textContent = captcha.question || '数学验证';
              document.getElementById('captchaWrap').style.display = 'block';
            }
          });
          return null;
        }
        if (!r.ok) throw new Error('服务器返回 ' + r.status);
        return r.json().catch(function() { throw new Error('服务器响应格式异常'); });
      })
      .then(function(data) {
        if (!data || !data.user || !data.plan) return;
        try {
          grid.innerHTML = buildCards(data);
          document.querySelectorAll('.sr').forEach(function(el) { srObs.observe(el); });
          loadUsageHeatmap();
          if(typeof loadUsageTrend==='function')loadUsageTrend();

          console.error('渲染错误:', e);
          grid.innerHTML = errHTML;
        }
      })
      .catch(function(err) {
        clearTimeout(timeout);
        console.error('账户加载错误:', err);
        if (err.name === 'AbortError') {
          grid.innerHTML = '<div class="acct-state" style="grid-column:1/-1"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="48" height="48"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg><h2>请求超时</h2><p>服务器响应超时，请检查网络后重试。</p><button class="btn btn-outline" onclick="location.reload()">重试</button></div>';

          grid.innerHTML = errHTML;

  /* ── Token 用量热力图 ────────────────────────── */
  function fmtTokens(n) {
    if (n < 1000) return String(n);
    if (n < 10000) return (n / 1000).toFixed(1) + 'K';
    if (n < 1000000) return Math.round(n / 1000) + 'K';
    return (n / 1000000).toFixed(1) + 'M';
  }

  function heatmapLevel(tokens, p95) {
    if (!tokens) return 0;
    if (!p95) return 1;
    var r = tokens / p95;
    if (r < 0.25) return 1;
    if (r < 0.5) return 2;
    if (r < 0.75) return 3;
    return 4;
  }

  function renderHeatmap(data) {
    var summaryEl = document.getElementById('usageHeatmapSummary');
    var bodyEl = document.getElementById('usageHeatmapBody');
    if (!summaryEl || !bodyEl) return;

    if (!data || !data.buckets || data.buckets.length === 0) {
      bodyEl.innerHTML = '<div class="acct-heatmap-empty">暂无 Token 用量数据</div>';
      return;
    }

    summaryEl.innerHTML =
      '<div><strong>' + fmtTokens(data.totalTokens) + '</strong> tokens</div>' +
      '<div><strong>' + data.totalCalls + '</strong> 次调用</div>' +
      '<div>峰值（P95）：<strong>' + fmtTokens(data.p95) + '</strong> / 小时</div>';

    /* 使用本地时区进行日期+小时分组 */
    var buckets = data.buckets || [];
    var p95 = Math.max(data.p95 || 0, 1);
    var byDayHour = {};
    for (var i = 0; i < buckets.length; i++) {
      var d = new Date(buckets[i].hour);
      var y = d.getFullYear(), mo = String(d.getMonth()+1).padStart(2,'0'), da = String(d.getDate()).padStart(2,'0');
      var dateKey = y+'-'+mo+'-'+da;
      if (!byDayHour[dateKey]) byDayHour[dateKey] = {};
      byDayHour[dateKey][d.getHours()] = buckets[i];
    }

    var days = ['日', '一', '二', '三', '四', '五', '六'];
    var today = new Date();
    today.setHours(0, 0, 0, 0);
    var dayList = [];
    for (var off = 6; off >= 0; off--) {
      var dt = new Date(today.getTime() - off * 86400000);
      var y2 = dt.getFullYear(), m2 = String(dt.getMonth()+1).padStart(2,'0'), d2 = String(dt.getDate()).padStart(2,'0');
      dayList.push({ date: dt, key: y2+'-'+m2+'-'+d2 });
    }

    var html = '<div class="acct-heatmap-grid">';
    for (var di = 0; di < dayList.length; di++) {
      var dInfo = dayList[di];
      var dow = dInfo.date.getDay();
      var isToday = (di === dayList.length - 1);

      html += '<div class="acct-heatmap-day-label">';
      if (isToday) {
        html += '今天';
      } else {
        html += '周' + days[dow] + ' ' + (dInfo.date.getMonth() + 1) + '/' + dInfo.date.getDate();
      }
      html += '</div>';

      for (var h = 0; h < 24; h++) {
        var cellData = (byDayHour[dInfo.key] && byDayHour[dInfo.key][h]) || { tokens: 0, calls: 0 };
        var lvl = heatmapLevel(cellData.tokens, p95);
        var tip = cellData.tokens > 0
          ? fmtTokens(cellData.tokens) + ' tokens · ' + cellData.calls + ' 次调用'
          : '无活动';
        html += '<div class="acct-heatmap-cell" data-level="' + lvl + '" data-hour="' + h + '"><span class="acct-heatmap-tooltip">' + tip + '</span></div>';
      }
    }
    html += '</div>';

    html += '<div class="acct-heatmap-axis">' +
      '<span>0时</span><span>6时</span><span>12时</span><span>18时</span><span>23时</span>' +
      '</div>';

    html += '<div class="acct-heatmap-legend">' +
      '<span>少</span>' +
      '<div class="acct-heatmap-legend-cells"><span></span><span></span><span></span><span></span><span></span></div>' +
      '<span>多</span>' +
      '</div>';

    bodyEl.innerHTML = html;
  }

  function loadUsageHeatmap() {
    var bodyEl = document.getElementById('usageHeatmapBody');
    if (!bodyEl) return;

/* ── Token 用量趋势（30 天平滑折线图） ── */
(function(){
  /* fmtTokens is defined inside the outer account IIFE, so it isn't
     visible from this top-level IIFE — define a local copy. */
  function fmtTokens(n){
    if(n<1000)return String(n);
    if(n<10000)return (n/1000).toFixed(1)+'K';
    if(n<1000000)return Math.round(n/1000)+'K';
    return (n/1000000).toFixed(1)+'M';
  }
  function loadTrend(){
    var body=document.getElementById('usageTrendBody');
    var sumEl=document.getElementById('usageTrendSummary');
    if(!body)return;
    fetch('/api/account/usage-trend?days=30',{credentials:'same-origin'})
      .then(function(r){return r.json()})
      .then(function(data){
        if(!data||!data.entries||!data.entries.length){
          body.innerHTML='<div class="acct-heatmap-empty">暂无 Token 用量数据</div>';
          return;
        }
        renderTrendChart(data);
      })
      .catch(function(){
        body.innerHTML='<div class="acct-heatmap-empty">趋势数据加载失败</div>';
      });
  }
  function renderTrendChart(data){
    var body=document.getElementById('usageTrendBody');
    var sumEl=document.getElementById('usageTrendSummary');
    var entries=data.entries||[];
    var W=680,H=200,padL=50,padR=20,padT=10,padB=30;
    var gW=W-padL-padR,gH=H-padT-padB;
    var maxTokens=Math.max.apply(null,entries.map(function(e){return e.tokens}||0));
    if(maxTokens===0)maxTokens=1;
    /* Round up to a nice number */
    var mag=Math.pow(10,Math.floor(Math.log10(maxTokens)));
    maxTokens=Math.ceil(maxTokens/mag)*mag;
    /* Catmull-Rom → Cubic Bezier for smooth curves */
    function catmullRom(pts){
      if(pts.length<2)return'';
      var d='M'+pts[0][0]+','+pts[0][1];
      for(var i=0;i<pts.length-1;i++){
        var p0=pts[Math.max(i-1,0)];
        var p1=pts[i];
        var p2=pts[i+1];
        var p3=pts[Math.min(i+2,pts.length-1)];
        var cp1x=p1[0]+(p2[0]-p0[0])/6;
        var cp1y=p1[1]+(p2[1]-p0[1])/6;
        var cp2x=p2[0]-(p3[0]-p1[0])/6;
        var cp2y=p2[1]-(p3[1]-p1[1])/6;
        d+=' C'+cp1x+','+cp1y+' '+cp2x+','+cp2y+' '+p2[0]+','+p2[1];
      }
      return d;
    }
    /* Map entries to pixel coordinates */
    var pts=[];
    entries.forEach(function(e,i){
      var x=padL+(i/(entries.length-1||1))*gW;
      var y=padT+gH-(e.tokens/maxTokens)*gH;
      pts.push([x,y]);
    });
    var lineD=catmullRom(pts);
    /* Area path (close to bottom) */
    var areaD=lineD+' L'+pts[pts.length-1][0]+','+(padT+gH)+' L'+pts[0][0]+','+(padT+gH)+' Z';
    /* Grid lines (5 horizontal) */
    var gridSvg='';
    for(var g=0;g<=4;g++){
      var gy=padT+gH*(g/4);
      var gVal=Math.round(maxTokens*(1-g/4));
      gridSvg+='<line class="trend-grid" x1="'+padL+'" y1="'+gy+'" x2="'+(W-padR)+'" y2="'+gy+'"/>';
      gridSvg+='<text class="trend-y-label" x="'+(padL-6)+'" y="'+(gy+3)+'">'+fmtTokens(gVal)+'</text>';
    }
    /* X-axis labels: show every 5th day */
    var xLabels='';
    entries.forEach(function(e,i){
      if(i%5===0||i===entries.length-1){
        var lx=padL+(i/(entries.length-1||1))*gW;
        var label=e.day.slice(5); /* MM-DD */
        xLabels+='<text class="trend-axis-label" x="'+lx+'" y="'+(H-4)+'">'+label+'</text>';
      }
    });
    /* Dots */
    var dotsSvg='';
    entries.forEach(function(e,i){
      var px=pts[i][0],py=pts[i][1];
      dotsSvg+='<circle class="trend-dot" cx="'+px+'" cy="'+py+'" r="3"><title>'+e.day+'：'+fmtTokens(e.tokens)+' tokens，'+e.calls+' 次调用</title></circle>';
    });
    var svg='<svg viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg">'+
      '<defs><linearGradient id="trendGrad" x1="0" y1="0" x2="0" y2="1">'+
      '<stop offset="0%" stop-color="hsl(var(--accent-000))" stop-opacity="1"/>'+
      '<stop offset="100%" stop-color="hsl(var(--accent-000))" stop-opacity="0"/>'+
      '</linearGradient></defs>'+
      gridSvg+xLabels+
      '<path class="trend-area" d="'+areaD+'"/>'+
      '<path class="trend-line" d="'+lineD+'"/>'+
      dotsSvg+'</svg>';
    body.innerHTML='<div class="trend-chart-wrap">'+svg+'</div>';
    if(sumEl){
      var totalT=data.totalTokens||entries.reduce(function(s,e){return s+e.tokens},0);
      var totalC=data.totalCalls||entries.reduce(function(s,e){return s+e.calls},0);
      var activeDays=entries.filter(function(e){return e.tokens>0}).length;
      sumEl.innerHTML=
        '<div>总 tokens：<strong>'+fmtTokens(totalT)+'</strong></div>'+
        '<div>聊天调用：<strong>'+fmtTokens(totalC)+'</strong></div>'+
        '<div>活跃天数：<strong>'+activeDays+'</strong></div>'+
        '<div>日均（活跃日）：<strong>'+fmtTokens(activeDays?Math.round(totalT/activeDays):0)+'</strong></div>';
    }
  }
  /* Expose for the page lifecycle */
  window.loadUsageTrend=loadTrend;
})();

/* ── 登录表单处理 ──────────────────────────── */
function loadCaptcha() {
  fetch('/api/captcha/generate', { credentials: 'same-origin' }).then(function(r) { return r.json(); }).then(function(d) {
    var wrap = document.getElementById('captchaWrap');
    var qEl = document.getElementById('captchaQuestion');
    var tEl = document.getElementById('captchaToken');
    if (wrap && qEl && tEl && d && d.token) {
      document.getElementById('captchaToken').value = d.token;
      qEl.textContent = d.question || '数学验证';
      wrap.style.display = 'block';
    }
  }).catch(function() {});
}

function getCookie(name) {
  var m = document.cookie.match(new RegExp('(?:^|;)\\s*' + name.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '=([^;]*)'));
  return m ? m[1] : null;
}

function doLogin(e) {
  e.preventDefault();
  var email = document.getElementById('loginEmail').value.trim();
  var pass = document.getElementById('loginPass').value;
  var captchaToken = document.getElementById('captchaToken').value;
  var captchaAns = document.getElementById('captchaAnswer').value.trim();
  var errEl = document.getElementById('loginError');
  var btn = document.querySelector('#loginForm button[type="submit"]');

  if (!email || !pass) {
    errEl.textContent = '请输入邮箱和密码。';
    errEl.style.display = 'block';
    return false;
  }

  errEl.style.display = 'none';
  btn.textContent = '登录中…';
  btn.disabled = true;

  var csrfToken = getCookie('csrf');
  if (!csrfToken) {
    fetch('/api/auth/csrf-token', { credentials: 'same-origin' }).then(function() {
      csrfToken = getCookie('csrf');
      submitLogin(email, pass, captchaToken, captchaAns, csrfToken, errEl, btn);
    }).catch(function() {
      submitLogin(email, pass, captchaToken, captchaAns, '', errEl, btn);
    });
    return false;
  }
  submitLogin(email, pass, captchaToken, captchaAns, csrfToken, errEl, btn);
  return false;
}

function submitLogin(email, pass, captchaToken, captchaAns, csrfToken, errEl, btn) {
  fetch('/api/auth/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'X-CSRF-Token': csrfToken || '' },
    body: JSON.stringify({ email: email, password: pass, captchaToken: captchaToken || undefined, captchaAnswer: captchaAns || undefined }),
    credentials: 'same-origin'
  }).then(function(r) {
    return r.json().then(function(d) { return { status: r.status, data: d }; });
  }).then(function(res) {
    if (res.status >= 400) {
      var msg = (res.data && res.data.detail) || (res.data && res.data.title) || '登录失败，请重试。';
      if (res.data && res.data.detail === 'Email or password is incorrect') msg = '邮箱或密码错误。';
      if (res.data && res.data.title === 'Invalid CSRF token') msg = '会话已过期，请刷新页面后重试。';
      errEl.textContent = msg;
      errEl.style.display = 'block';
      btn.textContent = '登录';
      btn.disabled = false;
      loadCaptcha();
      return;
    }
    window.location.reload();
  }).catch(function() {
    errEl.textContent = '网络错误，请重试。';
    errEl.style.display = 'block';
    btn.textContent = '登录';
    btn.disabled = false;
  });
  return false;
}

/* ── 危险区域处理器 ──────────────────────────── */

/* ── Toast notification system ────────────────────── */
function showToast(msg, type) {
  type = type || 'info';
  var container = document.getElementById('toastContainer');
  if (!container) { container = document.createElement('div'); container.id = 'toastContainer'; container.className = 'toast-container'; document.body.appendChild(container); }
  var t = document.createElement('div');
  t.className = 'toast ' + type;
  var icons = { success: '\u2713', error: '\u2717', info: '\u2248', warning: '\u26A0' };
  t.innerHTML = '<span class="toast-icon">' + (icons[type] || '\u2248') + '</span><span class="toast-text">' + msg + '</span><button class="toast-close" onclick="this.parentElement.style.animation=\'toastOut .2s var(--ease-out) forwards\';setTimeout(function(){this.parentElement.remove()}.bind(this),200)">\u00D7</button>';
  container.appendChild(t);
  setTimeout(function() { t.style.animation = 'toastOut .2s var(--ease-out) forwards'; setTimeout(function() { if (t.parentNode) t.parentNode.removeChild(t); }, 200); }, 4000);
}
window.showToast = showToast;

/* ── Custom confirm dialog ────────────────────────── */
function showConfirm(title, msg, opts) {
  opts = opts || {};
  return new Promise(function(resolve) {
    var overlay = document.getElementById('confirmOverlay');
    var titleEl = document.getElementById('confirmTitle');
    var msgEl = document.getElementById('confirmMsg');
    var actionsEl = document.getElementById('confirmActions');
    if (!overlay || !titleEl || !msgEl || !actionsEl) { resolve(false); return; }
    titleEl.textContent = title;
    msgEl.textContent = msg;
    actionsEl.innerHTML = '';
    var cancelBtn = document.createElement('button');
    cancelBtn.className = 'confirm-btn cancel';
    cancelBtn.textContent = opts.cancelText || '取消';
    cancelBtn.onclick = function() { overlay.classList.remove('show'); resolve(false); };
    actionsEl.appendChild(cancelBtn);
    var okBtn = document.createElement('button');
    okBtn.className = 'confirm-btn ' + (opts.danger ? 'danger' : 'primary');
    okBtn.textContent = opts.okText || '确定';
    okBtn.onclick = function() { overlay.classList.remove('show'); resolve(true); };
    actionsEl.appendChild(okBtn);
    overlay.classList.add('show');
  });
}
function closeConfirm() { document.getElementById('confirmOverlay').classList.remove('show'); }

/* ── Modal system ─────────────────────────────────── */
function showModal(title, bodyHTML) {
  var overlay = document.getElementById('modalOverlay');
  var titleEl = document.getElementById('modalTitle');
  var bodyEl = document.getElementById('modalBody');
  if (!overlay || !titleEl || !bodyEl) return;
  titleEl.textContent = title;
  bodyEl.innerHTML = bodyHTML;
  overlay.classList.add('show');
}
function closeModal() { document.getElementById('modalOverlay').classList.remove('show'); }

function showExportModal() {
  showModal('下载数据导出',
    '<p style="margin-bottom:14px">为安全起见，请重新输入您的密码以下载数据。</p>' +
    '<label class="modal-label">密码</label><input class="modal-input" id="exportPassword" type="password" placeholder="您的密码" autocomplete="off">' +
    '<div id="exportError" style="font-size:13px;color:hsl(0 60% 60%);margin-bottom:10px;display:none"></div>' +
    '<button class="modal-btn primary full" onclick="doExport()">下载导出</button>'
  );
}
function doExport() {
  var pw = document.getElementById('exportPassword').value;
  if (!pw) { document.getElementById('exportError').textContent = '请输入您的密码。'; document.getElementById('exportError').style.display = 'block'; return; }
  document.getElementById('exportError').style.display = 'none';
  var btn = document.querySelector('#modalBody .modal-btn');
  btn.textContent = '验证中…'; btn.disabled = true;
  /* 先刷新 CSRF cookie，再用 GET 方式下载导出文件 */
  fetch('/api/auth/csrf-token', { credentials: 'same-origin' }).then(function() {
    return fetch('/api/account/export', {
      headers: { 'X-CSRF-Token': getCookie('csrf') || '', 'X-Reauth-Password': pw },
      credentials: 'same-origin'
    });
  }).then(function(r) {
    return r.text().then(function(text) {
      var cd = r.headers.get('Content-Disposition');
      if (r.ok && cd && cd.indexOf('attachment') !== -1) {
        /* 成功获取导出文件 */
        var blob = new Blob([text], { type: 'application/json' });
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url;
        var match = cd.match(/filename="?([^"]+)"?/);
        a.download = match ? match[1] : 'socrates-export.json';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        closeModal();
        showToast('数据导出已成功下载。', 'success');
        return;
      }
      var errData;
      try { errData = JSON.parse(text); } catch(e) { errData = {}; }
      if (r.status === 401) {
        var msg = errData.message || '验证失败';
        document.getElementById('exportError').textContent = msg === 'Re-authentication failed'
          ? '密码错误，请重试。'
          : '您的会话已过期，请刷新页面重新登录。';
        document.getElementById('exportError').style.display = 'block';
        btn.textContent = '下载导出'; btn.disabled = false;
        return;
      }
      throw new Error(errData.message || '服务器返回 ' + r.status);
    });
  }).catch(function(err) {
    closeModal();
    showToast('导出失败：' + (err.message || '未知错误'), 'error');
  });
}

/* ── Danger-zone handlers ──────────────────────────── */
function ensureCsrf() {
  return fetch('/api/auth/csrf-token', { credentials: 'same-origin' }).then(function() { return getCookie('csrf') || ''; });
}

function cancelSubscription() {
  showConfirm('取消订阅？', '您的订阅将持续到当前计费周期结束。之后，您的账户将降级到免费 Diophantus 层级。您的会话历史记录和知识图谱将被保留。', { okText:'取消订阅', cancelText:'保留计划', danger:true }).then(function(confirmed) {
    if (!confirmed) return;
    ensureCsrf().then(function(csrfToken) {
      fetch('/api/account/cancel', { method:'POST', headers:{ 'Content-Type':'application/json', 'X-CSRF-Token':csrfToken||'' }, credentials:'same-origin' })
      .then(function(r) { if (!r.ok) throw new Error('Server returned '+r.status); return r.json(); })
      .then(function() { showToast('订阅已取消。将在当前计费周期结束时到期。', 'success'); window.location.reload(); })
      .catch(function(err) { showToast('无法取消订阅：'+(err&&err.message?err.message:'未知错误'), 'error'); });
    });
  });
}

function deleteAccount() {
  showConfirm('删除账号', '这将永久删除您的所有会话、消息、知识图谱、错题本和 API 密钥。此操作不可撤销。', { okText:'删除账号', danger:true }).then(function(confirmed) {
    if (!confirmed) return;
    showConfirm('您确定吗？', '此操作无法恢复。您的数据将被永久丢失。', { okText:'是，全部删除', danger:true }).then(function(confirmed2) {
      if (!confirmed2) return;
      ensureCsrf().then(function(csrfToken) {
        fetch('/api/auth/account', { method:'DELETE', headers:{ 'Content-Type':'application/json', 'X-CSRF-Token':csrfToken||'' }, credentials:'same-origin' })
        .then(function(r) { if (!r.ok) throw new Error('Server returned '+r.status); return r.json(); })
        .then(function() { showToast('您的账号已被删除。', 'success'); setTimeout(function(){window.location.href='/';},1500); })
        .catch(function(err) { showToast('无法删除账号：'+(err&&err.message?err.message:'未知错误'), 'error'); });
    });
  });
});
}
window.cancelSubscription = cancelSubscription;
window.deleteAccount = deleteAccount;
