name: Build Socrates Cross-platform Clients

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'packages/contracts/**'
      - 'packages/core/**'
      - 'frontend/**'
      - 'server/**'
      - 'tools-rust/**'
      - 'assets/buildResources/**'
      - 'deploy.sh'
      - 'docs/api/openapi.yaml'
      - 'docs/plans/rn-migration.md'
      - '.github/workflows/build-apk.yml'
      - '.github/workflows/build-windows.yml'
      - '.github/workflows/release-clients.yml'
      - 'docs/audits/client-release.md'
      - 'desktop/windows/**'
  pull_request:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'packages/contracts/**'
      - 'packages/core/**'
      - 'frontend/**'
      - 'server/**'
      - 'tools-rust/**'
      - 'assets/buildResources/**'
      - 'deploy.sh'
      - 'docs/api/openapi.yaml'
      - 'docs/plans/rn-migration.md'
      - '.github/workflows/build-apk.yml'
      - '.github/workflows/build-windows.yml'
      - '.github/workflows/release-clients.yml'
      - 'docs/audits/client-release.md'
      - 'desktop/windows/**'
  workflow_dispatch:
    inputs:
      build_profile:
        description: Android build profile
        required: true
        type: choice
        options:
          - debug
          - release
        default: debug
      run_verification:
        description: Run frontend, server, and mobile checks before packaging
        required: true
        type: boolean
        default: true
      build_windows:
        description: Also build the isolated RNW Windows shell
        required: true
        type: boolean
        default: false
      build_windows_only:
        description: Build only the isolated RNW Windows shell
        required: true
        type: boolean
        default: false
      run_device_smoke:
        description: Run the Android emulator Detox smoke suite
        required: true
        type: boolean
        default: false
      device_smoke_only:
        description: Skip verification, web, Android package, and Windows jobs
        required: true
        type: boolean
        default: false
  workflow_call:
    inputs:
      build_profile:
        description: Android and Windows build profile
        required: false
        type: string
        default: release
      run_verification:
        description: Run frontend, server, and mobile checks before packaging
        required: false
        type: boolean
        default: true
      build_windows:
        description: Also build the isolated RNW Windows shell
        required: false
        type: boolean
        default: false
      build_windows_only:
        description: Build only the isolated RNW Windows shell
        required: false
        type: boolean
        default: false
      run_device_smoke:
        description: Run the Android emulator Detox smoke suite
        required: false
        type: boolean
        default: false
      device_smoke_only:
        description: Skip verification, web, Android package, and Windows jobs
        required: false
        type: boolean
        default: false
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        required: false
      ANDROID_KEY_ALIAS:
        required: false
      ANDROID_KEY_PASSWORD:
        required: false
      WINDOWS_PFX_BASE64:
        required: false
      WINDOWS_PFX_PASSWORD:
        required: false
      WINDOWS_PUBLISHER:
        required: false

permissions:
  contents: read

concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.ref }}-
    ${{ inputs.device_smoke_only && 'device' || inputs.build_windows_only && 'windows' || 'full' }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  NPM_CONFIG_REGISTRY: 'https://registry.npmjs.org'
  ANDROID_NDK_VERSION: '27.1.12297006'
  ANDROID_PLATFORM: 'android-35'
  ANDROID_BUILD_TOOLS: '35.0.0'
  RN_ARCHITECTURES: 'arm64-v8a,armeabi-v7a,x86,x86_64'

jobs:
  verify:
    name: Verify shared clients and API contract
    if: >-
      !inputs.build_windows_only &&
      !inputs.device_smoke_only &&
      ((github.event_name != 'workflow_dispatch' && github.event_name != 'workflow_call') || inputs.run_verification)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # check:parity runs `git log -1 -- frontend`; a depth-1 clone
          # resolves that to HEAD regardless of which commit touched
          # frontend, so the webBaseline pin can never match.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            mobile/package-lock.json
            frontend/package-lock.json
            server/package-lock.json

      - name: Verify Expo client
        working-directory: mobile
        run: |
          npm ci
          npm run typecheck
          npm run check:parity
          npm run check:theme
          npm test
          npx expo-doctor

      - name: Verify web client
        working-directory: frontend
        run: |
          npm ci
          rustup target add wasm32-unknown-unknown
          cargo install wasm-bindgen-cli --version 0.2.126 --locked
          npm run build:wasm
          npm run lint
          npm run test:unit
          npm run build

      - name: Verify backend mobile contract
        working-directory: server
        run: |
          npm ci
          npm run typecheck
          node --import tsx --test test/mobile-bootstrap.test.js

      - name: Verify deploy lock, health gate, cleanup, and rollback
        run: bash scripts/test-deploy-flow.sh

  build-web-desktop:
    name: Export React Native desktop web client
    needs: verify
    if: >-
      always() &&
      !inputs.build_windows_only &&
      !inputs.device_smoke_only &&
      (needs.verify.result == 'success' || needs.verify.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: Export Expo Web desktop bundle
        working-directory: mobile
        run: npx expo export --platform web --output-dir ../desktop/dist

      - name: Upload desktop web bundle
        uses: actions/upload-artifact@v4
        with:
          name: socrates-desktop-web-${{ github.sha }}
          path: desktop/dist
          if-no-files-found: error
          retention-days: 14

      - name: Package desktop web bundle for releases
        run: tar -czf "desktop/socrates-desktop-web-${GITHUB_SHA}.tar.gz" -C desktop/dist .

      - name: Upload desktop release bundle
        uses: actions/upload-artifact@v4
        with:
          name: socrates-desktop-web-package-${{ github.sha }}
          path: desktop/socrates-desktop-web-${{ github.sha }}.tar.gz
          if-no-files-found: error
          retention-days: 30

      - name: Install browser regression runner
        working-directory: frontend
        run: |
          npm ci --include=dev
          npx playwright install --with-deps chromium

      - name: Run RN Web boot and responsive smoke tests
        env:
          RN_WEB_BASE_URL: http://127.0.0.1:4174
        run: |
          set -euo pipefail
          python3 -m http.server 4174 --directory desktop/dist > /tmp/socrates-rn-web.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent "$RN_WEB_BASE_URL" >/dev/null; then break; fi
            sleep 1
          done
          cd frontend
          npx playwright test rn-web-smoke.spec.mjs --config=playwright.rn-web.config.mjs

  build-android:
    name: Build Android APK/AAB
    needs: verify
    if: >-
      always() && github.event_name != 'pull_request' &&
      !inputs.build_windows_only &&
      !inputs.device_smoke_only &&
      (needs.verify.result == 'success' || needs.verify.result == 'skipped')
    runs-on: ubuntu-latest
    env:
      # Ordinary pushes and manual builds are safe, non-publishing debug
      # builds. The release workflow calls this reusable workflow explicitly
      # with build_profile=release and supplies signing secrets.
      BUILD_PROFILE: ${{ inputs.build_profile || 'debug' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: android-actions/setup-android@v4
        with:
          # `tools` is an obsolete SDK package and is no longer present in
          # Google's repository. Keep the runner setup limited to the package
          # needed by the pinned component install below.
          packages: platform-tools

      - uses: gradle/actions/setup-gradle@v4

      - name: Install pinned Android SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;${ANDROID_PLATFORM}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK_VERSION}"

      - name: Read Android app version
        run: echo "APP_VERSION=$(node -p "require('./mobile/app.json').expo.version")" >> "$GITHUB_ENV"

      - name: Install dependencies and generate Android project
        working-directory: mobile
        run: |
          npm ci
          npx expo prebuild --platform android --clean --no-install

      - name: Restore production signing key
        if: env.BUILD_PROFILE == 'release'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${ANDROID_KEYSTORE_BASE64:?ANDROID_KEYSTORE_BASE64 is required for release builds}"
          : "${ANDROID_KEYSTORE_PASSWORD:?ANDROID_KEYSTORE_PASSWORD is required for release builds}"
          : "${ANDROID_KEY_ALIAS:?ANDROID_KEY_ALIAS is required for release builds}"
          : "${ANDROID_KEY_PASSWORD:?ANDROID_KEY_PASSWORD is required for release builds}"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > mobile/release.keystore

      - name: Assemble debug APK
        if: env.BUILD_PROFILE == 'debug'
        working-directory: mobile/android
        env:
          NODE_ENV: production
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --console=plain \
            -PreactNativeArchitectures="$RN_ARCHITECTURES"

      - name: Assemble signed release APK and AAB
        if: env.BUILD_PROFILE == 'release'
        working-directory: mobile/android
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/mobile/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          NODE_ENV: production
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease :app:bundleRelease --no-daemon --console=plain \
            -PreactNativeArchitectures="$RN_ARCHITECTURES"

      - name: Verify APK and create checksums
        run: |
          set -euo pipefail
          mkdir -p mobile/dist
          if [ "$BUILD_PROFILE" = debug ]; then
            APK_SOURCE=mobile/android/app/build/outputs/apk/debug/app-debug.apk
            APK_NAME="socrates-android-${APP_VERSION}-debug.apk"
          else
            APK_SOURCE=mobile/android/app/build/outputs/apk/release/app-release.apk
            APK_NAME="socrates-android-${APP_VERSION}.apk"
          fi
          APK_DEST="mobile/dist/$APK_NAME"
          cp "$APK_SOURCE" "$APK_DEST"

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          CERTS=$($APKSIGNER verify --verbose --print-certs "$APK_DEST")
          printf '%s\n' "$CERTS"
          if [ "$BUILD_PROFILE" = release ]; then
            ! printf '%s\n' "$CERTS" | grep -q 'CN=Android Debug'
          fi

          (cd mobile && npm run verify:apk -- "dist/$APK_NAME")
          sha256sum "$APK_DEST" > "$APK_DEST.sha256"

          if [ "$BUILD_PROFILE" = release ]; then
            AAB_SOURCE=mobile/android/app/build/outputs/bundle/release/app-release.aab
            AAB_DEST="mobile/dist/socrates-android-${APP_VERSION}.aab"
            cp "$AAB_SOURCE" "$AAB_DEST"
            sha256sum "$AAB_DEST" > "$AAB_DEST.sha256"
          fi

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: socrates-android-${{ env.BUILD_PROFILE }}-${{ env.APP_VERSION }}-${{ github.sha }}
          path: mobile/dist
          if-no-files-found: error
          retention-days: 30

      - name: Remove signing material
        if: always()
        run: rm -f mobile/release.keystore

  build-windows:
    name: Build RNW Windows shell
    # The native RNW Windows shell is still a prototype whose MSIX packaging
    # needs a debug UCRT SDK that GitHub's Windows image does not ship. Keep it
    # from failing the whole cross-platform run while the shell matures.
    continue-on-error: true
    needs: verify
    if: >-
      always() &&
      (inputs.build_windows || inputs.build_windows_only) &&
      (needs.verify.result == 'success' || needs.verify.result == 'skipped')
    runs-on: windows-latest
    env:
      BUILD_PROFILE: ${{ inputs.build_profile || 'debug' }}
      RN_VERSION: '0.84.1'
      RNW_VERSION: '0.84.0'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Generate lockstep RNW host
        shell: pwsh
        run: |
          $project = Join-Path $env:RUNNER_TEMP 'SocratesWindows'
          if (Test-Path $project) { Remove-Item -Recurse -Force $project }
          Push-Location $env:RUNNER_TEMP
          npx --yes @react-native-community/cli@latest init SocratesWindows --version $env:RN_VERSION --skip-install
          Pop-Location
          Set-Location $project

          npm install --install-links --save --no-audit --no-fund "react-native-windows@$env:RNW_VERSION"
          npm install --install-links --save --no-audit --no-fund `
            (Join-Path $env:GITHUB_WORKSPACE 'packages\contracts') `
            (Join-Path $env:GITHUB_WORKSPACE 'packages\core')
          # init-windows --overwrite regenerates the host project and can reset
          # tsconfig.json (dropping our path mappings). Customize the generated
          # project only AFTER the regeneration so App.tsx, the shared local
          # packages, and the pathed tsconfig survive for typecheck and bundling.
          npx react-native init-windows --overwrite
          if (-not (Test-Path (Join-Path $project 'windows'))) { throw 'RNW did not generate a Windows host project.' }
          Copy-Item (Join-Path $env:GITHUB_WORKSPACE 'desktop\windows\App.tsx') (Join-Path $project 'App.tsx') -Force
          New-Item -ItemType Directory -Force -Path (Join-Path $project 'shared') | Out-Null
          Copy-Item (Join-Path $env:GITHUB_WORKSPACE 'packages\contracts') (Join-Path $project 'shared\contracts') -Recurse -Force
          Copy-Item (Join-Path $env:GITHUB_WORKSPACE 'packages\core') (Join-Path $project 'shared\core') -Recurse -Force
          Copy-Item (Join-Path $env:GITHUB_WORKSPACE 'desktop\windows\tsconfig.json') (Join-Path $project 'tsconfig.json') -Force

      - name: Typecheck Windows shell
        shell: pwsh
        run: |
          Set-Location (Join-Path $env:RUNNER_TEMP 'SocratesWindows')
          npx tsc --noEmit --pretty false

      - name: Select installed Windows SDK
        shell: pwsh
        run: |
          $kitsRoot = Join-Path ([Environment]::GetEnvironmentVariable('ProgramFiles(x86)')) 'Windows Kits\10\Lib'
          $sdk = Get-ChildItem -Path $kitsRoot -Directory |
            Where-Object { $_.Name -match '^\d+\.\d+\.\d+\.\d+$' } |
            Sort-Object { [version]$_.Name } -Descending |
            Select-Object -First 1
          if (-not $sdk) { throw "No Windows SDK found under $kitsRoot" }
          "WINDOWS_SDK_VERSION=$($sdk.Name)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Using Windows SDK $($sdk.Name)"

      - name: Retarget generated Windows project
        shell: pwsh
        run: |
          $project = Join-Path $env:RUNNER_TEMP 'SocratesWindows'
          $windowsRoot = Join-Path $project 'windows'
          $changed = 0
          $projectFiles = Get-ChildItem -Path $windowsRoot -Recurse -File |
            Where-Object { $_.Extension -in @('.props', '.targets', '.vcxproj', '.wapproj') }
          foreach ($file in $projectFiles) {
            $before = [System.IO.File]::ReadAllText($file.FullName)
            $after = [regex]::Replace(
              $before,
              '<WindowsTargetPlatformVersion>[^<]*</WindowsTargetPlatformVersion>',
              "<WindowsTargetPlatformVersion>$env:WINDOWS_SDK_VERSION</WindowsTargetPlatformVersion>"
            )
            $after = [regex]::Replace($after, '10\.0\.22621(?:\.0)?', $env:WINDOWS_SDK_VERSION)
            if ($file.Extension -eq '.wapproj') {
              # The generated package project imports WinUI's debug UCRT SDK by
              # default. GitHub's Windows image has a newer Windows SDK but not
              # the exact 10.0.22621 debug framework package, so opt out of the
              # optional framework dependencies for this standalone RNW shell.
              $after = [regex]::Replace($after, '<WinUISDKReferences>[^<]*</WinUISDKReferences>', '<WinUISDKReferences>false</WinUISDKReferences>')
              if ($after -notmatch '<WinUISDKReferences>') {
                $propertyGroup = [regex]::Match($after, '<PropertyGroup[^>]*>')
                if ($propertyGroup.Success) {
                  $after = $after.Insert($propertyGroup.Index + $propertyGroup.Length, "`r`n    <WinUISDKReferences>false</WinUISDKReferences>")
                }
              }
            }
            if ($after -ne $before) {
              [System.IO.File]::WriteAllText($file.FullName, $after, [System.Text.UTF8Encoding]::new($false))
              $changed++
              Write-Host "Retargeted $($file.FullName)"
            }
          }
          if ($changed -eq 0) {
            Write-Host "Generated Windows project already targets $env:WINDOWS_SDK_VERSION or inherits the runner SDK"
          } else {
            Write-Host "Retargeted $changed generated Windows project file(s) to $env:WINDOWS_SDK_VERSION"
          }

      - name: Set Windows package publisher
        if: env.BUILD_PROFILE == 'release'
        shell: pwsh
        env:
          WINDOWS_PUBLISHER: ${{ secrets.WINDOWS_PUBLISHER }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_PUBLISHER)) {
            throw 'WINDOWS_PUBLISHER is required for Windows release packages.'
          }
          $project = Join-Path $env:RUNNER_TEMP 'SocratesWindows'
          $manifests = @(Get-ChildItem -Path (Join-Path $project 'windows') -Recurse -Filter '*appxmanifest' -File)
          if ($manifests.Count -eq 0) { throw 'No Windows AppX manifest was generated.' }
          foreach ($manifest in $manifests) {
            $before = [IO.File]::ReadAllText($manifest.FullName)
            $after = [regex]::Replace(
              $before,
              'Publisher="[^"]+"',
              [System.Text.RegularExpressions.MatchEvaluator]{ param($match) 'Publisher="' + $env:WINDOWS_PUBLISHER + '"' }
            )
            if ($after -eq $before) { throw "Publisher field was not found in $($manifest.Name)" }
            [IO.File]::WriteAllText($manifest.FullName, $after, [Text.UTF8Encoding]::new($false))
          }

      - name: Build Windows package
        shell: pwsh
        run: |
          Set-Location (Join-Path $env:RUNNER_TEMP 'SocratesWindows')
          $args = @('--arch', 'x64', '--no-launch', '--no-autolink', '--logging', '--msbuildprops', "WindowsTargetPlatformVersion=$env:WINDOWS_SDK_VERSION")
          if ($env:BUILD_PROFILE -eq 'release') { $args += '--release' }
          & npx react-native run-windows @args

      - name: Restore Windows signing certificate
        if: env.BUILD_PROFILE == 'release'
        shell: pwsh
        env:
          WINDOWS_PFX_BASE64: ${{ secrets.WINDOWS_PFX_BASE64 }}
          WINDOWS_PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_PFX_BASE64) -or [string]::IsNullOrWhiteSpace($env:WINDOWS_PFX_PASSWORD)) {
            throw 'WINDOWS_PFX_BASE64 and WINDOWS_PFX_PASSWORD are required for Windows release packages.'
          }
          $pfx = Join-Path $env:RUNNER_TEMP 'socrates-signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_PFX_BASE64))
          "WINDOWS_PFX_PATH=$pfx" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Sign Windows package
        if: env.BUILD_PROFILE == 'release'
        shell: pwsh
        env:
          WINDOWS_PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
        run: |
          $project = Join-Path $env:RUNNER_TEMP 'SocratesWindows'
          $packages = @(Get-ChildItem -Path (Join-Path $project 'windows') -Recurse -File |
            Where-Object { $_.Extension -in @('.msix', '.msixbundle', '.appx', '.appxbundle') })
          if ($packages.Count -eq 0) { throw 'No Windows package was produced for signing.' }
          $signTool = Get-ChildItem -Path (Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\bin') -Recurse -Filter signtool.exe |
            Sort-Object FullName | Select-Object -Last 1
          if (-not $signTool) { throw 'signtool.exe was not found on the Windows runner.' }
          foreach ($package in $packages) {
            & $signTool.FullName sign /fd SHA256 /f $env:WINDOWS_PFX_PATH /p $env:WINDOWS_PFX_PASSWORD $package.FullName
            if ($LASTEXITCODE -ne 0) { throw "signtool failed for $($package.Name)" }
          }

      - name: Collect Windows package
        shell: pwsh
        run: |
          $project = Join-Path $env:RUNNER_TEMP 'SocratesWindows'
          $files = @(Get-ChildItem -Path (Join-Path $project 'windows') -Recurse -File `
            | Where-Object { $_.Extension -in @('.msix', '.msixbundle', '.appx', '.appxbundle', '.zip') })
          if ($files.Count -eq 0) {
            Get-ChildItem -Path (Join-Path $project 'windows') -Recurse -File | Select-Object -First 100 FullName
            throw 'No Windows package was produced.'
          }
          $out = Join-Path $env:GITHUB_WORKSPACE 'desktop\windows-dist'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $files | ForEach-Object { Copy-Item $_.FullName (Join-Path $out $_.Name) -Force }

      - name: Package Windows release bundle
        if: env.BUILD_PROFILE == 'release'
        shell: pwsh
        run: |
          $out = Join-Path $env:GITHUB_WORKSPACE 'desktop\windows-dist'
          $archive = Join-Path $env:RUNNER_TEMP "socrates-windows-$env:BUILD_PROFILE-$env:GITHUB_SHA.zip"
          Compress-Archive -Path (Join-Path $out '*') -DestinationPath $archive -Force
          Copy-Item $archive $out -Force

      - name: Create Windows checksums
        shell: pwsh
        run: |
          $out = Join-Path $env:GITHUB_WORKSPACE 'desktop\windows-dist'
          Get-ChildItem -Path $out -File |
            Where-Object { $_.Name -ne 'SHA256SUMS.txt' } |
            ForEach-Object {
              $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash.ToLowerInvariant()
              "{0}  {1}" -f $hash, $_.Name
            } |
            Set-Content -Path (Join-Path $out 'SHA256SUMS.txt') -Encoding utf8

      - name: Verify signed Windows package
        if: env.BUILD_PROFILE == 'release'
        shell: pwsh
        run: |
          $out = Join-Path $env:GITHUB_WORKSPACE 'desktop\windows-dist'
          $signTool = Get-ChildItem -Path (Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\bin') -Recurse -Filter signtool.exe |
            Sort-Object FullName | Select-Object -Last 1
          foreach ($package in Get-ChildItem -Path $out -File | Where-Object { $_.Extension -in @('.msix', '.msixbundle', '.appx', '.appxbundle') }) {
            & $signTool.FullName verify /pa $package.FullName
            if ($LASTEXITCODE -ne 0) { throw "Signature verification failed for $($package.Name)" }
          }

      - name: Remove Windows signing material
        if: always()
        shell: pwsh
        run: |
          if ($env:WINDOWS_PFX_PATH -and (Test-Path $env:WINDOWS_PFX_PATH)) { Remove-Item -Force $env:WINDOWS_PFX_PATH }

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: socrates-windows-${{ env.BUILD_PROFILE }}-${{ github.sha }}
          path: desktop/windows-dist
          if-no-files-found: error
          retention-days: 30

  build-desktop-exe:
    name: Build Desktop EXE installer
    needs: verify
    if: >-
      always() &&
      !inputs.build_windows_only &&
      !inputs.device_smoke_only &&
      (needs.verify.result == 'success' || needs.verify.result == 'skipped')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Detect Electron desktop shell
        id: electron-shell
        shell: pwsh
        run: |
          if (Test-Path 'desktop/electron/package.json') {
            'present=true' | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          } else {
            'present=false' | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            Write-Host 'desktop/electron is not part of this repository; skipping legacy Electron EXE build.'
          }

      - name: Install mobile dependencies
        if: steps.electron-shell.outputs.present == 'true'
        working-directory: mobile
        run: npm ci

      - name: Export Expo Web desktop bundle
        if: steps.electron-shell.outputs.present == 'true'
        working-directory: mobile
        run: npx expo export --platform web --output-dir ../desktop/dist

      - name: Install Electron build dependencies
        if: steps.electron-shell.outputs.present == 'true'
        working-directory: desktop/electron
        run: npm ci

      - name: Stage web bundle into Electron app
        if: steps.electron-shell.outputs.present == 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path desktop/electron/dist | Out-Null
          Copy-Item -Path desktop/dist/* -Destination desktop/electron/dist -Recurse -Force

      - name: Build EXE installer
        if: steps.electron-shell.outputs.present == 'true'
        working-directory: desktop/electron
        run: npx electron-builder --win nsis --publish never

      - name: Upload EXE installer
        if: steps.electron-shell.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: socrates-desktop-exe-${{ github.sha }}
          path: desktop/electron/release/*.exe
          if-no-files-found: error
          retention-days: 30

  android-device-smoke:
    name: Android emulator RN smoke
    # Emulator boot on the shared GitHub runner is flaky and can exceed the job
    # timeout. Treat it as an informational smoke lane so it never blocks the
    # cross-platform run or the release pipeline.
    continue-on-error: true
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.run_device_smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DETOX_AVD_NAME: 'socrates_api_35'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4
        with:
          # `tools` is an obsolete SDK package and is no longer present in
          # Google's repository. Keep the runner setup limited to the package
          # needed by the pinned component install below.
          packages: platform-tools

      - uses: gradle/actions/setup-gradle@v4

      - name: Free runner disk space
        run: |
          # GitHub's ubuntu-latest image ships large toolchains we do not need
          # here. Removing them before the Detox build/emulator avoids the
          # recurring 'No space left on device' failures on this lane. Keep the
          # Android SDK in /usr/local/lib/android intact because setup-android
          # has already pointed ANDROID_HOME at it.
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/Swift
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install pinned Android build components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;${ANDROID_PLATFORM}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK_VERSION}"

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: Generate Detox-enabled Android project
        working-directory: mobile
        env:
          DETOX_E2E: '1'
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build Detox Android binaries
        working-directory: mobile
        run: npx detox build --configuration android.debug

      - name: Reclaim runner disk for Android emulator
        run: |
          sudo rm -rf -- "$ANDROID_SDK_ROOT/ndk/$ANDROID_NDK_VERSION"
          df -h "$ANDROID_SDK_ROOT" "$RUNNER_TEMP"

      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-socrates-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Detox smoke on Android API 35
        uses: reactivecircus/android-emulator-runner@v2
        env:
          DETOX_AVD_NAME: ${{ env.DETOX_AVD_NAME }}
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          avd-name: ${{ env.DETOX_AVD_NAME }}
          disk-size: 4096M
          ram-size: 2048M
          cores: 4
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          enable-hw-keyboard: true
          emulator-boot-timeout: 900
          working-directory: mobile
          script: |
            mkdir -p e2e-artifacts
            npm run test:e2e -- --headless 2>&1 | tee e2e-artifacts/detox.log

      - name: Upload Detox artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: socrates-android-device-smoke-${{ github.sha }}
          path: mobile/e2e-artifacts
          if-no-files-found: ignore
          retention-days: 14
