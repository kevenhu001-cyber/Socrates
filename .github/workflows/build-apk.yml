name: Build Socrates Cross-platform Clients

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'packages/contracts/**'
      - 'packages/core/**'
      - 'frontend/**'
      - 'server/**'
      - 'tools-rust/**'
      - 'assets/buildResources/**'
      - 'deploy.sh'
      - 'docs/api/openapi.yaml'
      - 'docs/rn-migration.md'
      - '.github/workflows/build-apk.yml'
      - '.github/workflows/build-windows.yml'
      - 'desktop/windows/**'
  pull_request:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'packages/contracts/**'
      - 'packages/core/**'
      - 'frontend/**'
      - 'server/**'
      - 'tools-rust/**'
      - 'assets/buildResources/**'
      - 'deploy.sh'
      - 'docs/api/openapi.yaml'
      - 'docs/rn-migration.md'
      - '.github/workflows/build-apk.yml'
      - '.github/workflows/build-windows.yml'
      - 'desktop/windows/**'
  workflow_dispatch:
    inputs:
      build_profile:
        description: Android build profile
        required: true
        type: choice
        options:
          - debug
          - release
        default: debug
      run_verification:
        description: Run frontend, server, and mobile checks before packaging
        required: true
        type: boolean
        default: true
      build_windows:
        description: Also build the isolated RNW Windows shell
        required: true
        type: boolean
        default: false
      build_windows_only:
        description: Build only the isolated RNW Windows shell
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  NPM_CONFIG_REGISTRY: 'https://registry.npmjs.org'
  ANDROID_NDK_VERSION: '27.1.12297006'
  ANDROID_PLATFORM: 'android-35'
  ANDROID_BUILD_TOOLS: '35.0.0'
  RN_ARCHITECTURES: 'arm64-v8a,armeabi-v7a,x86,x86_64'

jobs:
  verify:
    name: Verify shared clients and API contract
    if: >-
      github.event_name != 'workflow_dispatch' ||
      (inputs.run_verification && !inputs.build_windows_only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            mobile/package-lock.json
            frontend/package-lock.json
            server/package-lock.json

      - name: Verify Expo client
        working-directory: mobile
        run: |
          npm ci
          npm run typecheck
          npm test
          npx expo-doctor

      - name: Verify web client
        working-directory: frontend
        run: |
          npm ci
          rustup target add wasm32-unknown-unknown
          cargo install wasm-bindgen-cli --version 0.2.126 --locked
          npm run build:wasm
          npm run lint
          npm run test:unit
          npm run build

      - name: Verify backend mobile contract
        working-directory: server
        run: |
          npm ci
          npm run typecheck
          node --import tsx --test test/mobile-bootstrap.test.js

      - name: Verify deploy lock, health gate, cleanup, and rollback
        run: bash scripts/test-deploy-flow.sh

  build-web-desktop:
    name: Export React Native desktop web client
    needs: verify
    if: >-
      always() &&
      (github.event_name != 'workflow_dispatch' || !inputs.build_windows_only) &&
      (needs.verify.result == 'success' || needs.verify.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: Export Expo Web desktop bundle
        working-directory: mobile
        run: npx expo export --platform web --output-dir ../desktop/dist

      - name: Upload desktop web bundle
        uses: actions/upload-artifact@v4
        with:
          name: socrates-desktop-web-${{ github.sha }}
          path: desktop/dist
          if-no-files-found: error
          retention-days: 14

      - name: Install browser regression runner
        working-directory: frontend
        run: |
          npm ci --include=dev
          npx playwright install --with-deps chromium

      - name: Run RN Web boot and responsive smoke tests
        env:
          RN_WEB_BASE_URL: http://127.0.0.1:4174
        run: |
          set -euo pipefail
          python3 -m http.server 4174 --directory desktop/dist > /tmp/socrates-rn-web.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent "$RN_WEB_BASE_URL" >/dev/null; then break; fi
            sleep 1
          done
          cd frontend
          npx playwright test rn-web-smoke.spec.mjs --config=playwright.rn-web.config.mjs

  build-android:
    name: Build Android APK/AAB
    needs: verify
    if: >-
      always() && github.event_name != 'pull_request' &&
      (github.event_name != 'workflow_dispatch' || !inputs.build_windows_only) &&
      (needs.verify.result == 'success' || needs.verify.result == 'skipped')
    runs-on: ubuntu-latest
    env:
      BUILD_PROFILE: ${{ github.event_name == 'workflow_dispatch' && inputs.build_profile || 'release' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Install pinned Android SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;${ANDROID_PLATFORM}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK_VERSION}"

      - name: Read Android app version
        run: echo "APP_VERSION=$(node -p "require('./mobile/app.json').expo.version")" >> "$GITHUB_ENV"

      - name: Install dependencies and generate Android project
        working-directory: mobile
        run: |
          npm ci
          npx expo prebuild --platform android --clean --no-install

      - name: Restore production signing key
        if: env.BUILD_PROFILE == 'release'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${ANDROID_KEYSTORE_BASE64:?ANDROID_KEYSTORE_BASE64 is required for release builds}"
          : "${ANDROID_KEYSTORE_PASSWORD:?ANDROID_KEYSTORE_PASSWORD is required for release builds}"
          : "${ANDROID_KEY_ALIAS:?ANDROID_KEY_ALIAS is required for release builds}"
          : "${ANDROID_KEY_PASSWORD:?ANDROID_KEY_PASSWORD is required for release builds}"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > mobile/release.keystore

      - name: Assemble debug APK
        if: env.BUILD_PROFILE == 'debug'
        working-directory: mobile/android
        env:
          NODE_ENV: production
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --console=plain \
            -PreactNativeArchitectures="$RN_ARCHITECTURES"

      - name: Assemble signed release APK and AAB
        if: env.BUILD_PROFILE == 'release'
        working-directory: mobile/android
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/mobile/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          NODE_ENV: production
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease :app:bundleRelease --no-daemon --console=plain \
            -PreactNativeArchitectures="$RN_ARCHITECTURES"

      - name: Verify APK and create checksums
        run: |
          set -euo pipefail
          mkdir -p mobile/dist
          if [ "$BUILD_PROFILE" = debug ]; then
            APK_SOURCE=mobile/android/app/build/outputs/apk/debug/app-debug.apk
            APK_NAME="socrates-android-${APP_VERSION}-debug.apk"
          else
            APK_SOURCE=mobile/android/app/build/outputs/apk/release/app-release.apk
            APK_NAME="socrates-android-${APP_VERSION}.apk"
          fi
          APK_DEST="mobile/dist/$APK_NAME"
          cp "$APK_SOURCE" "$APK_DEST"

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          CERTS=$($APKSIGNER verify --verbose --print-certs "$APK_DEST")
          printf '%s\n' "$CERTS"
          if [ "$BUILD_PROFILE" = release ]; then
            ! printf '%s\n' "$CERTS" | grep -q 'CN=Android Debug'
          fi

          (cd mobile && npm run verify:apk -- "dist/$APK_NAME")
          sha256sum "$APK_DEST" > "$APK_DEST.sha256"

          if [ "$BUILD_PROFILE" = release ]; then
            AAB_SOURCE=mobile/android/app/build/outputs/bundle/release/app-release.aab
            AAB_DEST="mobile/dist/socrates-android-${APP_VERSION}.aab"
            cp "$AAB_SOURCE" "$AAB_DEST"
            sha256sum "$AAB_DEST" > "$AAB_DEST.sha256"
          fi

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: socrates-android-${{ env.BUILD_PROFILE }}-${{ env.APP_VERSION }}-${{ github.sha }}
          path: mobile/dist
          if-no-files-found: error
          retention-days: 30

      - name: Remove signing material
        if: always()
        run: rm -f mobile/release.keystore

  build-windows:
    name: Build RNW Windows shell
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (inputs.build_windows || inputs.build_windows_only)
    runs-on: windows-latest
    env:
      BUILD_PROFILE: ${{ inputs.build_profile }}
      RN_VERSION: '0.84.1'
      RNW_VERSION: '0.84.0'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Generate lockstep RNW host
        shell: pwsh
        run: |
          $project = Join-Path $env:RUNNER_TEMP 'SocratesWindows'
          if (Test-Path $project) { Remove-Item -Recurse -Force $project }
          Push-Location $env:RUNNER_TEMP
          npx --yes @react-native-community/cli@latest init SocratesWindows --version $env:RN_VERSION --skip-install
          Pop-Location
          Set-Location $project

          npm install --save --no-audit --no-fund "react-native-windows@$env:RNW_VERSION"
          npm install --save --no-audit --no-fund `
            (Join-Path $env:GITHUB_WORKSPACE 'packages\contracts') `
            (Join-Path $env:GITHUB_WORKSPACE 'packages\core')
          Copy-Item (Join-Path $env:GITHUB_WORKSPACE 'desktop\windows\App.tsx') (Join-Path $project 'App.tsx') -Force
          npx react-native init-windows --overwrite
          if (-not (Test-Path (Join-Path $project 'windows'))) { throw 'RNW did not generate a Windows host project.' }

      - name: Typecheck Windows shell
        shell: pwsh
        run: |
          Set-Location (Join-Path $env:RUNNER_TEMP 'SocratesWindows')
          npx tsc --noEmit --pretty false

      - name: Build Windows package
        shell: pwsh
        run: |
          Set-Location (Join-Path $env:RUNNER_TEMP 'SocratesWindows')
          $args = @('--arch', 'x64', '--no-launch', '--logging')
          if ($env:BUILD_PROFILE -eq 'release') { $args += '--release' }
          & npx react-native run-windows @args

      - name: Collect Windows package
        shell: pwsh
        run: |
          $project = Join-Path $env:RUNNER_TEMP 'SocratesWindows'
          $files = @(Get-ChildItem -Path (Join-Path $project 'windows') -Recurse -File `
            | Where-Object { $_.Extension -in @('.msix', '.msixbundle', '.appx', '.appxbundle', '.zip') })
          if ($files.Count -eq 0) {
            Get-ChildItem -Path (Join-Path $project 'windows') -Recurse -File | Select-Object -First 100 FullName
            throw 'No Windows package was produced.'
          }
          $out = Join-Path $env:GITHUB_WORKSPACE 'desktop\windows-dist'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $files | ForEach-Object { Copy-Item $_.FullName (Join-Path $out $_.Name) -Force }

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: socrates-windows-${{ env.BUILD_PROFILE }}-${{ github.sha }}
          path: desktop/windows-dist
          if-no-files-found: error
          retention-days: 30
