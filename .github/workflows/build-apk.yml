name: Build Socrates Expo Android APK

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'packages/contracts/**'
      - 'server/**'
      - 'frontend/**'
      - '.github/workflows/build-apk.yml'
  pull_request:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'packages/contracts/**'
      - 'server/**'
      - 'frontend/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify clients and API contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            mobile/package-lock.json
            server/package-lock.json
            frontend/package-lock.json

      - name: Verify Expo client
        working-directory: mobile
        run: |
          npm ci
          npm run typecheck
          npm test
          npx expo-doctor

      - name: Verify server
        working-directory: server
        run: |
          npm ci
          npm run typecheck
          npm test

      - name: Verify web client
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run test:unit
          npm run build

  build-release:
    name: Build signed universal APK
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies and generate Android project
        working-directory: mobile
        run: |
          npm ci
          npx expo prebuild --platform android --clean --no-install

      - name: Restore production signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > mobile/release.keystore

      - name: Assemble signed four-ABI APK
        working-directory: mobile/android
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/mobile/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          NODE_ENV: production
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease -PreactNativeArchitectures=arm64-v8a,armeabi-v7a,x86,x86_64

      - name: Verify signing, ABIs, and checksum
        run: |
          mkdir -p mobile/dist
          cp mobile/android/app/build/outputs/apk/release/app-release.apk mobile/dist/socrates-android-2.0.0.apk
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          CERTS=$("$APKSIGNER" verify --verbose --print-certs mobile/dist/socrates-android-2.0.0.apk)
          printf '%s\n' "$CERTS"
          ! printf '%s\n' "$CERTS" | grep -q 'CN=Android Debug'
          cd mobile
          npm run verify:apk -- dist/socrates-android-2.0.0.apk

      - name: Upload signed APK and checksum
        uses: actions/upload-artifact@v4
        with:
          name: socrates-android-2.0.0-${{ github.sha }}
          path: |
            mobile/dist/socrates-android-2.0.0.apk
            mobile/dist/socrates-android-2.0.0.apk.sha256
          if-no-files-found: error
          retention-days: 30
