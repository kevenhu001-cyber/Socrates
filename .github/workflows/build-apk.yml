name: Build Socrates Cross-platform Clients

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'packages/contracts/**'
      - 'packages/core/**'
      - 'frontend/**'
      - 'server/**'
      - 'tools-rust/**'
      - 'assets/buildResources/**'
      - 'deploy.sh'
      - 'docs/api/openapi.yaml'
      - 'docs/plans/rn-migration.md'
      - '.github/workflows/build-apk.yml'
      - '.github/workflows/release-clients.yml'
      - 'docs/audits/client-release.md'
      - 'desktop/windows/**'
      - 'desktop/electron/**'
  pull_request:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'packages/contracts/**'
      - 'packages/core/**'
      - 'frontend/**'
      - 'server/**'
      - 'tools-rust/**'
      - 'assets/buildResources/**'
      - 'deploy.sh'
      - 'docs/api/openapi.yaml'
      - 'docs/plans/rn-migration.md'
      - '.github/workflows/build-apk.yml'
      - '.github/workflows/release-clients.yml'
      - 'docs/audits/client-release.md'
      - 'desktop/windows/**'
      - 'desktop/electron/**'
  workflow_dispatch:
    inputs:
      build_profile:
        description: Android build profile
        required: true
        type: choice
        options: [debug, release]
        default: debug
      build_universal_preview:
        description: Also build the Universal App standalone preview (not a store release)
        required: false
        type: boolean
        default: false
      run_verification:
        description: Run frontend, server, and mobile checks before packaging
        required: true
        type: boolean
        default: true
      run_device_smoke:
        description: Run the Android emulator Detox smoke suite
        required: true
        type: boolean
        default: false
      device_smoke_only:
        description: Skip verification, web, Android package, and Windows jobs
        required: true
        type: boolean
        default: false
  workflow_call:
    inputs:
      build_profile:
        description: Android and Windows build profile
        required: false
        type: string
        default: release
      build_universal_preview:
        description: Also build the Universal App standalone preview (not a store release)
        required: false
        type: boolean
        default: false
      run_verification:
        description: Run frontend, server, and mobile checks before packaging
        required: false
        type: boolean
        default: true
      run_device_smoke:
        description: Run the Android emulator Detox smoke suite
        required: false
        type: boolean
        default: false
      device_smoke_only:
        description: Skip verification, web, Android package, and Windows jobs
        required: false
        type: boolean
        default: false
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        required: false
      ANDROID_KEY_ALIAS:
        required: false
      ANDROID_KEY_PASSWORD:
        required: false
      WINDOWS_PFX_BASE64:
        required: false
      WINDOWS_PFX_PASSWORD:
        required: false
      WINDOWS_PUBLISHER:
        required: false

permissions:
  contents: read

concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.ref }}-
    ${{ inputs.device_smoke_only && 'device' || 'full' }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  NPM_CONFIG_REGISTRY: 'https://registry.npmjs.org'
  ANDROID_NDK_VERSION: '27.1.12297006'
  ANDROID_PLATFORM: 'android-35'
  ANDROID_BUILD_TOOLS: '35.0.0'
  RN_ARCHITECTURES: 'arm64-v8a,armeabi-v7a,x86,x86_64'

jobs:
  universal-preview:
    if: inputs.build_universal_preview && !inputs.device_smoke_only
    uses: ./.github/workflows/universal-app-build.yml

  verify:
    name: Verify shared clients and API contract
    if: >-
      !inputs.device_smoke_only &&
      ((github.event_name != 'workflow_dispatch' && github.event_name != 'workflow_call') || inputs.run_verification)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      # check:parity is no longer part of this job, so a full-history clone is
      # no longer needed. The default shallow checkout cuts clone time/traffic.
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            mobile/package-lock.json
            frontend/package-lock.json
            server/package-lock.json

      - name: Restore Rust WASM cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/wasm-bindgen
            ~/.cargo/bin/wasm-bindgen-test-runner
            ~/.cargo/bin/wasm2es6js
            tools-rust/target
          key: ${{ runner.os }}-${{ runner.arch }}-rust-wasm-v1-${{ hashFiles('tools-rust/Cargo.lock') }}-wasm-bindgen-0.2.126
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-rust-wasm-v1-

      - name: Verify Expo client
        working-directory: mobile
        run: |
          npm ci --prefer-offline --no-audit --no-fund
          npm run typecheck
          npm run check:theme
          npm test
          npx expo-doctor

      - name: Verify web client
        working-directory: frontend
        run: |
          npm ci --prefer-offline --no-audit --no-fund
          rm -f ../tools-rust/.cargo/config.toml
          rustup target add wasm32-unknown-unknown
          if ! wasm-bindgen --version 2>/dev/null | grep -qx 'wasm-bindgen 0.2.126'; then
            cargo install wasm-bindgen-cli --version 0.2.126 --locked
          fi
          npm run build:wasm
          npm run lint
          npm run test:unit
          npm run build

      - name: Verify backend mobile contract
        working-directory: server
        run: |
          npm ci --prefer-offline --no-audit --no-fund
          npm run typecheck
          node --import tsx --test test/mobile-bootstrap.test.js

      - name: Verify deploy lock, health gate, cleanup, and rollback
        run: bash scripts/test-deploy-flow.sh

  detect-desktop-shell:
    name: Detect optional Electron desktop shell
    if: '!inputs.device_smoke_only'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      present: ${{ steps.detect.outputs.present }}
    steps:
      - uses: actions/checkout@v4
      - id: detect
        name: Detect desktop/electron
        shell: bash
        run: |
          if [ -f desktop/electron/package.json ]; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
            echo 'desktop/electron is absent; Windows Electron runner will not be allocated.'
          fi

  build-web-desktop:
    name: Export React Native desktop web client
    needs: verify
    if: >-
      always() &&
      !inputs.device_smoke_only &&
      (needs.verify.result == 'success' || needs.verify.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          # This job installs both mobile and frontend dependencies.
          cache-dependency-path: |
            mobile/package-lock.json
            frontend/package-lock.json

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Export Expo Web desktop bundle
        working-directory: mobile
        run: npx expo export --platform web --output-dir ../desktop/dist

      - name: Upload desktop web bundle
        uses: actions/upload-artifact@v7
        with:
          name: socrates-desktop-web-${{ github.sha }}
          path: desktop/dist
          if-no-files-found: error
          retention-days: 14

      - name: Package desktop web bundle for releases
        run: tar -czf "desktop/socrates-desktop-web-${GITHUB_SHA}.tar.gz" -C desktop/dist .

      - name: Upload desktop release bundle
        uses: actions/upload-artifact@v7
        with:
          name: socrates-desktop-web-package-${{ github.sha }}
          path: desktop/socrates-desktop-web-${{ github.sha }}.tar.gz
          if-no-files-found: error
          retention-days: 30

      - name: Install browser regression runner
        working-directory: frontend
        run: |
          npm ci --include=dev --prefer-offline --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Run RN Web boot and responsive smoke tests
        env:
          RN_WEB_BASE_URL: http://127.0.0.1:4174
        run: |
          set -euo pipefail
          python3 -m http.server 4174 --directory desktop/dist > /tmp/socrates-rn-web.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent "$RN_WEB_BASE_URL" >/dev/null; then break; fi
            sleep 1
          done
          cd frontend
          npx playwright test rn-web-smoke.spec.mjs --config=playwright.rn-web.config.mjs

  build-android:
    name: Build Android APK/AAB
    needs: verify
    if: >-
      always() && github.event_name != 'pull_request' &&
      !inputs.device_smoke_only &&
      (needs.verify.result == 'success' || needs.verify.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BUILD_PROFILE: ${{ inputs.build_profile || 'debug' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      # setup-gradle is the single Gradle cache owner for this job.
      - uses: gradle/actions/setup-gradle@v4

      - name: Install pinned Android SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;${ANDROID_PLATFORM}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK_VERSION}"

      - name: Read Android app version
        run: echo "APP_VERSION=$(node -p "require('./mobile/app.json').expo.version")" >> "$GITHUB_ENV"

      - name: Install dependencies and generate Android project
        working-directory: mobile
        run: |
          npm ci --prefer-offline --no-audit --no-fund
          npx expo prebuild --platform android --clean --no-install

      - name: Restore production signing key
        if: env.BUILD_PROFILE == 'release'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${ANDROID_KEYSTORE_BASE64:?ANDROID_KEYSTORE_BASE64 is required for release builds}"
          : "${ANDROID_KEYSTORE_PASSWORD:?ANDROID_KEYSTORE_PASSWORD is required for release builds}"
          : "${ANDROID_KEY_ALIAS:?ANDROID_KEY_ALIAS is required for release builds}"
          : "${ANDROID_KEY_PASSWORD:?ANDROID_KEY_PASSWORD is required for release builds}"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > mobile/release.keystore

      - name: Assemble debug APK
        if: env.BUILD_PROFILE == 'debug'
        working-directory: mobile/android
        env:
          NODE_ENV: production
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --build-cache --no-daemon --console=plain \
            -PreactNativeArchitectures="$RN_ARCHITECTURES"

      - name: Assemble signed release APK and AAB
        if: env.BUILD_PROFILE == 'release'
        working-directory: mobile/android
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/mobile/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          NODE_ENV: production
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease :app:bundleRelease --build-cache --no-daemon --console=plain \
            -PreactNativeArchitectures="$RN_ARCHITECTURES"

      - name: Verify APK and create checksums
        run: |
          set -euo pipefail
          mkdir -p mobile/dist
          if [ "$BUILD_PROFILE" = debug ]; then
            APK_SOURCE=mobile/android/app/build/outputs/apk/debug/app-debug.apk
            APK_NAME="socrates-android-${APP_VERSION}-debug.apk"
          else
            APK_SOURCE=mobile/android/app/build/outputs/apk/release/app-release.apk
            APK_NAME="socrates-android-${APP_VERSION}.apk"
          fi
          APK_DEST="mobile/dist/$APK_NAME"
          cp "$APK_SOURCE" "$APK_DEST"

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          CERTS=$($APKSIGNER verify --verbose --print-certs "$APK_DEST")
          printf '%s\n' "$CERTS"
          if [ "$BUILD_PROFILE" = release ]; then
            ! printf '%s\n' "$CERTS" | grep -q 'CN=Android Debug'
          fi

          (cd mobile && npm run verify:apk -- "dist/$APK_NAME")
          sha256sum "$APK_DEST" > "$APK_DEST.sha256"

          if [ "$BUILD_PROFILE" = release ]; then
            AAB_SOURCE=mobile/android/app/build/outputs/bundle/release/app-release.aab
            AAB_DEST="mobile/dist/socrates-android-${APP_VERSION}.aab"
            cp "$AAB_SOURCE" "$AAB_DEST"
            sha256sum "$AAB_DEST" > "$AAB_DEST.sha256"
          fi

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v7
        with:
          name: socrates-android-${{ env.BUILD_PROFILE }}-${{ env.APP_VERSION }}-${{ github.sha }}
          path: mobile/dist
          if-no-files-found: error
          retention-days: 30

      - name: Remove signing material
        if: always()
        run: rm -f mobile/release.keystore

  build-desktop-exe:
    name: Build Desktop EXE installer
    needs: [verify, detect-desktop-shell]
    if: >-
      always() &&
      !inputs.device_smoke_only &&
      (needs.verify.result == 'success' || needs.verify.result == 'skipped') &&
      needs.detect-desktop-shell.outputs.present == 'true'
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            mobile/package-lock.json
            desktop/electron/package-lock.json

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Export Expo Web desktop bundle
        working-directory: mobile
        run: npx expo export --platform web --output-dir ../desktop/dist

      - name: Install Electron build dependencies
        working-directory: desktop/electron
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Stage web bundle into Electron app
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path desktop/electron/dist | Out-Null
          Copy-Item -Path desktop/dist/* -Destination desktop/electron/dist -Recurse -Force

      - name: Build EXE installer
        working-directory: desktop/electron
        run: npx electron-builder --win nsis --publish never

      - name: Upload EXE installer
        uses: actions/upload-artifact@v7
        with:
          name: socrates-desktop-exe-${{ github.sha }}
          path: desktop/electron/release/*.exe
          if-no-files-found: error
          retention-days: 30

  android-device-smoke:
    name: Android emulator RN smoke
    continue-on-error: true
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.run_device_smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DETOX_AVD_NAME: 'socrates_api_35'
      GRADLE_OPTS: '-Dorg.gradle.caching=true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - uses: gradle/actions/setup-gradle@v4

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/Swift
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install pinned Android build components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;${ANDROID_PLATFORM}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK_VERSION}"

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Generate Detox-enabled Android project
        working-directory: mobile
        env:
          DETOX_E2E: '1'
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build Detox Android binaries
        working-directory: mobile
        run: npx detox build --configuration android.debug

      - name: Reclaim runner disk for Android emulator
        run: |
          sudo rm -rf -- "$ANDROID_SDK_ROOT/ndk/$ANDROID_NDK_VERSION"
          df -h "$ANDROID_SDK_ROOT" "$RUNNER_TEMP"

      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-socrates-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Detox smoke on Android API 35
        uses: reactivecircus/android-emulator-runner@v2
        env:
          DETOX_AVD_NAME: ${{ env.DETOX_AVD_NAME }}
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          avd-name: ${{ env.DETOX_AVD_NAME }}
          disk-size: 4096M
          ram-size: 2048M
          cores: 4
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          enable-hw-keyboard: true
          emulator-boot-timeout: 900
          working-directory: mobile
          script: |
            mkdir -p e2e-artifacts
            npm run test:e2e -- --headless 2>&1 | tee e2e-artifacts/detox.log

      - name: Upload Detox artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: socrates-android-device-smoke-${{ github.sha }}
          path: mobile/e2e-artifacts
          if-no-files-found: ignore
          retention-days: 14
