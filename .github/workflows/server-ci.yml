name: Server CI

# Compatibility check for the legacy required-check name. The complete
# database-backed Server gate lives in ci.yml; this lane stays intentionally
# small until branch protection is switched to the aggregate Merge gate.

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'server/**'
      - '.github/workflows/server-ci.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

permissions:
  contents: read

jobs:
  check:
    name: Syntax & lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts --prefer-offline --no-audit --no-fund

      - name: Typecheck and service boundaries
        run: npm run lint
