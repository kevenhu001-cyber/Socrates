name: Socrates Android Device Smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'packages/contracts/**'
      - 'packages/core/**'
      - '.github/workflows/android-device-smoke.yml'
  pull_request:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'packages/contracts/**'
      - 'packages/core/**'
      - '.github/workflows/android-device-smoke.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  ANDROID_PLATFORM: 'android-35'
  ANDROID_BUILD_TOOLS: '35.0.0'
  ANDROID_NDK_VERSION: '27.1.12297006'
  DETOX_AVD_NAME: 'socrates_api_35'
  # Detox owns the Gradle command; this enables the reusable local build cache
  # without having to modify Detox's generated command line.
  GRADLE_OPTS: '-Dorg.gradle.caching=true'

jobs:
  android-device-smoke:
    name: Android emulator RN smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      # This lane deliberately deletes Gradle caches before emulator boot to
      # reclaim disk. Restore shared caches for the build, but do not spend time
      # trying to save an emptied cache in the post step.
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/Swift
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install pinned Android build components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;${ANDROID_PLATFORM}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK_VERSION}"

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Generate Detox-enabled Android project
        working-directory: mobile
        env:
          DETOX_E2E: '1'
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build Detox Android binaries
        working-directory: mobile
        run: npx detox build --configuration android.debug

      - name: Reclaim runner disk for Android emulator
        run: |
          sudo rm -rf -- "$ANDROID_SDK_ROOT/ndk/$ANDROID_NDK_VERSION"
          # The Detox build fills the Gradle cache; the AVD userdata
          # partition needs ~7.4 GB free at /home/runner/.android, so drop
          # build-only caches before the emulator boots.
          rm -rf ~/.gradle/caches ~/.gradle/wrapper
          rm -rf ~/.npm/_cacache
          df -h "$ANDROID_SDK_ROOT" "$RUNNER_TEMP" /home/runner/.android

      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-socrates-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Detox smoke on Android API 35
        uses: reactivecircus/android-emulator-runner@v2
        env:
          DETOX_AVD_NAME: ${{ env.DETOX_AVD_NAME }}
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          avd-name: ${{ env.DETOX_AVD_NAME }}
          disk-size: 4096M
          ram-size: 2048M
          cores: 4
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          enable-hw-keyboard: true
          emulator-boot-timeout: 900
          working-directory: mobile
          script: |
            mkdir -p e2e-artifacts
            npm run test:e2e -- --headless 2>&1 | tee e2e-artifacts/detox.log

      - name: Upload Detox artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: socrates-android-device-smoke-${{ github.sha }}
          path: mobile/e2e-artifacts
          if-no-files-found: ignore
          retention-days: 14
