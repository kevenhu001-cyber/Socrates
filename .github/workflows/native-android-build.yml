name: Native Android build

on:
  push:
    paths:
      - 'apps/socrates-android/**'
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
      - 'frontend/src/render/**'
      - 'frontend/src/vendor-files/**'
      - 'packages/core/**'
      - '.github/workflows/native-android-build.yml'
  pull_request:
    paths:
      - 'apps/socrates-android/**'
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
      - 'frontend/src/render/**'
      - 'frontend/src/vendor-files/**'
      - 'packages/core/**'
      - '.github/workflows/native-android-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend renderer dependencies
        working-directory: frontend
        run: npm ci
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      # PR/push validation is intentionally debug-scoped. `gradlew build` also
      # pulls release/lint lifecycle tasks into this gate, which made unrelated
      # release/lint debt block renderer/shared-package PRs. Release quality is
      # validated separately; this gate proves the native debug app builds,
      # JVM tests pass, and instrumentation tests compile.
      - name: Build debug APK, run JVM tests, and compile instrumentation tests
        working-directory: apps/socrates-android
        run: ./gradlew assembleDebug testDebugUnitTest assembleDebugAndroidTest --stacktrace
      - name: Preserve APKs and verification reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: socrates-native-android
          path: |
            apps/socrates-android/app/build/outputs/apk/debug/*.apk
            apps/socrates-android/app/build/outputs/apk/androidTest/debug/*.apk
            apps/socrates-android/app/build/reports/tests/testDebugUnitTest/
