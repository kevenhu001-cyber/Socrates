name: Native Android build

on:
  push:
    paths:
      - 'apps/socrates-android/**'
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
      - 'frontend/src/render/**'
      - 'frontend/src/vendor-files/**'
      - 'packages/core/**'
      - '.github/workflows/native-android-build.yml'
  pull_request:
    paths:
      - 'apps/socrates-android/**'
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
      - 'frontend/src/render/**'
      - 'frontend/src/vendor-files/**'
      - 'packages/core/**'
      - '.github/workflows/native-android-build.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend renderer dependencies
        working-directory: frontend
        run: npm ci --include=dev --prefer-offline --no-audit --no-fund
      - name: Verify renderer toolchain
        run: npx --yes esbuild@0.25.12 --version
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      # Keep native validation debug-scoped and split by invariant. This makes
      # failures actionable instead of collapsing build/tests into one red step.
      - name: Build debug APK
        working-directory: apps/socrates-android
        shell: bash
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace 2>&1 | tee android-debug-build.log
      - name: Run Android JVM unit tests
        working-directory: apps/socrates-android
        run: ./gradlew testDebugUnitTest --stacktrace
      - name: Compile Android instrumentation tests
        working-directory: apps/socrates-android
        run: ./gradlew assembleDebugAndroidTest --stacktrace
      - name: Preserve APKs and verification reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: socrates-native-android
          if-no-files-found: warn
          path: |
            apps/socrates-android/android-debug-build.log
            apps/socrates-android/app/build/outputs/apk/debug/*.apk
            apps/socrates-android/app/build/outputs/apk/androidTest/debug/*.apk
            apps/socrates-android/app/build/reports/tests/testDebugUnitTest/
