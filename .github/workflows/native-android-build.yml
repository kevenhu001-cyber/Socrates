name: Native Android build

on:
  push:
    paths:
      - 'apps/socrates-android/**'
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
      - 'frontend/src/render/**'
      - 'frontend/src/vendor-files/**'
      - 'packages/core/**'
      - '.github/workflows/native-android-build.yml'
  pull_request:
    paths:
      - 'apps/socrates-android/**'
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
      - 'frontend/src/render/**'
      - 'frontend/src/vendor-files/**'
      - 'packages/core/**'
      - '.github/workflows/native-android-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend renderer dependencies
        working-directory: frontend
        run: npm ci
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build and run JVM tests
        working-directory: apps/socrates-android
        run: ./gradlew build testDebugUnitTest assembleDebugAndroidTest
      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Compose UI tests on a 360dp Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          script: >-
            bash -lc 'set +e;
            adb shell wm size 360x800; size_status=$?;
            adb shell wm density 160; density_status=$?;
            (cd apps/socrates-android && ./gradlew connectedDebugAndroidTest); test_status=$?;
            adb shell wm size reset;
            adb shell wm density reset;
            mkdir -p apps/socrates-android/test-results/emulator-screenshots;
            adb exec-out run-as com.socrates.android tar -cf - files/ui-evidence > apps/socrates-android/test-results/emulator-screenshots.tar; pull_status=$?;
            if [ "$pull_status" -eq 0 ]; then tar -xf apps/socrates-android/test-results/emulator-screenshots.tar -C apps/socrates-android/test-results/emulator-screenshots; pull_status=$?; fi;
            rm -f apps/socrates-android/test-results/emulator-screenshots.tar;
            if [ "$test_status" -ne 0 ]; then exit "$test_status"; fi;
            if [ "$size_status" -ne 0 ]; then exit "$size_status"; fi;
            if [ "$density_status" -ne 0 ]; then exit "$density_status"; fi;
            exit "$pull_status"'
      - name: Preserve APKs and verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: socrates-native-android
          path: |
            apps/socrates-android/app/build/outputs/apk/debug/*.apk
            apps/socrates-android/app/build/outputs/apk/androidTest/debug/*.apk
            apps/socrates-android/app/build/outputs/androidTest-results/connected/
            apps/socrates-android/app/build/reports/tests/testDebugUnitTest/
            apps/socrates-android/app/build/reports/androidTests/
            apps/socrates-android/app/build/reports/lint-results-*.html
            apps/socrates-android/test-results/emulator-screenshots/
