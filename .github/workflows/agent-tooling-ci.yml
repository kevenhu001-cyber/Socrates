name: Agent & tool-calling checks

# Focused signal for agent/tool-calling code. PR runs stay cheap and focused;
# the main CI workflow already owns full frontend/server build coverage.
on:
  workflow_dispatch:
  push:
    branches: [main, 'feat/*', 'p*/**']
    paths:
      - 'server/src/services/toolCallSafety.ts'
      - 'server/src/services/toolTurnPolicy.ts'
      - 'server/src/services/toolErrorFeedback.ts'
      - 'server/src/services/agentStepProjection.ts'
      - 'server/src/services/codexEvents.ts'
      - 'server/src/services/codexHarness.ts'
      - 'server/src/services/agentRuntime.ts'
      - 'server/src/routes/chat/**'
      - 'server/src/routes/agentRuns.ts'
      - 'server/test/**'
      - 'frontend/src/chat/**'
      - 'frontend/src/ui/agentSteps.ts'
      - 'frontend/src/ui/agentMode.js'
      - 'frontend/src/ui/icons/**'
      - 'frontend/src/ui/toolInline.ts'
      - 'frontend/src/ui/toolCards.ts'
      - 'frontend/test/**'
      - 'frontend/e2e/agent-steps.spec.mjs'
      - '.github/workflows/agent-tooling-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'server/src/services/tool*.ts'
      - 'server/src/services/agentStepProjection.ts'
      - 'server/src/services/codex*.ts'
      - 'server/src/routes/chat/**'
      - 'frontend/src/chat/**'
      - 'frontend/src/ui/agent*'
      - 'frontend/test/**'
      - 'frontend/e2e/agent-steps.spec.mjs'
      - '.github/workflows/agent-tooling-ci.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

permissions:
  contents: read

jobs:
  server-tooling:
    name: Server tool-calling
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - run: npm ci --include=dev --prefer-offline --no-audit --no-fund

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Tool-calling and agent projection tests
        run: |
          node --import tsx --test \
            test/toolCallSafety.test.js \
            test/toolTurnPolicy.test.js \
            test/toolErrorFeedback.test.js \
            test/toolRegistry.test.js \
            test/agentStepProjection.test.js \
            test/codexEvents.test.js \
            test/codexCommand.test.js \
            test/chat-helpers.test.js

      - name: Full server suite (manual diagnostic)
        if: github.event_name == 'workflow_dispatch'
        run: npm test

  frontend-agent-ui:
    name: Frontend agent UI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Restore Rust WASM cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/wasm-bindgen
            ~/.cargo/bin/wasm-bindgen-test-runner
            ~/.cargo/bin/wasm2es6js
            tools-rust/target
          key: ${{ runner.os }}-${{ runner.arch }}-rust-wasm-v1-${{ hashFiles('tools-rust/Cargo.lock') }}-wasm-bindgen-0.2.126
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-rust-wasm-v1-

      - run: npm ci --include=dev --prefer-offline --no-audit --no-fund

      # The frontend typecheck imports the generated WASM entry, so this is a
      # real prerequisite even for focused PR checks. Keep only this prerequisite
      # and leave the duplicate full build/browser E2E to the main CI workflow.
      - name: Build Rust WASM support
        run: |
          rm -f ../tools-rust/.cargo/config.toml
          rustup target add wasm32-unknown-unknown
          if ! wasm-bindgen --version 2>/dev/null | grep -qx 'wasm-bindgen 0.2.126'; then
            cargo install wasm-bindgen-cli --version 0.2.126 --locked
          fi
          npm run build:wasm

      - name: TypeScript check
        run: npm run lint

      - name: Agent UI unit tests
        run: |
          node --import tsx --test \
            test/agentSteps.test.mjs \
            test/agentMode.test.mjs \
            test/toolRuntime.test.mjs \
            test/toolInlineErrors.test.mjs \
            test/toolRunState.test.mjs

      - name: Full unit suite (manual diagnostic)
        if: github.event_name == 'workflow_dispatch'
        run: npm run test:unit

      - name: Build
        if: github.event_name != 'pull_request'
        run: npm run build

      - name: Install Playwright Chromium
        if: github.event_name != 'pull_request'
        run: npx playwright install --with-deps chromium

      - name: Agent step e2e
        if: github.event_name != 'pull_request'
        run: npx playwright test e2e/agent-steps.spec.mjs

      - name: Upload Playwright report
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: agent-steps-playwright-report
          path: frontend/playwright-report
          if-no-files-found: ignore
          retention-days: 14
