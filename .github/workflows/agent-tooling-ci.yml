name: Agent & tool-calling checks

# Fast, targeted PR signal for the agent-step and tool-calling path. The full
# product gate remains in ci.yml; direct pushes to main are already covered by
# that workflow, so this focused lane does not run a second time after merge.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'server/src/services/tool*.ts'
      - 'server/src/services/agentStepProjection.ts'
      - 'server/src/services/codex*.ts'
      - 'server/src/services/agentRuntime.ts'
      - 'server/src/routes/chat/**'
      - 'server/src/routes/agentRuns.ts'
      - 'server/test/**'
      - 'frontend/src/chat/**'
      - 'frontend/src/ui/agent*'
      - 'frontend/src/ui/icons/**'
      - 'frontend/src/ui/toolInline.ts'
      - 'frontend/src/ui/toolCards.ts'
      - 'frontend/test/**'
      - 'frontend/e2e/agent-steps.spec.mjs'
      - '.github/workflows/agent-tooling-ci.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

permissions:
  contents: read

jobs:
  server-tooling:
    name: Server tool-calling
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci --include=dev --prefer-offline --no-audit --no-fund
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Tool-calling and agent projection tests
        run: |
          node --import tsx --test \
            test/toolCallSafety.test.js \
            test/toolTurnPolicy.test.js \
            test/toolErrorFeedback.test.js \
            test/toolRegistry.test.js \
            test/agentStepProjection.test.js \
            test/codexEvents.test.js \
            test/codexCommand.test.js \
            test/chat-helpers.test.js
      - name: Full server suite (manual diagnostic)
        if: github.event_name == 'workflow_dispatch'
        run: npm test

  frontend-agent-ui:
    name: Frontend agent UI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Restore Rust WASM cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/wasm-bindgen
            ~/.cargo/bin/wasm-bindgen-test-runner
            ~/.cargo/bin/wasm2es6js
            tools-rust/target
          key: ${{ runner.os }}-${{ runner.arch }}-rust-wasm-v1-${{ hashFiles('tools-rust/Cargo.lock') }}-wasm-bindgen-0.2.126
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-rust-wasm-v1-

      - run: npm ci --include=dev --prefer-offline --no-audit --no-fund

      - name: Build Rust WASM support
        run: |
          rm -f ../tools-rust/.cargo/config.toml
          rustup target add wasm32-unknown-unknown
          if ! wasm-bindgen --version 2>/dev/null | grep -qx 'wasm-bindgen 0.2.126'; then
            cargo install wasm-bindgen-cli --version 0.2.126 --locked
          fi
          npm run build:wasm

      - name: TypeScript check
        run: npm run lint

      - name: Agent UI unit tests
        run: |
          node --import tsx --test \
            test/agentSteps.test.mjs \
            test/agentMode.test.mjs \
            test/toolRuntime.test.mjs \
            test/toolInlineErrors.test.mjs \
            test/toolRunState.test.mjs

      - name: Full unit suite (manual diagnostic)
        if: github.event_name == 'workflow_dispatch'
        run: npm run test:unit

      - name: Build
        run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Agent step e2e
        run: npx playwright test e2e/agent-steps.spec.mjs
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: agent-steps-playwright-report
          path: frontend/playwright-report
          if-no-files-found: ignore
          retention-days: 14
