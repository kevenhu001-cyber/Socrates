name: Build Capacitor Android Compatibility Shell

# The RN/Expo app is the canonical Android release (see release-clients.yml).
# This workflow remains available for teams that still need the web-backed
# Capacitor shell, but it only produces an artifact and never creates a release
# or uploads to a store.

on:
  workflow_dispatch:
    inputs:
      backend_target:
        description: Backend origin embedded in the Capacitor shell
        required: true
        type: choice
        options:
          - prod
          - staging
          - local
        default: prod

permissions:
  contents: read

env:
  ANDROID_PLATFORM: android-35
  ANDROID_BUILD_TOOLS: 35.0.0

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Capacitor debug APK (${{ inputs.backend_target }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            capacitor/package-lock.json

      - name: Restore Rust WASM cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/wasm-bindgen
            ~/.cargo/bin/wasm-bindgen-test-runner
            ~/.cargo/bin/wasm2es6js
            tools-rust/target
          key: ${{ runner.os }}-${{ runner.arch }}-rust-wasm-v1-${{ hashFiles('tools-rust/Cargo.lock') }}-wasm-bindgen-0.2.126
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-rust-wasm-v1-

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      # setup-gradle owns the Gradle User Home/build-cache lifecycle. Avoid a
      # second overlapping setup-java Gradle cache restore/save.
      - uses: gradle/actions/setup-gradle@v4

      - uses: android-actions/setup-android@v4
        with:
          # `tools` is an obsolete SDK package and is no longer present in
          # Google's repository. Keep the runner setup limited to the package
          # needed by the pinned component install below.
          packages: platform-tools

      - name: Install pinned Android SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;${ANDROID_PLATFORM}" "build-tools;${ANDROID_BUILD_TOOLS}"

      - name: Install frontend dependencies and build
        working-directory: frontend
        run: |
          npm ci --prefer-offline --no-audit --no-fund
          # The Vite bundle imports ../../wasm/socrates_wasm.js — build it or
          # the bundle fails at rollup resolution. The rsproxy crates mirror
          # is dev-network only; runners reach crates.io directly.
          rm -f ../tools-rust/.cargo/config.toml
          rustup target add wasm32-unknown-unknown
          if ! wasm-bindgen --version 2>/dev/null | grep -qx 'wasm-bindgen 0.2.126'; then
            cargo install wasm-bindgen-cli --version 0.2.126 --locked
          fi
          npm run build:wasm
          npm run build

      - name: Install Capacitor dependencies
        working-directory: capacitor
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Sync and build debug APK
        working-directory: capacitor
        env:
          SOCRATES_SERVER_URL: ${{ inputs.backend_target == 'prod' && 'https://app.topodrive.top' || inputs.backend_target == 'staging' && 'https://staging.topodrive.top' || 'http://10.0.2.2:3037' }}
        run: |
          npx cap sync android
          # gradlew uses the CWD as the project root — the Gradle build lives
          # in capacitor/android, not capacitor/.
          (cd android && chmod +x gradlew && ./gradlew :app:assembleDebug --build-cache --no-daemon --console=plain)

      - name: Upload Capacitor debug APK
        uses: actions/upload-artifact@v7
        with:
          name: socrates-capacitor-debug-${{ inputs.backend_target }}-${{ github.sha }}
          path: capacitor/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
