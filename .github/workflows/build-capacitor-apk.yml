name: Build Capacitor APK

on:
  push:
    branches: [main]
    paths:
      - 'capacitor/**'
      - 'frontend/**'
      - '.github/workflows/build-capacitor-apk.yml'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type (debug/release)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK (${{ github.event.inputs.build_type || 'debug' }})
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Determine build type
        id: build-type
        run: |
          BUILD_TYPE="${{ github.event.inputs.build_type || 'debug' }}"
          echo "type=$BUILD_TYPE" >> $GITHUB_OUTPUT
          echo "Building $BUILD_TYPE APK"

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Install Capacitor dependencies
        working-directory: capacitor
        run: npm ci

      - name: Sync Capacitor Android
        working-directory: capacitor
        run: npx cap sync android

      - name: Build APK
        working-directory: capacitor/android
        run: |
          ./gradlew :app:assemble${{ steps.build-type.outputs.type == 'release' && 'Release' || 'Debug' }}

      - name: Locate APK
        id: apk
        working-directory: capacitor
        run: |
          APK=$(ls android/app/build/outputs/apk/${{ steps.build-type.outputs.type }}/app-*.apk 2>/dev/null | head -1)
          echo "path=$APK" >> $GITHUB_OUTPUT
          echo "name=$(basename $APK)" >> $GITHUB_OUTPUT
          echo "Found APK: $APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: socrates-capacitor-apk-${{ steps.build-type.outputs.type }}-${{ github.sha }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

  release:
    name: Create Release (debug)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: socrates-capacitor-apk-debug-${{ github.sha }}
          path: ./apk

      - name: Generate release tag and date
        id: tag
        run: |
          DATE_TAG="capacitor-nightly-$(date -u +%Y%m%d-%H%M%S)"
          BUILD_DATE="$(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          echo "tag=$DATE_TAG" >> $GITHUB_OUTPUT
          echo "date=$BUILD_DATE" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "Capacitor Nightly Build ${{ steps.tag.outputs.tag }}"
          body: |
            Auto-built Capacitor APK from the latest commit on `main`.

            - Commit: ${{ github.sha }}
            - Build date: ${{ steps.build-type.outputs.date }}
          files: |
            apk/*.apk
          make_latest: true
          prerelease: true
