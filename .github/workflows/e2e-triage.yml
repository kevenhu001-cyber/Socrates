name: E2E triage

# Temporary manual workflow: run a focused set of Playwright specs against an
# arbitrary ref so a failure can be attributed to a change range. Kept off the
# main CI path (workflow_dispatch only, definition lives on a scratch branch).

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref/SHA to check out and test
        required: true
        default: main
      specs:
        description: Space-separated spec files to run
        required: true
        default: >-
          e2e/chat-light-palette.spec.mjs
          e2e/chat-workbench.spec.mjs
          e2e/composer-blur-verify.spec.mjs
          e2e/composer-tool-visual.spec.mjs
          e2e/composer-tools-compat.spec.mjs
          e2e/exam-regressions.spec.mjs
          e2e/home-customization.spec.mjs
          e2e/home-suggestions.spec.mjs
          e2e/landing-light-visual.spec.mjs
          e2e/mobile-home-visual.spec.mjs
          e2e/session-start.spec.mjs
          e2e/sidebar-compat.spec.mjs
          e2e/ui-stability.spec.mjs

jobs:
  triage:
    name: Triage ${{ inputs.ref }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci --include=dev

      - name: Build Rust WASM support
        run: |
          rustup target add wasm32-unknown-unknown
          cargo install wasm-bindgen-cli --version 0.2.126 --locked
          npm run build:wasm

      - run: npm run build

      - run: npx playwright install --with-deps chromium

      - name: Focused e2e
        env:
          SPECS: ${{ inputs.specs }}
        run: npx playwright test $SPECS --workers=1

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: triage-report-${{ github.run_id }}
          path: frontend/playwright-report
          if-no-files-found: ignore
          retention-days: 7
