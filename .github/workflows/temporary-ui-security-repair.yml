name: Temporary UI dependency security repair
on:
  pull_request:
    types: [synchronize]
    branches: [main]
permissions:
  contents: read
jobs:
  regenerate:
    if: github.event.pull_request.head.ref == 'refactor/ui-v3-phase-2' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve patched lodash
        working-directory: frontend
        run: |
          npm view 'lodash@>4.17.23 <5' version --json
          npm pkg set 'overrides.lodash=>4.17.23 <5'
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Export lockfile delta
        working-directory: frontend
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import {execFileSync} from 'node:child_process';
          const old = JSON.parse(execFileSync('git',['show','HEAD:frontend/package-lock.json'],{encoding:'utf8'}));
          const next = JSON.parse(fs.readFileSync('package-lock.json','utf8'));
          const pkg = JSON.parse(fs.readFileSync('package.json','utf8'));
          console.log('MANIFEST_OVERRIDE '+JSON.stringify(pkg.overrides));
          for(const k of Object.keys(old.packages)) if(!(k in next.packages)) console.log('LOCK_DELTA '+JSON.stringify([k,null]));
          for(const [k,v] of Object.entries(next.packages)) if(JSON.stringify(old.packages[k])!==JSON.stringify(v)) console.log('LOCK_DELTA '+JSON.stringify([k,v]));
          console.log('LOCK_COUNT '+Object.keys(next.packages).length);
          JS
      - name: Verify security ratchet
        run: node scripts/audit-ratchet.mjs frontend
      - name: Validate npm ci
        working-directory: frontend
        run: npm ci --ignore-scripts --no-audit --no-fund
