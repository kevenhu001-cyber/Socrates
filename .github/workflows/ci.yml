name: CI

on:
  # Manual runs let a change be gated from the Actions tab without pushing
  # an empty commit, which matters for long Playwright runs.
  workflow_dispatch:
  push:
    branches: [main, feat/*]
  pull_request:
    branches: [main]

# ─── Why there is no `paths-ignore` here (ADR 0009, landed 2026-09-25) ───
#
# This workflow used to carry `paths-ignore: [docs/**, README*, AGENTS.md,
# CLAUDE.md, .gitignore, .hintrc]` to avoid a 10-minute frontend build on
# documentation PRs. Its own comment recorded the resulting trap: GitHub
# reports NOTHING for a workflow skipped by path filtering, so if branch
# protection marks Frontend / Server / Shared as required status checks, a
# docs-only PR sits at "Pending" forever and can never be merged.
#
# ADR 0009 left the mitigation as an undecided two-way choice: drop the
# required flags, or add a no-op mirror workflow that re-uses the same job
# names. The mirror option is unsound — a PR that touches docs AND code
# triggers both workflows, producing two check runs named "Frontend", and a
# passing no-op can satisfy a requirement that the real job just failed.
#
# So the gate now always triggers and always reports, and a cheap
# `changes` job decides whether the expensive jobs do any work. A job
# skipped by `if:` is reported as successful for required-check purposes,
# which is precisely the property the mirror was trying to fake — without
# the duplicate-name hazard.
#
# Fail-safe: `changes` resolves to code=true whenever it cannot determine
# the diff with confidence (shallow history, force push, first push on a
# branch, unknown event). Wasting CI minutes is the acceptable failure
# mode; skipping the gate is not.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Need history on both sides of the comparison.
          fetch-depth: 0

      - name: Classify changed paths
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          # Paths with no effect on the build. Everything else is code.
          # Kept as an explicit allow-list: an unrecognised path counts as
          # code, so adding a new source tree can never silently opt out.
          #
          # Deliberately NOT `*.md`: prompts/teacher-mode.md,
          # prompts/beagle.md and prompts/code-interpreter.md are loaded at
          # runtime by server/src/lib/prompts.ts and their contents are
          # asserted by server/test/prompts.test.js (length ceilings plus
          # required substrings). A blanket markdown rule would let a prompt
          # edit skip the only test that guards that contract. Markdown
          # elsewhere (mobile/docs/*.md, frontend/*_REPORT.md, per-package
          # README.md) therefore classifies as code and merely costs CI
          # minutes — the safe direction.
          #
          # docs/api/openapi.yaml is inside this bucket on purpose (ADR 0009
          # weighed it explicitly): it is a cross-client contract, but no job
          # in this workflow reads it, so running them proves nothing about a
          # spec-only edit. Move it out of `docs/*` the moment a contract
          # test (Schemathesis / Dredd / generated types) exists to run.
          is_docs_only_path() {
            case "$1" in
              docs/*|README.md|README.zh.md|AGENTS.md|CLAUDE.md|.gitignore|.hintrc|\
              .github/PULL_REQUEST_TEMPLATE.md|.github/CODEOWNERS|LICENSE|design-qa.md)
                return 0 ;;
              *) return 1 ;;
            esac
          }

          base=""
          case "$EVENT" in
            pull_request) base="$BASE_SHA" ;;
            push)         base="$BEFORE_SHA" ;;
            *)            base="" ;;
          esac

          # All-zero SHA means "branch did not exist before" (first push).
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            echo "no usable base ref for $EVENT — running the full gate"
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "base $base not present locally — running the full gate"
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          files="$(git diff --name-only "$base" "$GITHUB_SHA")"
          if [ -z "$files" ]; then
            echo "empty diff — running the full gate"
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "changed files:"
          printf '  %s\n' $files

          code=false
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            if ! is_docs_only_path "$f"; then
              echo "-> code change: $f"
              code=true
              break
            fi
          done <<< "$files"

          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" = "false" ]; then
            echo "documentation-only change: the build/test jobs will be skipped,"
            echo "and a skipped job reports as successful so required checks pass."
          fi

  frontend:
    name: Frontend
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci --include=dev

      - name: Build Rust WASM support
        run: |
          rustup target add wasm32-unknown-unknown
          cargo install wasm-bindgen-cli --version 0.2.126 --locked
          npm run build:wasm

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm run test:unit

      # Blocking. scripts/coverage.baseline.json records the floor; the
      # ratchet fails both when coverage drops below it and when it drifts
      # far enough above that the floor has stopped protecting anything.
      # A 0.5-point downward tolerance absorbs V8 coverage jitter, which was
      # measured at ~0.12 points between identical runs — an exact floor
      # would fail at random and train people to bypass it.
      - name: Coverage floor
        working-directory: .
        run: node scripts/coverage-ratchet.mjs frontend

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end smoke tests
        run: npm run test:smoke

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          if-no-files-found: ignore
          retention-days: 14

  server:
    name: Server
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    # A real Postgres is a correctness requirement, not a nicety.
    # scripts/run-tests.mjs skips every DB-backed suite via t.skip() when
    # DATABASE_URL is absent, which silently excluded the OAuth flow, the
    # auth middleware, login lockout, agent keys, chat turns and the chunk
    # index from the merge gate — i.e. the gate was green while the
    # security-critical paths were never executed. `pgvector/pgvector` is
    # used rather than plain `postgres` so migration 0030..0032 install the
    # vector column instead of taking their graceful-degradation branch,
    # keeping CI on the same schema shape as production.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: socrates
          POSTGRES_PASSWORD: socrates
          POSTGRES_DB: socrates_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U socrates -d socrates_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://socrates:socrates@127.0.0.1:5432/socrates_test
      # crypto.ts refuses to derive encryption keys without a master
      # secret. Supply a throwaway one so the suites exercise the real
      # HKDF path rather than the SOCRATES_ALLOW_DEV_SECRET escape hatch.
      SESSION_SECRET: ci-only-not-a-production-secret-0000000000000000
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - run: npm ci --include=dev

      - name: TypeScript check
        run: npx tsc --noEmit

      # Guards the migration metadata. A stale drizzle snapshot makes the next
      # `db:generate` re-emit already-applied DDL in non-idempotent form,
      # which aborts a production migration on "column already exists" — the
      # part of the system with the least rollback. Caught by hand on
      # 2026-09-25; this makes it a gate. Runs from the repo root.
      - name: Drizzle migration metadata
        working-directory: .
        run: node scripts/check-drizzle-drift.mjs

      - name: Run migrations
        run: npm run db:migrate

      # test:strict fails fast when DATABASE_URL is missing instead of
      # reporting green over skipped suites. Keep this as the gate command
      # so a future change that drops the service container breaks loudly.
      - name: Unit tests (strict — no silent skips)
        run: npm run test:strict

      # Blocking — see the frontend job for the rationale. Runs after
      # test:strict so a plain test failure is reported as such rather than
      # surfacing as a coverage drop.
      - name: Coverage floor
        working-directory: .
        run: node scripts/coverage-ratchet.mjs server

  shared:
    name: Shared packages & Rust protocol
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # socrates-protocol holds the ToolRun phase state machine whose
      # TypeScript twin lives in packages/core. Its unit tests never
      # ran in CI before; no wasm target needed for this crate.
      # (A root `tsc -p tsconfig.json` gate is deferred: packages/core
      # uses `.ts`-suffixed imports that need allowImportingTsExtensions,
      # so it is red on main independent of any change.)
      - name: Rust protocol tests
        run: cargo test -p socrates-protocol
        working-directory: tools-rust

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The other half of the same state machine. Both sides read
      # packages/contracts/toolRunConformance.fixture.json and assert against
      # the same expected values, so a change to one implementation fails the
      # other. Before this the Rust tests were kept in step by a human copying
      # cases between files ("Ported 1:1 from frontend/test/..."), which is
      # exactly the drift a WASM-vs-JS-fallback split makes expensive: it
      # reproduces on some clients and not others.
      - name: TypeScript twin conformance
        run: node --experimental-strip-types --test packages/core/src/toolRunConformance.test.ts
