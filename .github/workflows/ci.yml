name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Main CI always reports on PRs. Expensive product lanes are selected by the
# changed-path classifier instead of workflow-level paths filters, so required
# checks can be skipped safely without getting stuck in Pending.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      site: ${{ steps.filter.outputs.site }}
      frontend: ${{ steps.filter.outputs.frontend }}
      server: ${{ steps.filter.outputs.server }}
      shared: ${{ steps.filter.outputs.shared }}
      universal: ${{ steps.filter.outputs.universal }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          if [[ "$EVENT" == "workflow_dispatch" ]]; then
            bash scripts/ci-classify.sh --all | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi

          base=""
          case "$EVENT" in
            pull_request) base="$BASE_SHA" ;;
            push)         base="$BEFORE_SHA" ;;
          esac

          if [[ -z "$base" || "$base" == "0000000000000000000000000000000000000000" ]]; then
            echo "No usable base SHA; running the full gate"
            bash scripts/ci-classify.sh --all | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "Base $base is unavailable locally; running the full gate"
            bash scripts/ci-classify.sh --all | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi

          files="$(git diff --name-only "$base" "$GITHUB_SHA")"
          if [[ -z "$files" ]]; then
            echo "Empty diff; running the full gate"
            bash scripts/ci-classify.sh --all | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Changed files:"
          printf '  %s\n' $files
          printf '%s\n' "$files" | bash scripts/ci-classify.sh | tee -a "$GITHUB_OUTPUT"

  sanity:
    name: Repo sanity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: No merge-conflict markers
        run: |
          if git grep -nE '^(<{7}|>{7}|\|{7})([[:space:]]|$)|^={7}$' -- .; then
            echo "::error::merge-conflict markers committed — resolve or remove them"
            exit 1
          fi
          echo "clean: no conflict markers in tracked files"

      - name: CI gate routing regression tests
        run: bash scripts/test-ci-classify.sh

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install root tooling
        run: npm ci --ignore-scripts --prefer-offline --no-audit --no-fund

      - name: Workflow action pinning
        run: npm run lint:action-pinning

      - name: Published OpenAPI projection check and focused test
        run: |
          npm run openapi:check
          npm run test:openapi

      - name: Delivery guard regression tests
        run: |
          node --test scripts/test-verify-sbom.mjs
          bash scripts/test-deploy-flow.sh

      - name: OpenAPI drift ratchet
        run: node scripts/check-openapi-drift.mjs

  site:
    name: Site
    needs: changes
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install root tooling
        run: npm ci --ignore-scripts --prefer-offline --no-audit --no-fund
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Site chrome sync and browser tests
        run: npm run test:site

  frontend:
    name: Frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Restore Rust WASM cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/wasm-bindgen
            ~/.cargo/bin/wasm-bindgen-test-runner
            ~/.cargo/bin/wasm2es6js
            tools-rust/target
          key: ${{ runner.os }}-${{ runner.arch }}-rust-wasm-v1-${{ hashFiles('tools-rust/Cargo.lock') }}-wasm-bindgen-0.2.126
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-rust-wasm-v1-

      - run: npm ci --include=dev --prefer-offline --no-audit --no-fund

      - name: Build Rust WASM support
        run: |
          rm -f ../tools-rust/.cargo/config.toml
          rustup target add wasm32-unknown-unknown
          if ! wasm-bindgen --version 2>/dev/null | grep -qx 'wasm-bindgen 0.2.126'; then
            cargo install wasm-bindgen-cli --version 0.2.126 --locked
          fi
          npm run build:wasm

      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Bundle size ceiling
        working-directory: .
        run: node scripts/check-bundle-size.mjs
      - name: Unit tests
        run: npm run test:unit
      - name: Coverage floor
        working-directory: .
        run: node scripts/coverage-ratchet.mjs frontend
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      # Geometry/parity checks are useful design feedback, but intentional UI
      # changes should not make an otherwise healthy PR unmergeable.
      - name: Parity geometry advisory
        continue-on-error: true
        run: |
          node e2e/dist-server.mjs &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true' EXIT
          for _ in $(seq 1 40); do
            if curl -sf -o /dev/null http://127.0.0.1:4173/; then break; fi
            sleep 0.5
          done
          curl -sf -o /dev/null http://127.0.0.1:4173/ || {
            echo "::error::dist-server did not come up on :4173"
            exit 1
          }
          npm run parity:check
      - name: End-to-end smoke tests
        run: npm run test:smoke
      - name: Mobile composer UX smoke tests
        run: npm run test:smoke:mobile
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-report
          path: frontend/playwright-report
          if-no-files-found: ignore
          retention-days: 14

  server:
    name: Server
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: socrates
          POSTGRES_PASSWORD: socrates
          POSTGRES_DB: socrates_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U socrates -d socrates_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://socrates:socrates@127.0.0.1:5432/socrates_test
      SESSION_SECRET: ci-only-not-a-production-secret-0000000000000000
      NODE_ENV: test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci --include=dev --prefer-offline --no-audit --no-fund
      - name: TypeScript and service boundaries
        run: npm run lint
      - name: Install Agent isolation runtime for boundary tests
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends bubblewrap
      - name: Drizzle migration metadata
        working-directory: .
        run: node scripts/check-drizzle-drift.mjs
      - name: Run migrations
        run: npm run db:migrate
      - name: Unit tests (strict — no silent skips)
        run: npm run test:strict
      - name: Coverage floor
        working-directory: .
        run: node scripts/coverage-ratchet.mjs server

  shared:
    name: Shared packages & Rust protocol
    needs: changes
    if: needs.changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Restore Rust protocol cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tools-rust/target
          key: ${{ runner.os }}-${{ runner.arch }}-rust-protocol-v1-${{ hashFiles('tools-rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-rust-protocol-v1-
      - name: Rust protocol tests
        run: rm -f .cargo/config.toml && cargo test -p socrates-protocol
        working-directory: tools-rust
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: TypeScript twin conformance
        run: node --experimental-strip-types --test packages/core/src/toolRunConformance.test.ts
      - name: Playback clock tests
        run: node --experimental-strip-types --test packages/core/src/streamPlayer.test.ts

  universal-app:
    name: Universal App web smoke
    needs: changes
    if: needs.changes.outputs.universal == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            apps/socrates/package-lock.json
            frontend/package-lock.json
      - name: Install Universal App dependencies
        run: npm ci --include=dev --prefer-offline --no-audit --no-fund
        working-directory: apps/socrates
      - name: Universal App typecheck and shared tests
        run: |
          npm run typecheck
          npm run test:shared
          node ../../scripts/check-packages-dom.mjs
        working-directory: apps/socrates
      - name: Install Playwright dependencies
        run: npm ci --include=dev --prefer-offline --no-audit --no-fund
        working-directory: frontend
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Universal App smoke tests
        run: npm run test:universal
        working-directory: frontend
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: universal-app-report
          path: frontend/test-results
          if-no-files-found: ignore
          retention-days: 14

  gate:
    name: Merge gate
    if: always()
    needs: [changes, sanity, site, frontend, server, shared, universal-app]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every applicable lane
        env:
          CHANGES: ${{ needs.changes.result }}
          SANITY: ${{ needs.sanity.result }}
          SITE: ${{ needs.site.result }}
          FRONTEND: ${{ needs.frontend.result }}
          SERVER: ${{ needs.server.result }}
          SHARED: ${{ needs.shared.result }}
          UNIVERSAL: ${{ needs.universal-app.result }}
        run: |
          set -euo pipefail

          [[ "$CHANGES" == success ]] || {
            echo "::error::Detect changes failed: $CHANGES"
            exit 1
          }
          [[ "$SANITY" == success ]] || {
            echo "::error::Repo sanity failed: $SANITY"
            exit 1
          }

          failed=0
          for pair in \
            "Site:$SITE" \
            "Frontend:$FRONTEND" \
            "Server:$SERVER" \
            "Shared:$SHARED" \
            "Universal:$UNIVERSAL"; do
            name="${pair%%:*}"
            result="${pair#*:}"
            case "$result" in
              success|skipped)
                echo "$name: $result"
                ;;
              *)
                echo "::error::$name lane finished with $result"
                failed=1
                ;;
            esac
          done

          exit "$failed"
