name: CI

on:
  # Manual runs let a change be gated from the Actions tab without pushing
  # an empty commit, which matters for long Playwright runs.
  workflow_dispatch:
  push:
    branches: [main, feat/*]
    # paths-ignore is cumulative: jobs that do not depend on the changed
    # paths run trivially and waste CI budget. Doc-only and config-only
    # changes fall under this opt-out (docs/adr, docs/audits, docs/plans,
    # docs/STRUCTURE.md, README, AGENTS.md, .gitignore). The 3 jobs in this
    # workflow (frontend / server / shared) re-trigger on the next PR that
    # touches code, so docs-only PRs still get reviewed.
    #
    # WARNING: when a workflow is skipped by path filtering, GitHub keeps
    # its checks "Pending" forever — a docs-only PR becomes unmergeable if
    # branch protection marks Frontend/Server/Shared as required. Either do
    # not mark them required, or add a no-op mirror workflow (ADR 0009).
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'README.zh.md'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - '.gitignore'
      - '.hintrc'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'README.zh.md'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - '.gitignore'
      - '.hintrc'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci --include=dev

      - name: Build Rust WASM support
        run: |
          rustup target add wasm32-unknown-unknown
          cargo install wasm-bindgen-cli --version 0.2.126 --locked
          npm run build:wasm

      - name: Lint
        run: npm run lint

      - name: ESLint
        run: npm run lint:eslint

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm run test:unit

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end smoke tests
        run: npm run test:smoke

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          if-no-files-found: ignore
          retention-days: 14

  server:
    name: Server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - run: npm ci --include=dev

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Unit tests
        run: node scripts/run-tests.mjs

  shared:
    name: Shared packages & Rust protocol
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # socrates-protocol holds the ToolRun phase state machine whose
      # TypeScript twin lives in packages/core. Its unit tests never
      # ran in CI before; no wasm target needed for this crate.
      # (A root `tsc -p tsconfig.json` gate is deferred: packages/core
      # uses `.ts`-suffixed imports that need allowImportingTsExtensions,
      # so it is red on main independent of any change.)
      - name: Rust protocol tests
        run: cargo test -p socrates-protocol
        working-directory: tools-rust
