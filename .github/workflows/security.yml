name: Security

# Supply-chain and static-analysis gate. Deliberately not path-filtered: a
# security gate must report a check on every PR, and scheduled runs catch new
# advisories in unchanged dependencies.

on:
  push:
    branches: [main, 'feat/*']
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]
    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}

  dependencies:
    name: Dependency audit (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [frontend, server, apps/socrates]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ${{ matrix.project }}/package-lock.json

      - name: Dependency audit ratchet
        working-directory: .
        run: node scripts/audit-ratchet.mjs ${{ matrix.project }}

  sbom:
    name: SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            server/package-lock.json
            apps/socrates/package-lock.json

      - name: Restore generated SBOMs
        id: sbom-cache
        uses: actions/cache@v4
        with:
          path: sbom
          key: >-
            ${{ runner.os }}-sbom-cdx-6.0.1-v4-lockonly-${{
              hashFiles('frontend/package-lock.json', 'server/package-lock.json', 'apps/socrates/package-lock.json')
            }}

      - name: Install CycloneDX CLI once
        if: steps.sbom-cache.outputs.cache-hit != 'true'
        run: npm install --global @cyclonedx/cyclonedx-npm@6.0.1 --prefer-offline --no-audit --no-fund

      - name: Generate CycloneDX SBOMs
        if: steps.sbom-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p sbom
          for project in frontend server apps/socrates; do
            echo "::group::$project"
            # --package-lock-only: the SBOM is derived from the lockfile, which
            # is the authoritative, reviewable supply-chain record. Without it
            # cyclonedx-npm shells out to `npm ls --all`, which walks the
            # symlinked `file:../../packages/*` links under apps/socrates and
            # reports ELSPROBLEMS (their own transitive deps are never
            # installed), turning every run into a false compliance failure.
            # No `npm ci` here: nothing is executed and the lockfile alone
            # describes the dependency set, so skipping the install also
            # removes the download step from the SBOM job entirely.
            cyclonedx-npm \
              --package-lock-only \
              --output-format JSON \
              --output-file "sbom/${project//\//-}.cdx.json" \
              "$project/package-lock.json"
            echo "::endgroup::"
          done

      - name: Verify SBOM cache/generation output
        run: |
          test -s sbom/frontend.cdx.json
          test -s sbom/server.cdx.json
          test -s sbom/apps-socrates.cdx.json
          # A silently empty SBOM is worse than a failing one: assert each file
          # actually carries a dependency graph, not just valid JSON.
          for f in sbom/*.cdx.json; do
            node -e '
              const b = require(process.argv[1]);
              const n = (b.components || []).length;
              if (!b.metadata || !b.metadata.component) throw new Error(`no metadata.component in ${process.argv[1]}`);
              if (n < 1) throw new Error(`no components in ${process.argv[1]}`);
              console.log(`${process.argv[1]}: ${n} components`);
            ' "$f"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom/
          retention-days: 90
