name: Security

# Supply-chain and static-analysis gate. Before 2026-09-25 the repository
# had none of these: no secret scanning, no SAST, and the only dependency
# audit (`server-ci.yml`) carried `continue-on-error: true`, so it could
# never fail a merge. Nine workflows existed and none of them would have
# noticed a committed credential or an injected sink.
#
# Deliberately NOT path-filtered. A security gate that skips because "only
# the lockfile changed" is the wrong shape, and ci.yml already documents
# how path filtering leaves required checks Pending forever (ADR 0009).

on:
  push:
    branches: [main, 'feat/*']
  pull_request:
    branches: [main]
  schedule:
    # Advisories land continuously; a weekly run catches a new CVE in an
    # unchanged dependency, which a push-triggered job never would.
    - cron: '17 4 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded pushes/PR revisions should not consume runners. Manual and
  # scheduled security audits are intentional snapshots and are never cancelled.
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Gitleaks scans history, not just the worktree. A secret that was
          # committed and then "removed" in a later commit is still in the
          # pack and still compromised, so the full history is the unit of
          # review. This repo has a force-pushed history
          # (backup-main-before-force-20260907) which makes a baseline scan
          # especially worth having.
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # javascript-typescript covers frontend/, server/, mobile/ and
        # packages/ in one database. tools-rust/ is not supported by CodeQL;
        # `cargo clippy`/`cargo audit` is the equivalent there and is
        # tracked separately rather than faked here.
        language: [javascript-typescript]
    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          # The input is `languages` — `language` is silently ignored, which
          # makes init autodetect every language in the repo. That pulls in
          # capacitor/android's Java and fails finalize with "could not
          # process" because there is no Gradle build for CodeQL to run.
          languages: ${{ matrix.language }}
          # security-extended adds the taint-tracking queries that matter
          # for this codebase's shape: SSRF, path traversal in the agent
          # workspace file routes, and unsafe HTML sinks in the renderer.
          queries: security-extended

      # No build step: the JS/TS extractor works from source. Skipping
      # autobuild avoids failing on the independent npm projects.
      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}

  dependencies:
    name: Dependency audit (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [frontend, server, mobile]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ${{ matrix.project }}/package-lock.json

      # A real gate: no continue-on-error. It runs through
      # scripts/audit-ratchet.mjs rather than bare `npm audit` because the
      # repo inherited a backlog. The ratchet fails on any NEW high/critical
      # advisory, and also fails when a baselined one stops reproducing.
      - name: Dependency audit ratchet
        working-directory: .
        run: node scripts/audit-ratchet.mjs ${{ matrix.project }}

  sbom:
    name: SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          # A cold SBOM build still benefits from npm tarball reuse.
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            server/package-lock.json
            mobile/package-lock.json

      # The SBOM is deterministic for these three lockfiles and the pinned
      # CycloneDX generator. Cache the generated documents themselves so the
      # common case can skip three npm installs and generation entirely.
      - name: Restore generated SBOMs
        id: sbom-cache
        uses: actions/cache@v4
        with:
          path: sbom
          key: >-
            ${{ runner.os }}-sbom-cdx-6.0.1-v1-${{
              hashFiles('frontend/package-lock.json', 'server/package-lock.json', 'mobile/package-lock.json')
            }}

      - name: Install CycloneDX CLI once
        if: steps.sbom-cache.outputs.cache-hit != 'true'
        run: npm install --global @cyclonedx/cyclonedx-npm@6.0.1 --prefer-offline --no-audit --no-fund

      # An SBOM per client is the prerequisite for answering "are we
      # affected by CVE-X" without re-resolving trees by hand, and for
      # signing releases later. Generated from the lockfiles so it reflects
      # what actually installs.
      - name: Generate CycloneDX SBOMs
        if: steps.sbom-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p sbom
          for project in frontend server mobile; do
            echo "::group::$project"
            (cd "$project" && npm ci --ignore-scripts --prefer-offline --no-audit --no-fund)
            cyclonedx-npm \
              --output-format JSON \
              --output-file "sbom/${project}.cdx.json" \
              "$project/package-lock.json"
            echo "::endgroup::"
          done

      - name: Verify SBOM cache/generation output
        run: |
          test -s sbom/frontend.cdx.json
          test -s sbom/server.cdx.json
          test -s sbom/mobile.cdx.json

      - uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom/
          retention-days: 90
