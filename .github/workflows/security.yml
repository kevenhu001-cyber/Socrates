name: Security

# Supply-chain and static-analysis gate. Deliberately not path-filtered: a
# security gate must report a check on every PR, and scheduled runs catch new
# advisories in unchanged dependencies.

on:
  push:
    branches: [main, 'feat/*']
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: github/codeql-action/init@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      - uses: github/codeql-action/analyze@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3
        with:
          category: /language:${{ matrix.language }}

  dependencies:
    name: Dependency audit (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [frontend, server, apps/socrates]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ${{ matrix.project }}/package-lock.json

      - name: Dependency audit ratchet
        working-directory: .
        run: node scripts/audit-ratchet.mjs ${{ matrix.project }}

  sbom:
    name: SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            server/package-lock.json
            apps/socrates/package-lock.json

      - name: Restore generated SBOMs
        id: sbom-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: sbom
          key: >-
            ${{ runner.os }}-sbom-cdx-6.0.1-v4-lockonly-${{
              hashFiles('frontend/package-lock.json', 'server/package-lock.json', 'apps/socrates/package-lock.json')
            }}

      - name: Install CycloneDX CLI once
        if: steps.sbom-cache.outputs.cache-hit != 'true'
        run: npm install --global @cyclonedx/cyclonedx-npm@6.0.1 --prefer-offline --no-audit --no-fund

      - name: Generate CycloneDX SBOMs
        if: steps.sbom-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p sbom
          for project in frontend server apps/socrates; do
            echo "::group::$project"
            # --package-lock-only: build the SBOM from the lockfile, the
            # authoritative and reviewable supply-chain record, rather than
            # from whatever node_modules happens to be installed.
            # --ignore-npm-errors: even in lockfile-only mode the tool shells
            # out to `npm ls`, which walks the symlinked `file:../../packages/*`
            # links under apps/socrates. Those packages are first-party source,
            # never installed, so npm reports their own deps (react, zustand,
            # @socrates/contracts) as ELSPROBLEMS and exits non-zero. That is a
            # layout artefact, not a broken dependency tree — the lockfile is
            # still a complete and correct inventory.
            # No `npm ci` here: nothing is executed and the lockfile alone
            # describes the dependency set, so this also drops the download step.
            # Completeness is asserted in the verification step below.
            cyclonedx-npm \
              --package-lock-only \
              --ignore-npm-errors \
              --output-format JSON \
              --output-file "sbom/${project//\//-}.cdx.json" \
              "$project/package-lock.json"
            echo "::endgroup::"
          done

      - name: Verify SBOM cache/generation output
        run: |
          node scripts/verify-sbom.mjs sbom

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sbom
          path: sbom/
          retention-days: 90
