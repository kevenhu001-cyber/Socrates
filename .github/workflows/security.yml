name: Security

# PRs get fast blocking security signals (secrets + dependency ratchets).
# Expensive whole-repo analysis (CodeQL + SBOM) still reports under the same
# check names, but does heavy work only on main, schedule, or manual runs.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    name: CodeQL (javascript-typescript)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: PR fast-path
        if: github.event_name == 'pull_request'
        run: echo 'CodeQL full analysis is deferred to main/scheduled runs; PR remains covered by secret and dependency gates.'

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: github.event_name != 'pull_request'

      - uses: github/codeql-action/init@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3
        if: github.event_name != 'pull_request'
        with:
          languages: javascript-typescript
          queries: security-extended

      - uses: github/codeql-action/analyze@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3
        if: github.event_name != 'pull_request'
        with:
          category: /language:javascript-typescript

  dependencies:
    name: Dependency audit (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [frontend, server, apps/socrates]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/package-lock.json

      - name: Dependency audit ratchet
        working-directory: .
        run: node scripts/audit-ratchet.mjs ${{ matrix.project }}

  sbom:
    name: SBOM
    runs-on: ubuntu-latest
    steps:
      - name: PR fast-path
        if: github.event_name == 'pull_request'
        run: echo 'SBOM generation is deferred to main/scheduled runs.'

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: github.event_name != 'pull_request'

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: github.event_name != 'pull_request'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            server/package-lock.json
            apps/socrates/package-lock.json

      - name: Restore generated SBOMs
        id: sbom-cache
        if: github.event_name != 'pull_request'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: sbom
          key: >-
            ${{ runner.os }}-sbom-cdx-6.0.1-v4-lockonly-${{
              hashFiles('frontend/package-lock.json', 'server/package-lock.json', 'apps/socrates/package-lock.json')
            }}

      - name: Install CycloneDX CLI once
        if: github.event_name != 'pull_request' && steps.sbom-cache.outputs.cache-hit != 'true'
        run: npm install --global @cyclonedx/cyclonedx-npm@6.0.1 --prefer-offline --no-audit --no-fund

      - name: Generate CycloneDX SBOMs
        if: github.event_name != 'pull_request' && steps.sbom-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p sbom
          for project in frontend server apps/socrates; do
            echo "::group::$project"
            cyclonedx-npm \
              --package-lock-only \
              --ignore-npm-errors \
              --output-format JSON \
              --output-file "sbom/${project//\//-}.cdx.json" \
              "$project/package-lock.json"
            echo "::endgroup::"
          done

      - name: Verify SBOM cache/generation output
        if: github.event_name != 'pull_request'
        run: node scripts/verify-sbom.mjs sbom

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: github.event_name != 'pull_request'
        with:
          name: sbom
          path: sbom/
          retention-days: 90
