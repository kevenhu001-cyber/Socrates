name: Build Socrates Native Windows Desktop

# Compatibility entry point for developers who only need the Windows shell.
# The implementation lives in the reusable cross-client workflow so signing,
# checksums, and artifact naming cannot drift between build and release paths.

on:
  push:
    branches: [main]
    paths:
      - 'desktop/windows/**'
      - 'packages/contracts/**'
      - 'packages/core/**'
      - '.github/workflows/build-apk.yml'
      - '.github/workflows/build-windows.yml'
      - 'docs/audits/client-release.md'
  pull_request:
    branches: [main]
    paths:
      - 'desktop/windows/**'
      - 'packages/contracts/**'
      - 'packages/core/**'
      - '.github/workflows/build-apk.yml'
      - '.github/workflows/build-windows.yml'
      - 'docs/audits/client-release.md'
  workflow_dispatch:
    inputs:
      build_profile:
        description: Windows package profile
        required: true
        type: choice
        options:
          - debug
          - release
        default: debug

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Build RNW Windows package
    uses: ./.github/workflows/build-apk.yml
    with:
      build_profile: ${{ inputs.build_profile || 'debug' }}
      run_verification: false
      build_windows: true
      build_windows_only: true
      run_device_smoke: false
      device_smoke_only: false
    secrets: inherit
