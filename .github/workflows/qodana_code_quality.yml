#-------------------------------------------------------------------------------#
#        Discover additional configuration options in our documentation         #
#               https://www.jetbrains.com/help/qodana/github.html               #
#-------------------------------------------------------------------------------#

name: Qodana
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  qodana:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: 'Qodana Scan'
        # Upstream publishes dotted tags only (v2026.2.0, v2026.2.1) — there is
        # no bare `v2026.2` ref, and a non-existent ref fails the job before the
        # scan starts. Keep this on the same 2026.2 line as the `linter:` image
        # tag in qodana.yaml.
        uses: JetBrains/qodana-action@v2026.2.2
        env:
          # The provisioned secret carries the JetBrains-generated suffix —
          # `gh secret list` shows QODANA_TOKEN_1699681199 and nothing else.
          # A plain QODANA_TOKEN reference here would 401 on every scan.
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN_1699681199 }}
        with:
          # PRs only need changed-file feedback; main/manual runs remain full
          # scans so repository-wide quality debt is still continuously checked.
          pr-mode: ${{ github.event_name == 'pull_request' && 'true' || 'false' }}
          use-caches: true
          post-pr-comment: true
          use-annotations: true
          # Upload Qodana results (SARIF, other artifacts, logs) as an artifact to the job
          upload-result: false
          # quick-fixes available in Ultimate and Ultimate Plus plans
          push-fixes: 'none'
