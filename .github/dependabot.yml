# Dependabot — weekly security and version updates for maintained projects.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    groups:
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/server"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    groups:
      server-runtime:
        dependency-type: "production"
        update-types: ["minor", "patch"]
      server-tooling:
        dependency-type: "development"
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "drizzle-orm"
        update-types: ["version-update:semver-major"]
      - dependency-name: "drizzle-kit"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    groups:
      tiptap:
        patterns: ["@tiptap/*"]
        update-types: ["minor", "patch"]
      frontend-runtime:
        dependency-type: "production"
        update-types: ["minor", "patch"]
        exclude-patterns: ["@tiptap/*"]
      frontend-tooling:
        dependency-type: "development"
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "@playwright/test"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "playwright"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]

  # Canonical cross-platform client. Expo/RN upgrades move as a coordinated
  # SDK matrix, so Dependabot may update ordinary tooling/runtime packages but
  # does not independently bump Expo or React Native.
  - package-ecosystem: "npm"
    directory: "/apps/socrates"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 3
    groups:
      universal-app-tooling:
        dependency-type: "development"
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "expo"
      - dependency-name: "expo-*"
      - dependency-name: "react-native"
      - dependency-name: "react-native-*"

  - package-ecosystem: "npm"
    directory: "/packages/core"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2

  - package-ecosystem: "npm"
    directory: "/packages/contracts"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
