  /api/tts:
    post:
      tags: [voice]
      operationId: synthesizeSpeech
      summary: Cloud text-to-speech synthesis proxy with multi-tier caching
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, maxLength: 20000 }
                voice: { type: string }
                format: { type: string, enum: [mp3, opus, wav], default: mp3 }
                lang: { type: string }
                messageId: { type: string }
      responses:
        '200':
          description: Synthesized audio stream
          content:
            audio/mpeg: { schema: { type: string, format: binary } }
            audio/opus: { schema: { type: string, format: binary } }
            audio/wav: { schema: { type: string, format: binary } }
        '400': { description: Empty text }
        '501': { description: Voice provider not configured }

  /api/vision/describe:
    post:
      tags: [vision]
      operationId: describeImage
      summary: Image recognition description via mmx vision CLI
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dataUrl]
              properties:
                dataUrl: { type: string, description: Image base64 data URL }
                prompt: { type: string }
      responses:
        '200':
          description: Image description
          content:
            application/json:
              schema:
                type: object
                properties:
                  description: { type: string }

  /api/rag/search:
    post:
      tags: [rag]
      operationId: searchRagChunks
      summary: Session-scoped hybrid BM25 and vector chunk retrieval
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sessionId, query]
              properties:
                sessionId: { type: string, format: uuid }
                query: { type: string, minLength: 1, maxLength: 2000 }
                limit: { type: integer, minimum: 1, maximum: 50, default: 8 }
                minScore: { type: number, default: 0.5 }
      responses:
        '200':
          description: Ranked chunk hits
          content:
            application/json:
              schema:
                type: object
                properties:
                  hits:
                    type: array
                    items:
                      type: object
                      properties:
                        messageId: { type: string, format: uuid }
                        ordinal: { type: integer }
                        text: { type: string }
                        score: { type: number }
        '400': { description: Validation error }
        '404': { description: Session not found }

  /api/executions/{id}/stream:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [execution]
      operationId: streamExecutionProgress
      summary: SSE stream for real-time code execution progress and artifacts
      responses:
        '200':
          description: Real-time execution events
          content:
            text/event-stream:
              schema: { type: string }
        '400': { description: Invalid execution ID format }
        '404': { description: Execution not found }

  /api/minimax/v1/chat/completions:
    post:
      tags: [chat]
      operationId: createMinimaxChatCompletion
      summary: Proxy for built-in Beagle (MiniMax) LLM provider
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [messages]
              properties:
                messages: { type: array, items: { type: object } }
                temperature: { type: number }
                max_tokens: { type: integer }
                stream: { type: boolean, default: false }
                reasoning_effort: { type: string }
                response_speed: { type: string, enum: [standard, fast] }
                extra_body: { type: object }
                assistantId: { type: string, format: uuid }
                sessionId: { type: string, format: uuid }
      responses:
        '200':
          description: Chat completion JSON or SSE event stream
          content:
            application/json:
              schema: { type: object }
            text/event-stream:
              schema: { type: string }
        '503': { description: Built-in LLM provider not configured }

  /api/nlweb/ask:
    get:
      tags: [nlweb]
      summary: NLWeb-conformant GET query over Socrates public corpus
      parameters:
        - in: query
          name: q
          schema: { type: string }
        - in: query
          name: query
          schema: { type: string }
      responses:
        '200':
          description: NLWeb search response
          content:
            application/json:
              schema: { type: object }
    post:
      tags: [nlweb]
      summary: NLWeb-conformant POST query over Socrates public corpus
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                query: { type: string }
                q: { type: string }
      responses:
        '200':
          description: NLWeb search response
          content:
            application/json:
              schema: { type: object }

  /api/nlweb/stream:
    post:
      tags: [nlweb]
      summary: NLWeb streaming query response
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                query: { type: string }
                q: { type: string }
      responses:
        '200':
          description: NLWeb SSE response stream
          content:
            text/event-stream:
              schema: { type: string }

  /api/ask:
    get:
      tags: [nlweb]
      summary: Short alias for NLWeb GET ask query
      parameters:
        - in: query
          name: q
          schema: { type: string }
        - in: query
          name: query
          schema: { type: string }
      responses:
        '200':
          description: NLWeb search response
          content:
            application/json:
              schema: { type: object }
    post:
      tags: [nlweb]
      summary: Short alias for NLWeb POST ask query
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                query: { type: string }
                q: { type: string }
      responses:
        '200':
          description: NLWeb search response
          content:
            application/json:
              schema: { type: object }

  /api/stream:
    post:
      tags: [nlweb]
      summary: Short alias for NLWeb POST stream query
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                query: { type: string }
                q: { type: string }
      responses:
        '200':
          description: NLWeb SSE response stream
          content:
            text/event-stream:
              schema: { type: string }

  /api/suggestions/starters:
    get:
      tags: [suggestions]
      operationId: getStarterSuggestions
      summary: Personalized landing prompt suggestions
      parameters:
        - in: query
          name: lang
          schema: { type: string, enum: [en, zh], default: en }
      responses:
        '200':
          description: Starter prompts list
          content:
            application/json:
              schema:
                type: object
                properties:
                  suggestions:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        prompt: { type: string }
                        icon: { type: string, enum: [spark, history, target] }
                  source: { type: string }

  /api/suggestions/starters/invalidate:
    post:
      tags: [suggestions]
      operationId: invalidateStarterSuggestions
      summary: Invalidate cached starter prompts for current user
      responses:
        '200':
          description: Cache invalidated
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }

  /api/knowledge-boundary/node:
    patch:
      tags: [knowledge]
      operationId: updateKnowledgeBoundaryNode
      summary: Update a specific knowledge node confidence score or user note
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sessionId, nodeIndex]
              properties:
                sessionId: { type: string, format: uuid }
                nodeIndex: { type: integer, minimum: 0 }
                confidenceScore: { type: integer, minimum: 0, maximum: 5 }
                userNote: { type: string, maxLength: 20000 }
      responses:
        '200':
          description: Updated knowledge node
          content:
            application/json:
              schema:
                type: object
                properties:
                  nodeName: { type: string, nullable: true }
                  status: { type: string }
                  sessionId: { type: string, format: uuid }
                  nodeIndex: { type: integer }
                  confidenceScore: { type: integer }
                  userNote: { type: string, nullable: true }
        '400': { description: Invalid node index or session }


components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sid
    csrfHeader:
      type: apiKey
      in: header
      name: X-CSRF-Token
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Socrates mobile access token (ma.<pair>.<secret>)

  parameters:
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: false
      description: Reuse the same key and JSON body to retry a write within 24 hours, using the same credential.
      schema: { type: string, minLength: 1, maxLength: 200, pattern: '^[!-~]+$' }
    MessageId:
      in: path
      name: messageId
      required: true
      schema: { type: string, format: uuid }
    SessionId:
      in: path
      name: sessionId
      required: true
      schema: { type: string, format: uuid }
    SessionIdOptional:
      in: query
      name: sessionId
      schema: { type: string, format: uuid }
    ProjectId:
      in: path
      name: projectId
      required: true
      schema: { type: string, format: uuid }
    FileId:
      in: path
      name: fileId
      required: true
      schema: { type: string, format: uuid }
    ArtifactId:
      in: path
      name: artifactId
      required: true
      schema: { type: string, format: uuid }
    MemoryId:
      in: path
      name: memoryId
      required: true
      schema: { type: string, format: uuid }
    WorkspaceId:
      in: path
      name: workspaceId
      required: true
      schema: { type: string, format: uuid }
    ThreadId:
      in: path
      name: threadId
      required: true
      schema: { type: string, format: uuid }
    AgentRunId:
      in: path
      name: runId
      required: true
      schema: { type: string, format: uuid }

  responses:
    IdempotencyConflict:
      description: Request still in progress, body conflict, or completed result too large to retain.
      headers:
        Retry-After:
          description: Present with value 1 for IDEMPOTENCY_IN_PROGRESS.
          schema: { type: integer, minimum: 1 }
      content:
        application/json:
          schema:
            type: object
            required: [code, message]
            properties:
              code: { type: string, enum: [IDEMPOTENCY_IN_PROGRESS, IDEMPOTENCY_CONFLICT, IDEMPOTENCY_RESULT_UNAVAILABLE] }
              message: { type: string }
    BadRequest:
      description: Malformed request
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Not signed in
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: CSRF missing or wrong, or wrong owner
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    ChatTurn:
      type: object
      required: [id, clientTurnId, status, generation]
      properties:
        id: { type: string, format: uuid }
        sessionId: { type: [string, 'null'], format: uuid }
        clientTurnId: { type: string }
        status: { type: string, enum: [queued, running, awaiting_approval, completed, failed, interrupted] }
        generation: { type: integer }
        model: { type: [string, 'null'] }
        fullText: { type: [string, 'null'] }
        fullReasoning: { type: [string, 'null'] }
        toolCalls: { type: array, items: {} }
        usage: { type: object }
        error: { type: [string, 'null'] }
        startedAt: { type: string, format: date-time }
        completedAt: { type: [string, 'null'], format: date-time }
        updatedAt: { type: string, format: date-time }
    MobileTokenPair:
      type: object
      required: [accessToken, refreshToken, expiresAt, refreshExpiresAt]
      properties:
        accessToken:
          type: string
          description: Short-lived bearer credential; send as Authorization Bearer.
          pattern: '^ma\\.[a-f0-9]{32}\\.[a-f0-9]{64}$'
        refreshToken:
          type: string
          description: Rotating opaque credential; only accepted by refresh/logout.
          pattern: '^mr\\.[a-f0-9]{32}\\.[a-f0-9]{64}$'
        expiresAt: { type: string, format: date-time }
        refreshExpiresAt: { type: string, format: date-time }

    MobileLoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }

    MobileAuthResponse:
      allOf:
        - $ref: '#/components/schemas/MobileTokenPair'
        - type: object
          required: [user]
          properties:
            user: { $ref: '#/components/schemas/User' }

    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string, example: NOT_FOUND }
        message: { type: string }
        detail: { type: object, additionalProperties: true }

    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        displayName: { type: string, nullable: true }
        tier: { type: string, enum: [diophantus, riemann, descartes, euclid] }
        plan: { type: string, nullable: true }
        isGuest: { type: boolean, default: false }
        verifiedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        customInstructions: { type: string, nullable: true }
        preferences: { type: object, additionalProperties: true, nullable: true }
        defaultModel: { type: string, nullable: true }

    Message:
      type: object
      properties:
        id: { type: string, format: uuid }
        sessionId: { type: string, format: uuid }
        role: { type: string, enum: [user, assistant, system] }
        content: { type: string }
        rawText: { type: string, nullable: true }
        html: { type: string, nullable: true }
        type: { type: string, nullable: true }
        model: { type: string, nullable: true }
        tokenCount: { type: integer, nullable: true }
        attachments:
          type: array
          items: { $ref: '#/components/schemas/FileRef' }
        createdAt: { type: string, format: date-time }
        editedAt: { type: string, format: date-time, nullable: true }
        parentId: { type: string, format: uuid, nullable: true, description: For regenerated/edited chains }

    FeedbackReceipt:
      type: object
      properties:
        id: { type: string, format: uuid }
        messageId: { type: string, format: uuid }
        rating: { type: string, enum: [up, down, none] }
        storedAt: { type: string, format: date-time }

    SearchHit:
      type: object
      properties:
        kind: { type: string, enum: [session, message, artifact, memory] }
        id: { type: string, format: uuid }
        sessionId: { type: string, format: uuid, nullable: true }
        title: { type: string }
        snippet: { type: string, description: Excerpt with <mark> highlights }
        score: { type: number }
        updatedAt: { type: string, format: date-time }

    SessionSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string, nullable: true }
        topic: { type: string, nullable: true }
        mode: { type: string, enum: [tutor, chat] }
        projectId: { type: string, format: uuid, nullable: true }
        assistantId: { type: string, format: uuid, nullable: true }
        tags:
          type: array
          items: { type: string }
        pinned: { type: boolean, default: false }
        archivedAt: { type: string, format: date-time, nullable: true }
        preview: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    Project:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string, nullable: true }
        color: { type: string, nullable: true }
        icon: { type: string, nullable: true }
        systemPrompt: { type: string, nullable: true }
        workspaceId: { type: string, format: uuid, nullable: true }
        createdAt: { type: string, format: date-time }
        sessionCount: { type: integer }

    ProjectDetail:
      allOf:
        - $ref: '#/components/schemas/Project'
        - type: object
          properties:
            recentSessions:
              type: array
              items: { $ref: '#/components/schemas/SessionSummary' }

    ScheduledTask:
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        prompt: { type: string }
        sessionId: { type: string, format: uuid, nullable: true }
        cronExpression: { type: string, nullable: true }
        frequency: { type: string, enum: [once, hourly, daily, weekly, monthly, custom] }
        status: { type: string, enum: [pending, active, paused, completed, failed] }
        nextRunAt: { type: string, format: date-time, nullable: true }
        lastRunAt: { type: string, format: date-time, nullable: true }
        runCount: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ProjectConnectorField:
      type: object
      properties:
        key: { type: string }
        label: { type: string }
        type: { type: string }
        required: { type: boolean }
        help: { type: string }

    ProjectConnectorConnection:
      type: object
      properties:
        status: { type: string }
        connectionName: { type: string, nullable: true }
        requestId: { type: string, nullable: true }
        connectedAccountId: { type: string, nullable: true }
        displayName: { type: string, nullable: true }
        updatedAt: { type: string, format: date-time, nullable: true }
        lastError: { type: string, nullable: true }

    ProjectConnector:
      type: object
      properties:
        id: { type: string }
        service: { type: string }
        name: { type: string }
        description: { type: string }
        capabilities: { type: array, items: { type: string } }
        authType: { type: string, enum: [oauth, api_key, custom_credential] }
        credentialInput:
          type: object
          properties:
            fields: { type: array, items: { $ref: '#/components/schemas/ProjectConnectorField' } }
        connection:
          allOf:
            - $ref: '#/components/schemas/ProjectConnectorConnection'
          nullable: true

    KnowledgeNode:
      type: object
      properties:
        nodeName: { type: string, nullable: true }
        status: { type: string, enum: [fuzzy, internalized, blank] }
        sessionId: { type: string, format: uuid }
        sessionTitle: { type: string, nullable: true }

    Mistake:
      type: object
      properties:
        id: { type: string, format: uuid }
        sessionId: { type: string, format: uuid, nullable: true }
        nodeName: { type: string, nullable: true }
        questionContent: { type: string }
        userAnswer: { type: string, nullable: true }
        correctAnswer: { type: string, nullable: true }
        source: { type: string, enum: [quiz, practice, manual] }
        isResolved: { type: boolean }
        resolvedAt: { type: string, format: date-time, nullable: true }
        collectedAt: { type: string, format: date-time }

    FileRef:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        mimeType: { type: string }
        size: { type: integer, description: Bytes }
        kind: { type: string, enum: [image, video, audio, pdf, text, code, csv, other] }
        width: { type: integer, nullable: true, description: For images / video }
        height: { type: integer, nullable: true }
        pages: { type: integer, nullable: true, description: For PDFs }
        sha256: { type: string }
        uploadedAt: { type: string, format: date-time }
        thumbnailUrl: { type: string, format: uri, nullable: true }
        url: { type: string, format: uri }

    ChatDelta:
      type: object
      properties:
        choices:
          type: array
          items:
            type: object
            properties:
              delta:
                type: object
                properties:
                  content: { type: string, nullable: true }
                  role: { type: string, nullable: true }

    TranscriptWord:
      type: object
      properties:
        text: { type: string }
        start: { type: number }
        end: { type: number }
        confidence: { type: number }

    Artifact:
      type: object
      properties:
        id: { type: string, format: uuid }
        type: { type: string, enum: [html, react, svg, mermaid, code, markdown] }
        title: { type: string }
        source: { type: string }
        language: { type: string, nullable: true }
        sessionId: { type: string, format: uuid, nullable: true }
        messageId: { type: string, format: uuid, nullable: true }
        projectId: { type: string, format: uuid, nullable: true }
        visibility: { type: string, enum: [private, unlisted, public] }
        shareToken: { type: string, nullable: true }
        version: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ArtifactVersion:
      type: object
      properties:
        version: { type: integer }
        source: { type: string }
        createdAt: { type: string, format: date-time }
        createdBy: { type: string, format: uuid, nullable: true }

    MemoryEntry:
      type: object
      properties:
        id: { type: string, format: uuid }
        text: { type: string }
        scope: { type: string, enum: [global, project] }
        projectId: { type: string, format: uuid, nullable: true }
        source: { type: string, enum: [user, extracted] }
        enabled: { type: boolean, default: true }
        confidence: { type: number, nullable: true, description: 0-1 for extracted memories }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    Usage:
      type: object
      properties:
        period: { type: string, enum: [day, week, month, all] }
        from: { type: string, format: date }
        to: { type: string, format: date }
        totalTokens: { type: integer }
        totalCost: { type: number, description: USD }
        byModel:
          type: array
          items:
            type: object
            properties:
              model: { type: string }
              tokens: { type: integer }
              cost: { type: number }
              percent: { type: number }
        byDay:
          type: array
          items:
            type: object
            properties:
              date: { type: string, format: date }
              tokens: { type: integer }
              cost: { type: number }

    UsageLimits:
      type: object
      properties:
        plan: { type: string }
        tokenQuota: { type: integer, nullable: true, description: null = unlimited }
        tokensUsed: { type: integer }
        resetAt: { type: string, format: date-time, nullable: true }
        hardLimit: { type: boolean, description: true = block, false = overage allowed with billing }

    NotificationToken:
      type: object
      properties:
        id: { type: string, format: uuid }
        platform: { type: string }
        channels:
          type: array
          items: { type: string }
        createdAt: { type: string, format: date-time }

    NotificationPrefs:
      type: object
      properties:
        longTasks: { type: boolean, default: true }
        mentions: { type: boolean, default: true }
        replies: { type: boolean, default: false }
        billing: { type: boolean, default: true }
        quietHours:
          type: object
          properties:
            enabled: { type: boolean }
            from: { type: string, description: "HH:mm" }
            to: { type: string, description: "HH:mm" }
            timezone: { type: string }

    Workspace:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        plan: { type: string, enum: [team, business] }
        ownerId: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        memberCount: { type: integer }

    WorkspaceMember:
      type: object
      properties:
        userId: { type: string, format: uuid }
        email: { type: string, format: email }
        displayName: { type: string, nullable: true }
        role: { type: string, enum: [owner, admin, member, viewer] }
        joinedAt: { type: string, format: date-time }

    ImportJob:
      type: object
      properties:
        id: { type: string, format: uuid }
        source: { type: string, enum: [chatgpt, claude, socrates, jsonl] }
        status: { type: string, enum: [queued, running, completed, failed] }
        progress:
          type: object
          properties:
            total: { type: integer }
            processed: { type: integer }
            errors: { type: integer }
        createdAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time, nullable: true }

    PromptTemplate:
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        description: { type: string, nullable: true }
        body: { type: string }
        icon: { type: string, nullable: true }
        category: { type: string, enum: [writing, code, learning, analysis, creative, other] }
        shortcut: { type: string, nullable: true, description: Slash-command alias }
        systemPrompt: { type: string, nullable: true, description: Optional system prompt injected while the template is active }
        isBuiltin: { type: boolean, default: false }
        usageCount: { type: integer, default: 0 }
        createdAt: { type: string, format: date-time }

    PresenceUser:
      type: object
      properties:
        userId: { type: string, format: uuid }
        displayName: { type: string, nullable: true }
        color: { type: string }
        cursor:
          type: object
          properties:
            messageId: { type: string, format: uuid, nullable: true }
            offset: { type: integer, nullable: true }
        lastSeen: { type: string, format: date-time }

    Comment:
      type: object
      properties:
        id: { type: string, format: uuid }
        anchor: { type: string }
        body: { type: string }
        authorId: { type: string, format: uuid }
        authorName: { type: string, nullable: true }
        parentId: { type: string, format: uuid, nullable: true }
        resolved: { type: boolean, default: false }
        createdAt: { type: string, format: date-time }

    AgentRun:
      type: object
      properties:
        id: { type: string, format: uuid }
        task: { type: string }
        status: { type: string, enum: [planning, awaiting_approval, running, paused, completed, failed, rolled_back] }
        plan:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              title: { type: string }
              rationale: { type: string, nullable: true }
              status: { type: string, enum: [pending, running, done, skipped, failed] }
        steps:
          type: array
          items: { $ref: '#/components/schemas/AgentStep' }
        checkpoints:
          type: array
          items: { $ref: '#/components/schemas/Checkpoint' }
        diffs:
          type: array
          items: { $ref: '#/components/schemas/FileDiff' }
        startedAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time, nullable: true }

    AgentRuntimeRun:
      type: object
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        sessionId: { type: string, format: uuid, nullable: true }
        projectId: { type: string, format: uuid, nullable: true }
        workspaceId: { type: string, format: uuid, nullable: true, description: Opaque workspace id; never a filesystem path }
        threadId: { type: string, nullable: true }
        task: { type: string }
        status: { type: string, enum: [planning, starting, running, awaiting_approval, completed, failed, interrupted, disconnected] }
        mode: { type: string, enum: [workspace, native] }
        kind: { type: string, enum: [chat, tutor, scheduled, retry] }
        source: { type: string, enum: [chat, tutor, scheduled, api] }
        providerMode: { type: string, enum: [user, server], nullable: true }
        model: { type: string, nullable: true }
        summary: { type: string, nullable: true }
        error: { type: string, nullable: true }
        usage: { type: object, additionalProperties: true }
        startedAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time, nullable: true }

    AgentRuntimeEvent:
      type: object
      properties:
        runId: { type: string, format: uuid }
        sequence: { type: integer }
        event: { type: string }
        data: { type: object, additionalProperties: true }
        createdAt: { type: string, format: date-time }

    AgentApproval:
      type: object
      properties:
        id: { type: string, format: uuid }
        runId: { type: string, format: uuid }
        threadId: { type: string }
        requestId: { type: string }
        kind: { type: string, enum: [commandExecution, fileChange] }
        status: { type: string, enum: [pending, accepted, accepted_for_session, declined, cancelled] }
        payload: { type: object, additionalProperties: true }
        createdAt: { type: string, format: date-time }
        decidedAt: { type: string, format: date-time, nullable: true }

    AgentMcpServer:
      type: object
      properties:
        key: { type: string }
        name: { type: string }
        description: { type: string }
        transport: { type: string, enum: [streamable_http] }
        endpointHost: { type: string }
        enabled: { type: boolean }
        scope: { type: string, enum: [global, project] }
        healthStatus: { type: string, enum: [unknown, reachable, unavailable] }
        lastError: { type: string, nullable: true }
        lastCheckedAt: { type: string, format: date-time, nullable: true }

    AgentStep:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        input: { type: object, additionalProperties: true, nullable: true }
        output: { type: string, nullable: true }
        ok: { type: boolean }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time, nullable: true }

    Checkpoint:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string, nullable: true }
        filesHash: { type: string, description: SHA-256 of the snapshot }
        createdAt: { type: string, format: date-time }

    FileDiff:
      type: object
      properties:
        id: { type: string, format: uuid }
        path: { type: string }
        before: { type: string, nullable: true }
        after: { type: string }
        status: { type: string, enum: [pending, approved, rejected, applied] }
        reason: { type: string, nullable: true, description: For rejections }

    ClassroomClass:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string, nullable: true }
        subject: { type: string, nullable: true }
        gradeLevel: { type: string, nullable: true }
        teacherId: { type: string, format: uuid }
        joinCode: { type: string, description: 6-char code students use to enrol }
        studentCount: { type: integer }
        createdAt: { type: string, format: date-time }

    StudentSummary:
      type: object
      properties:
        userId: { type: string, format: uuid }
        displayName: { type: string, nullable: true }
        progressPercent: { type: number }
        streakDays: { type: integer }
        mistakeCount: { type: integer }
        lastActiveAt: { type: string, format: date-time, nullable: true }

    ClassDashboard:
      type: object
      properties:
        classId: { type: string, format: uuid }
        students: { type: array, items: { $ref: '#/components/schemas/StudentSummary' } }
        hotspotMistakes:
          type: array
          items:
            type: object
            properties:
              mistakeId: { type: string, format: uuid }
              question: { type: string }
              affectedStudents: { type: integer }
        topicCompletion:
          type: array
          items:
            type: object
            properties:
              topic: { type: string }
              completion: { type: number }

    MistakeSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        question: { type: string }
        userAnswer: { type: string }
        correctAnswer: { type: string, nullable: true }
        nodeName: { type: string, nullable: true }
        nextDue: { type: string, format: date-time, nullable: true }
        interval: { type: integer, description: Days until next review }
        ease: { type: number }

    StudyPath:
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        description: { type: string, nullable: true }
        subject: { type: string }
        steps:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              title: { type: string }
              topic: { type: string }
              estMinutes: { type: integer }
        enrolled: { type: boolean, default: false }
        progressPercent: { type: number }

    ShareResponse:
      type: object
      properties:
        token: { type: string }
        url: { type: string, format: uri }
        visibility: { type: string }
