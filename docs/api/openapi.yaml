openapi: 3.1.0
info:
  title: Socrates Backend API
  description: |
    REST + SSE API consumed by the Socrates web SPA
    (`index.html`) and the Android Kotlin client. The existing
    endpoints (auth, captcha, sessions, share, api-key, migrate,
    chat, agent, search, fetch-batch) are summarised at the end
    of this file for completeness; the new endpoints introduced
    by the P1-P6 feature enhancements are documented in detail.
  version: "2.0.0"
  contact:
    name: Socrates engineering
    url: https://app.topodrive.top/
servers:
  - url: https://app.topodrive.top
    description: Production
  - url: http://localhost:8080
    description: Local dev
security:
  - cookieAuth: []
  - csrfHeader: []

tags:
  - name: messages
    description: Per-message actions (P1.1 — Copy/Edit/Regenerate/Feedback)
  - name: search
    description: Global session search (P1.2)
  - name: users
    description: User preferences and custom instructions (P1.3)
  - name: projects
    description: Workspace projects / folders (P2.1)
  - name: tags
    description: Session tags and pin state (P2.2)
  - name: archive
    description: Archive / restore / purge (P2.3)
  - name: files
    description: File & image upload + retrieval (P3.1, P3.2)
  - name: voice
    description: Voice transcription (P3.3)
  - name: artifacts
    description: Canvas artifacts — HTML/React/SVG/Mermaid (P4.1)
  - name: memory
    description: Cross-session memory store (P4.4)
  - name: usage
    description: Token usage / billing dashboard (P5.1)
  - name: notifications
    description: Push notification registration (P5.2)
  - name: workspaces
    description: Team workspaces (P5.5)
  - name: collaborators
    description: Real-time collaboration sync (P6.1)
  - name: agents
    description: Agent runs, plans, checkpoints (P6.2)
  - name: classroom
    description: Classroom, spaced-repetition, study paths (P6.3)
  - name: imports
    description: Import from ChatGPT/Claude export (P5.7)
  - name: prompts
    description: Prompt templates (P5.8)

paths:
  # ========================================================================
  # P1.1 — Message operations
  # ========================================================================
  /api/messages/{messageId}:
    parameters:
      - $ref: '#/components/parameters/MessageId'
    patch:
      tags: [messages]
      operationId: editMessage
      summary: Edit the content of a user message (and optionally regenerate the assistant reply)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content: { type: string, minLength: 1, maxLength: 32000 }
                regenerate: { type: boolean, default: false, description: If true, also delete the assistant message that followed and trigger a new stream. }
      responses:
        '200':
          description: Updated message
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [messages]
      operationId: deleteMessage
      summary: Soft-delete a message (kept for audit, hidden from chat)
      responses:
        '204': { description: Deleted }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/messages/{messageId}/regenerate:
    parameters:
      - $ref: '#/components/parameters/MessageId'
    post:
      tags: [messages]
      operationId: regenerateAssistant
      summary: Re-run the model on the user message that precedes this assistant message
      description: |
        Returns a Server-Sent-Events stream identical in shape to
        `/api/chat/stream`, with `delta.content` chunks. After the
        stream completes, the server has replaced the assistant
        message in-place.
      responses:
        '200':
          description: SSE stream
          content:
            text/event-stream:
              schema: { $ref: '#/components/schemas/ChatDelta' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/messages/{messageId}/feedback:
    parameters:
      - $ref: '#/components/parameters/MessageId'
    put:
      tags: [messages]
      operationId: submitFeedback
      summary: Thumbs up/down + optional reason
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rating]
              properties:
                rating: { type: string, enum: [up, down, none] }
                reason: { type: string, maxLength: 500, description: Free-form feedback when rating is "down" }
                categories:
                  type: array
                  items: { type: string, enum: [hallucination, off_topic, too_long, too_short, wrong_format, harmful, other] }
      responses:
        '200':
          description: Stored
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FeedbackReceipt' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/messages/{messageId}/copy-event:
    parameters:
      - $ref: '#/components/parameters/MessageId'
    post:
      tags: [messages]
      operationId: logCopy
      summary: "Server-side telemetry: user clicked Copy on this message"
      description: |
        Best-effort; the client may skip this on privacy opt-out.
        Helps the user see "this is a popular answer" and helps
        admins prioritise quality work.
      responses:
        '204': { description: Recorded }

  # ========================================================================
  # P1.2 — Global search
  # ========================================================================
  /api/search:
    post:
      tags: [search]
      operationId: globalSearch
      summary: Search across sessions, messages, and artifacts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [q]
              properties:
                q: { type: string, minLength: 1, maxLength: 200 }
                scope: { type: string, enum: [all, sessions, messages, artifacts, memory], default: all }
                projectId: { type: string, format: uuid, nullable: true }
                tags: { type: array, items: { type: string } }
                limit: { type: integer, default: 20, maximum: 100 }
                cursor: { type: string, nullable: true, description: Opaque pagination cursor }
                from: { type: string, format: date, nullable: true }
                to: { type: string, format: date, nullable: true }
      responses:
        '200':
          description: Hits
          content:
            application/json:
              schema:
                type: object
                required: [hits]
                properties:
                  hits:
                    type: array
                    items: { $ref: '#/components/schemas/SearchHit' }
                  nextCursor: { type: string, nullable: true }
                  total: { type: integer }

  /api/search/suggest:
    get:
      tags: [search]
      operationId: searchSuggest
      summary: Typeahead suggestions (titles, tags, recent queries)
      parameters:
        - in: query
          name: q
          schema: { type: string, minLength: 1, maxLength: 100 }
      responses:
        '200':
          description: Suggestions
          content:
            application/json:
              schema:
                type: object
                properties:
                  titles: { type: array, items: { type: string } }
                  tags: { type: array, items: { type: string } }
                  recent: { type: array, items: { type: string } }

  # ========================================================================
  # P1.3 — User preferences
  # ========================================================================
  /api/users/me:
    get:
      tags: [users]
      operationId: getMe
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
    patch:
      tags: [users]
      operationId: updateMe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                displayName: { type: string, maxLength: 80 }
                customInstructions:
                  type: string
                  maxLength: 8000
                  description: Always prepended to the system prompt
                preferences:
                  type: object
                  additionalProperties: true
                  description: Free-form key/value bag (theme, fontStep, etc.)
                defaultModel: { type: string, nullable: true }
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }

  /api/users/me/export:
    get:
      tags: [users]
      operationId: exportMyData
      summary: GDPR-style data export (sessions, memories, settings)
      responses:
        '200':
          description: ZIP archive
          content:
            application/zip:
              schema: { type: string, format: binary }

  # ========================================================================
  # P2.1 — Projects
  # ========================================================================
  /api/projects:
    get:
      tags: [projects]
      operationId: listProjects
      responses:
        '200':
          description: List of projects the user owns or has access to
          content:
            application/json:
              schema:
                type: object
                properties:
                  projects: { type: array, items: { $ref: '#/components/schemas/Project' } }
    post:
      tags: [projects]
      operationId: createProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 80 }
                description: { type: string, maxLength: 2000 }
                color: { type: string, pattern: "^#[0-9A-Fa-f]{6}$" }
                icon: { type: string, maxLength: 16, description: Emoji or short label }
                systemPrompt: { type: string, maxLength: 32000, description: Project-scoped system prompt additions }
                workspaceId: { type: string, format: uuid, nullable: true }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/projects/{projectId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [projects]
      operationId: getProject
      responses:
        '200':
          description: Project with sessions
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectDetail' }
    patch:
      tags: [projects]
      operationId: updateProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                description: { type: string }
                color: { type: string }
                icon: { type: string }
                systemPrompt: { type: string }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
    delete:
      tags: [projects]
      operationId: deleteProject
      parameters:
        - in: query
          name: cascade
          schema: { type: boolean, default: false, description: If true, also archive all sessions. }
      responses:
        '204': { description: Deleted }

  /api/projects/{projectId}/sessions:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [projects]
      operationId: listProjectSessions
      parameters:
        - in: query
          name: limit
          schema: { type: integer, default: 50, maximum: 200 }
        - in: query
          name: cursor
          schema: { type: string }
      responses:
        '200':
          description: Sessions
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessions: { type: array, items: { $ref: '#/components/schemas/SessionSummary' } }
                  nextCursor: { type: string, nullable: true }

  # ========================================================================
  # P2.2 — Tags & pinning
  # ========================================================================
  /api/sessions/{sessionId}/tags:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    put:
      tags: [tags]
      operationId: setSessionTags
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tags]
              properties:
                tags: { type: array, items: { type: string, maxLength: 30 }, maxItems: 12 }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionSummary' }

  /api/sessions/{sessionId}/pin:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    post:
      tags: [tags]
      operationId: pinSession
      responses:
        '200':
          description: Pinned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionSummary' }
    delete:
      tags: [tags]
      operationId: unpinSession
      responses:
        '200':
          description: Unpinned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionSummary' }

  /api/tags:
    get:
      tags: [tags]
      operationId: listMyTags
      responses:
        '200':
          description: User's tag vocabulary
          content:
            application/json:
              schema:
                type: object
                properties:
                  tags:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string }
                        count: { type: integer }
                        color: { type: string }

  # ========================================================================
  # P2.3 — Archive / trash
  # ========================================================================
  /api/sessions/{sessionId}/archive:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    post:
      tags: [archive]
      operationId: archiveSession
      responses:
        '200':
          description: Archived
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionSummary' }
    delete:
      tags: [archive]
      operationId: restoreSession
      responses:
        '200':
          description: Restored
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionSummary' }

  /api/sessions/archived:
    get:
      tags: [archive]
      operationId: listArchived
      parameters:
        - in: query
          name: limit
          schema: { type: integer, default: 50 }
      responses:
        '200':
          description: Archived sessions
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessions: { type: array, items: { $ref: '#/components/schemas/SessionSummary' } }

  /api/sessions/{sessionId}:
    delete:
      tags: [archive]
      operationId: purgeSession
      summary: Hard-delete (only valid for already-archived sessions)
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '204': { description: Purged }
        '409':
          description: Session is not archived; archive first
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  # ========================================================================
  # P3.1 — File upload
  # ========================================================================
  /api/files:
    post:
      tags: [files]
      operationId: uploadFile
      summary: Multipart upload. Returns a fileId that can be attached to messages.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: Max 25 MB
                sessionId: { type: string, format: uuid, nullable: true, description: If provided, file is bound to the session for retention purposes. }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FileRef' }
        '413':
          description: File too large
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/files/{fileId}:
    parameters:
      - $ref: '#/components/parameters/FileId'
    get:
      tags: [files]
      operationId: getFile
      responses:
        '200':
          description: File metadata
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FileRef' }
    delete:
      tags: [files]
      operationId: deleteFile
      responses:
        '204': { description: Deleted }

  /api/files/{fileId}/raw:
    parameters:
      - $ref: '#/components/parameters/FileId'
    get:
      tags: [files]
      operationId: getFileRaw
      responses:
        '200':
          description: File bytes
          content:
            application/octet-stream:
              schema: { type: string, format: binary }

  /api/files/{fileId}/thumbnail:
    parameters:
      - $ref: '#/components/parameters/FileId'
      - in: query
        name: w
        schema: { type: integer, default: 256 }
      - in: query
        name: h
        schema: { type: integer, default: 256 }
    get:
      tags: [files]
      operationId: getFileThumbnail
      responses:
        '200':
          description: PNG thumbnail
          content:
            image/png:
              schema: { type: string, format: binary }

  # ========================================================================
  # P3.3 — Voice
  # ========================================================================
  /api/voice/transcribe:
    post:
      tags: [voice]
      operationId: transcribeAudio
      summary: Server-side fallback when client-side Web Speech API is unavailable
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [audio]
              properties:
                audio:
                  type: string
                  format: binary
                  description: webm/opus or wav, max 5 minutes
                language:
                  type: string
                  description: BCP-47 code, e.g. "en-US"
      responses:
        '200':
          description: Transcript
          content:
            application/json:
              schema:
                type: object
                properties:
                  text: { type: string }
                  language: { type: string }
                  duration: { type: number, description: Seconds }
                  words:
                    type: array
                    items: { $ref: '#/components/schemas/TranscriptWord' }

  # ========================================================================
  # P4.1 — Artifacts
  # ========================================================================
  /api/artifacts:
    parameters:
      - $ref: '#/components/parameters/SessionIdOptional'
      - in: query
        name: projectId
        schema: { type: string, format: uuid }
    post:
      tags: [artifacts]
      operationId: createArtifact
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, source]
              properties:
                type: { type: string, enum: [html, react, svg, mermaid, code, markdown] }
                title: { type: string, maxLength: 200 }
                source: { type: string, description: Original code/markup }
                sessionId: { type: string, format: uuid }
                messageId: { type: string, format: uuid }
                language: { type: string, description: For code artifacts }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Artifact' }
    get:
      tags: [artifacts]
      operationId: listArtifacts
      responses:
        '200':
          description: User's artifacts
          content:
            application/json:
              schema:
                type: object
                properties:
                  artifacts: { type: array, items: { $ref: '#/components/schemas/Artifact' } }

  /api/artifacts/{artifactId}:
    parameters:
      - $ref: '#/components/parameters/ArtifactId'
    get:
      tags: [artifacts]
      operationId: getArtifact
      responses:
        '200':
          description: Artifact
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Artifact' }
    patch:
      tags: [artifacts]
      operationId: updateArtifact
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                source: { type: string }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Artifact' }
    delete:
      tags: [artifacts]
      operationId: deleteArtifact
      responses:
        '204': { description: Deleted }

  /api/artifacts/{artifactId}/versions:
    parameters:
      - $ref: '#/components/parameters/ArtifactId'
    get:
      tags: [artifacts]
      operationId: listArtifactVersions
      responses:
        '200':
          description: Version history
          content:
            application/json:
              schema:
                type: object
                properties:
                  versions: { type: array, items: { $ref: '#/components/schemas/ArtifactVersion' } }

  /api/artifacts/{artifactId}/share:
    parameters:
      - $ref: '#/components/parameters/ArtifactId'
    post:
      tags: [artifacts]
      operationId: shareArtifact
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                visibility: { type: string, enum: [public, unlisted, private] }
      responses:
        '201':
          description: Shared
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShareResponse' }
    delete:
      tags: [artifacts]
      operationId: unshareArtifact
      responses:
        '204': { description: Unshared }

  /a/{shareToken}:
    get:
      tags: [artifacts]
      operationId: publicArtifactView
      responses:
        '200':
          description: Public artifact page (HTML)
          content:
            text/html: {}

  # ========================================================================
  # P4.4 — Memory
  # ========================================================================
  /api/memory:
    get:
      tags: [memory]
      operationId: listMemories
      parameters:
        - in: query
          name: includeDisabled
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: User memories
          content:
            application/json:
              schema:
                type: object
                properties:
                  memories: { type: array, items: { $ref: '#/components/schemas/MemoryEntry' } }
    post:
      tags: [memory]
      operationId: createMemory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, minLength: 1, maxLength: 2000 }
                scope: { type: string, enum: [global, project], default: global }
                projectId: { type: string, format: uuid, nullable: true }
                source: { type: string, enum: [user, extracted], default: user }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemoryEntry' }

  /api/memory/{memoryId}:
    parameters:
      - $ref: '#/components/parameters/MemoryId'
    patch:
      tags: [memory]
      operationId: updateMemory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                text: { type: string }
                enabled: { type: boolean }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemoryEntry' }
    delete:
      tags: [memory]
      operationId: deleteMemory
      responses:
        '204': { description: Deleted }

  /api/memory/{memoryId}/enable:
    parameters:
      - $ref: '#/components/parameters/MemoryId'
    post:
      tags: [memory]
      operationId: enableMemory
      responses:
        '200':
          description: Enabled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemoryEntry' }

  /api/memory/{memoryId}/disable:
    parameters:
      - $ref: '#/components/parameters/MemoryId'
    post:
      tags: [memory]
      operationId: disableMemory
      responses:
        '200':
          description: Disabled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemoryEntry' }

  /api/memory/extract:
    post:
      tags: [memory]
      operationId: extractMemoriesFromSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sessionId]
              properties:
                sessionId: { type: string, format: uuid }
                confirm: { type: array, items: { type: string, maxLength: 2000 }, description: Pre-approved candidates to upsert verbatim }
      responses:
        '200':
          description: Extraction candidates
          content:
            application/json:
              schema:
                type: object
                properties:
                  candidates:
                    type: array
                    items: { $ref: '#/components/schemas/MemoryEntry' }

  # ========================================================================
  # P5.1 — Usage
  # ========================================================================
  /api/usage:
    get:
      tags: [usage]
      operationId: getUsage
      parameters:
        - in: query
          name: period
          schema: { type: string, enum: [day, week, month, all], default: month }
        - in: query
          name: groupBy
          schema: { type: string, enum: [model, project, day, none], default: model }
      responses:
        '200':
          description: Usage summary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Usage' }

  /api/usage/limits:
    get:
      tags: [usage]
      operationId: getUsageLimits
      responses:
        '200':
          description: Plan limits
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UsageLimits' }

  # ========================================================================
  # P5.2 — Notifications
  # ========================================================================
  /api/notifications/register:
    post:
      tags: [notifications]
      operationId: registerPush
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [platform, token]
              properties:
                platform: { type: string, enum: [web, android, ios] }
                token: { type: string }
                deviceId: { type: string, nullable: true }
                channels:
                  type: array
                  items: { type: string, enum: [long_tasks, mentions, replies, billing] }
      responses:
        '200':
          description: Registered
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationToken' }

  /api/notifications/unregister:
    delete:
