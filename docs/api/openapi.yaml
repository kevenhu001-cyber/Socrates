        steps:
          type: array
          items: { $ref: '#/components/schemas/AgentStep' }
        checkpoints:
          type: array
          items: { $ref: '#/components/schemas/Checkpoint' }
        diffs:
          type: array
          items: { $ref: '#/components/schemas/FileDiff' }
        startedAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time, nullable: true }

    AgentStep:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        input: { type: object, additionalProperties: true, nullable: true }
        output: { type: string, nullable: true }
        ok: { type: boolean }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time, nullable: true }

    Checkpoint:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string, nullable: true }
        filesHash: { type: string, description: SHA-256 of the snapshot }
        createdAt: { type: string, format: date-time }

    FileDiff:
      type: object
      properties:
        id: { type: string, format: uuid }
        path: { type: string }
