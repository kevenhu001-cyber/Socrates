            application/json:
              schema: { $ref: '#/components/schemas/NotificationPrefs' }
    put:
      tags: [notifications]
      operationId: setNotifPrefs
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NotificationPrefs' }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationPrefs' }

  # ========================================================================
  # P5.5 — Workspaces
  # ========================================================================
  /api/workspaces:
    get:
      tags: [workspaces]
      operationId: listWorkspaces
      responses:
        '200':
          description: Workspaces
          content:
            application/json:
              schema:
                type: object
                properties:
                  workspaces: { type: array, items: { $ref: '#/components/schemas/Workspace' } }
    post:
      tags: [workspaces]
      operationId: createWorkspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 80 }
                plan: { type: string, enum: [team, business], default: team }
