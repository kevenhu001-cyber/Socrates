openapi: 3.1.0
info:
  title: Socrates Backend API
  description: |
    REST + SSE API consumed by the Socrates web SPA and the Expo Android
    shell. The existing
    endpoints (auth, captcha, sessions, share, api-key, migrate,
    chat, agent, search, fetch-batch) are summarised at the end
    of this file for completeness; the new endpoints introduced
    by the P1-P6 feature enhancements are documented in detail.

    JSON writes may send Idempotency-Key (1-200 printable ASCII characters,
    excluding spaces). POST /api/projects, /api/prompts, /api/scheduled-tasks,
    POST /api/sessions/{sessionId}/archive, PATCH /api/users/me,
    PATCH /api/users/me/preferences and PUT /api/sessions/{sessionId}/tags persist
    successful JSON responses atomically with their database writes. These operations
    support replay across instances and restarts for 24 hours after commit, scoped to
    the authenticated user, credential and operation (including the session ID).
    Authentication and existing route permissions run before every replay.
    Object key order is ignored when comparing bodies; array order matters.
    Invalid keys return 400 on these operations. Credential rotation starts a
    new scope. The original response is replayed even if the resource changed.

    Other JSON writes use a process-local cache for up to 24 hours, subject to
    eviction, and do not survive restart. For both mechanisms a concurrent
    repeat returns 409 IDEMPOTENCY_IN_PROGRESS with Retry-After: 1; changed
    bodies return 409 IDEMPOTENCY_CONFLICT. Responses exceeding 256 KiB retain
    a completion marker: retries return 409 IDEMPOTENCY_RESULT_UNAVAILABLE;
    retrieve the resource instead of repeating the write. The process-local
    cache can also return 503 IDEMPOTENCY_CAPACITY with Retry-After: 1.
    Uploads, SSE and external effects need operation-specific guarantees.
  version: "2.0.0"
  contact:
    name: Socrates engineering
    url: https://app.topodrive.top/
servers:
  - url: https://app.topodrive.top
    description: Production
  - url: http://localhost:8080
    description: Local dev
security:
  - cookieAuth: []
  - csrfHeader: []

tags:
  - name: mobile
    description: Android shell bootstrap and API-origin contract
  - name: messages
    description: Per-message actions (P1.1 — Copy/Edit/Regenerate/Feedback)
  - name: search
    description: Global session search (P1.2)
  - name: users
    description: User preferences and custom instructions (P1.3)
  - name: projects
    description: Workspace projects / folders (P2.1)
  - name: tags
    description: Session tags and pin state (P2.2)
  - name: archive
    description: Archive / restore / purge (P2.3)
  - name: files
    description: File & image upload + retrieval (P3.1, P3.2)
  - name: voice
    description: Voice transcription (P3.3)
  - name: artifacts
    description: Canvas artifacts — HTML/React/SVG/Mermaid (P4.1)
  - name: memory
    description: Cross-session memory store (P4.4)
  - name: usage
    description: Token usage / billing dashboard (P5.1)
  - name: notifications
    description: Push notification registration (P5.2)
  - name: workspaces
    description: Team workspaces (P5.5)
  - name: collaborators
    description: Real-time collaboration sync (P6.1)
  - name: agents
    description: Agent runs, plans, checkpoints (P6.2)
  - name: classroom
    description: Classroom, spaced-repetition, study paths (P6.3)
  - name: imports
    description: Import from ChatGPT/Claude export (P5.7)
  - name: prompts
    description: Prompt templates (P5.8)
  - name: creations
    description: Images, configurable assistants, and publishable sites
  - name: admin
    description: Operator console authentication and system model/embedding configuration
  - name: plugins
    description: Plugin marketplace, configuration, and lifecycle management
  - name: mcp
    description: Model Context Protocol (MCP) Streamable HTTP discovery and documentation surfaces

paths:
  /api/health:
    get:
      summary: Health check and database connectivity probe
      description: Returns health status, uptime, database connection state, and pubsub status.
      responses:
        '200':
          description: Service is healthy and database is connected
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  db: { type: string }
                  uptime: { type: number }
                  pubsub: { type: object }
        '503':
          description: Service is degraded or database is disconnected

  /api/hello:
    get:
      summary: Lightweight connectivity and smoke-test ping
      description: Unauthenticated endpoint returning a static greeting message.
      responses:
        '200':
          description: Static greeting
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: hello }

  /api/config:
    get:
      summary: Public client configuration and feature flags
      description: Returns client configuration including Beagle provider availability without exposing upstream model secrets.
      responses:
        '200':
          description: Public configuration
          content:
            application/json:
              schema:
                type: object
                properties:
                  hasBeagleKey: { type: boolean }
                  isReasoning: { type: boolean }

  /api/auth/csrf-token:
    get:
      tags: [auth]
      summary: Issue CSRF token cookie
      description: Sets a fresh double-submit CSRF cookie for browser SPA sessions.
      responses:
        '200':
          description: CSRF cookie set
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }

  /api/status:
    get:
      summary: Public system status and component health feed
      description: Unauthenticated real-time component health, uptime metrics, and incident history.
      responses:
        '200':
          description: System status feed
          content:
            application/json:
              schema:
                type: object

  /api/status/subscribe:
    post:
      summary: Subscribe to system status notifications
      description: Registers an email address to receive incident and status updates.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '200':
          description: Subscription request accepted
          content:
            application/json:
              schema:
                type: object

  /api/status/confirm:
    get:
      summary: Confirm status notification subscription
      parameters:
        - { name: token, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          description: Subscription confirmed

  /.well-known/openid-configuration:
    get:
      summary: OpenID Connect discovery document
      description: Standard RFC 8414 / OIDC authorization server metadata.
      responses:
        '200':
          description: OAuth/OIDC metadata
          content:
            application/json:
              schema:
                type: object

  /.well-known/oauth-authorization-server:
    get:
      summary: RFC 8414 OAuth 2.0 authorization server metadata
      responses:
        '200':
          description: Authorization server metadata
          content:
            application/json:
              schema:
                type: object

  /.well-known/oauth-authorization-server/api/oauth:
    get:
      summary: RFC 8414 §5 path-inserted OAuth authorization server metadata
      responses:
        '200':
          description: Authorization server metadata for pathed issuer
          content:
            application/json:
              schema:
                type: object

  /api:
    get:
      summary: User tag vocabulary index
      description: Returns unique tag names and associated colors created by the authenticated user.
      responses:
        '200':
          description: List of tag items
          content:
            application/json:
              schema:
                type: object
                properties:
                  tags:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string }
                        color: { type: string, nullable: true }

  /api/oauth/register:
    post:
      summary: RFC 7591 Dynamic Client Registration
      description: Machine-readable registration endpoint for OAuth 2.0 clients and agents.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [client_name, redirect_uris]
              properties:
                client_name: { type: string, maxLength: 100 }
                redirect_uris:
                  type: array
                  items: { type: string, format: uri }
                scope:
                  oneOf:
                    - type: string
                    - type: array
                      items: { type: string }
      responses:
        '201':
          description: Client registered
          content:
            application/json:
              schema:
                type: object
                properties:
                  client_id: { type: string }
                  client_secret: { type: string }
                  client_id_issued_at: { type: integer }
                  client_secret_expires_at: { type: integer }
                  client_name: { type: string }
                  redirect_uris: { type: array, items: { type: string } }
                  grant_types: { type: array, items: { type: string } }
                  response_types: { type: array, items: { type: string } }
                  token_endpoint_auth_method: { type: string }
                  scope: { type: string }

  /api/oauth/authorize:
    get:
      summary: RFC 6749 OAuth 2.0 Authorization Endpoint (Consent UI)
      description: Interactive consent page for resource owner authorization with PKCE.
      parameters:
        - name: client_id
          in: query
          required: true
          schema: { type: string }
        - name: redirect_uri
          in: query
          required: true
          schema: { type: string }
        - name: response_type
          in: query
          required: true
          schema: { type: string, enum: [code] }
        - name: scope
          in: query
          schema: { type: string }
        - name: state
          in: query
          schema: { type: string }
        - name: code_challenge
          in: query
          schema: { type: string }
        - name: code_challenge_method
          in: query
          schema: { type: string, enum: [S256] }
      responses:
        '200':
          description: HTML consent screen
          content:
            text/html:
              schema: { type: string }
        '302':
          description: Redirect back to client with code or error
    post:
      summary: RFC 6749 OAuth 2.0 Consent Decision
      description: Handles user allow/deny decision and issues authorization code.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [client_id, redirect_uri, decision, csrf_token]
              properties:
                client_id: { type: string }
                redirect_uri: { type: string }
                scope: { type: string }
                state: { type: string }
                code_challenge: { type: string }
                code_challenge_method: { type: string }
                csrf_token: { type: string }
                decision: { type: string, enum: [allow, deny] }
      responses:
        '302':
          description: Redirect back to client with authorization code or access_denied error

  /api/oauth/token:
    post:
      summary: RFC 6749 OAuth 2.0 Token Endpoint
      description: Exchange authorization code or refresh token for Bearer access token.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [grant_type]
              properties:
                grant_type: { type: string, enum: [authorization_code, refresh_token] }
                code: { type: string }
                code_verifier: { type: string }
                redirect_uri: { type: string }
                refresh_token: { type: string }
                client_id: { type: string }
                client_secret: { type: string }
      responses:
        '200':
          description: Token response
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token: { type: string }
                  token_type: { type: string, example: Bearer }
                  expires_in: { type: integer }
                  refresh_token: { type: string }
                  scope: { type: string }
        '400':
          description: OAuth token error
        '401':
          description: Client authentication failure

  /api/oauth/revoke:
    post:
      summary: RFC 7009 OAuth 2.0 Token Revocation
      description: Revokes an active access token or refresh token.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
                token_type_hint: { type: string, enum: [access_token, refresh_token] }
      responses:
        '200':
          description: Token successfully revoked
          content:
            application/json:
              schema: { type: object }

  /api/account/cancel:
    post:
      summary: Mark paid subscription to cancel at period end
      description: Sets cancelAtPeriodEnd flag so subscription stays active until billing period expires. Idempotent.
      responses:
        '200':
          description: Subscription cancellation status
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  cancelAtPeriodEnd: { type: boolean }
                  tier: { type: string }

  /api/account/usage:
    get:
      summary: Consolidated account overview, subscription plan and resource usage
      description: Returns account details, subscription tier limits and current usage metrics (sessions, API keys, knowledge graph nodes).
      responses:
        '200':
          description: Account usage profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { type: object }
                  plan: { type: object }
                  usage: { type: object }

  /api/account/usage-heatmap:
    get:
      summary: Hourly token consumption buckets for heatmap visualisation
      parameters:
        - name: hours
          in: query
          schema: { type: integer, default: 168 }
          description: Number of hours to look back (between 24 and 168)
      responses:
        '200':
          description: Continuous list of hourly token buckets and percentiles
          content:
            application/json:
              schema:
                type: object
                properties:
                  hours: { type: integer }
                  buckets:
                    type: array
                    items:
                      type: object
                      properties:
                        hour: { type: string, format: date-time }
                        tokens: { type: integer }
                        calls: { type: integer }
                  totalTokens: { type: integer }
                  totalCalls: { type: integer }

  /api/account/usage-trend:
    get:
      summary: Daily token consumption trends for dashboard charts
      parameters:
        - name: days
          in: query
          schema: { type: integer, default: 30 }
          description: Number of days to look back (between 7 and 90)
      responses:
        '200':
          description: Continuous daily token usage entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  days: { type: integer }
                  entries:
                    type: array
                    items:
                      type: object
                      properties:
                        day: { type: string, format: date }
                        tokens: { type: integer }
                        calls: { type: integer }
                  totalTokens: { type: integer }
                  totalCalls: { type: integer }

  /api/account/export:
    get:
      summary: Complete user data archive export
      description: Returns an aggregated JSON document containing all user sessions, messages, API keys, memories, prompts, and artifacts.
      responses:
        '200':
          description: Complete account data export JSON
          content:
            application/json:
              schema:
                type: object

  /api/account/payment-method:
    post:
      summary: Store non-sensitive card metadata
      description: Stores card brand, last4, and expiry month/year on user preferences. Sensitive PAN/CVC are never received.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [brand, last4, expMonth, expYear]
              properties:
                brand: { type: string }
                last4: { type: string, pattern: '^[0-9]{4}$' }
                expMonth: { type: integer }
                expYear: { type: integer }
      responses:
        '200':
          description: Payment method saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  paymentMethod: { type: object }
    delete:
      summary: Remove saved payment method metadata
      responses:
        '200':
          description: Payment method removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }

  /api/account/agent-keys:
    get:
      summary: List account agent API keys
      description: Returns all long-lived scoped credentials minted for autonomous agents. Plaintext secret is never included.
      responses:
        '200':
          description: List of agent key metadata rows
          content:
            application/json:
              schema:
                type: object
                properties:
                  keys:
                    type: array
                    items:
                      type: object
    post:
      summary: Mint a new scoped agent API key
      description: Issues a new scoped credential. The plaintext credential token is returned exactly once in the response.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [label, scopes]
              properties:
                label: { type: string, maxLength: 100 }
                scopes:
                  type: array
                  items: { type: string }
                expiresAt: { type: string, format: date-time, nullable: true }
      responses:
        '201':
          description: Key minted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  id: { type: string, format: uuid }
                  keyId: { type: string }
                  credential: { type: string }
                  scopes: { type: array, items: { type: string } }

  /api/account/agent-keys/{id}/revoke:
    post:
      summary: Revoke an agent API key
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Key revoked successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }

  /api/admin-auth/status:
    get:
      tags: [admin]
      summary: Operator console configuration and client IP allowlist probe
      description: Returns whether the admin password is configured and whether the caller's IP is allowed by the admin IP filter.
      responses:
        '200':
          description: Admin status probe
          content:
            application/json:
              schema:
                type: object
                properties:
                  configured: { type: boolean }
                  ipAllowed: { type: boolean }

  /api/admin-auth/verify:
    get:
      tags: [admin]
      summary: Verify active admin session token
      description: Validates the admin bearer token or session cookie.
      responses:
        '200':
          description: Session validity
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid: { type: boolean }

  /api/admin-auth/login:
    post:
      tags: [admin]
      summary: Operator console password authentication
      description: Authenticates the operator against ADMIN_PASSWORD with per-IP rate limiting and lockout protection.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string, maxLength: 200 }
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  expiresAt: { type: string, format: date-time }
        '403':
          description: IP not allowed
        '503':
          description: Admin password not configured on server

  /api/admin-auth/logout:
    post:
      tags: [admin]
      summary: Operator console logout
      responses:
        '200':
          description: Session cleared
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }

  /api/system-models:
    get:
      tags: [admin]
      summary: Read built-in system model configuration
      description: Returns the currently active system provider/model configuration (API key ciphertext is omitted).
      responses:
        '200':
          description: Active system model definition or null if unconfigured
          content:
            application/json:
              schema:
                type: object
                nullable: true
                properties:
                  id: { type: string, format: uuid }
                  label: { type: string }
                  url: { type: string }
                  model: { type: string }
                  keyHint: { type: string, nullable: true }
                  hasKey: { type: boolean }
                  isActive: { type: boolean }
                  isBuiltIn: { type: boolean }
                  isMultimodal: { type: boolean }
                  createdAt: { type: string, format: date-time }
    put:
      tags: [admin]
      summary: Update built-in system model configuration
      description: Sets the system model provider endpoint, model name and API key. Provider URL is verified against SSRF rules.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [label, url, model]
              properties:
                label: { type: string }
                url: { type: string }
                model: { type: string }
                key: { type: string, description: Plaintext key to encrypt or empty string to deactivate }
                keyHint: { type: string }
                isMultimodal: { type: boolean, default: true }
      responses:
        '200':
          description: Saved system model configuration
          content:
            application/json:
              schema:
                type: object

  /api/embedding-config:
    get:
      tags: [admin]
      summary: List vector embedding provider configurations
      description: Returns configured embedding model endpoints and dimensions (ciphertext is never exposed).
      responses:
        '200':
          description: List of embedding configurations
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
    put:
      tags: [admin]
      summary: Create or update embedding provider configuration
      description: Configures embedding provider endpoint and dimensions with SSRF verification. Exactly one config is active at a time.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [label, url, model, dimensions]
              properties:
                id: { type: string, description: If present updates existing configuration }
                label: { type: string }
                url: { type: string }
                model: { type: string }
                dimensions: { type: integer, minimum: 64, maximum: 4096 }
                key: { type: string }
                keyHint: { type: string }
                isActive: { type: boolean, default: true }
      responses:
        '200':
          description: Saved configuration
          content:
            application/json:
              schema:
                type: object

  /api/embedding-config/{id}:
    delete:
      tags: [admin]
      summary: Remove embedding provider configuration
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Configuration deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }

  /api/plugins:
    get:
      tags: [plugins]
      summary: List user's installed plugins
      responses:
        '200':
          description: Installed plugin list
          content:
            application/json:
              schema:
                type: object
                properties:
                  plugins:
                    type: array
                    items:
                      type: object
    post:
      tags: [plugins]
      summary: Install a new plugin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                description: { type: string }
                type: { type: string, default: extension }
                config: { type: object }
      responses:
        '201':
          description: Plugin installed
          content:
            application/json:
              schema:
                type: object

  /api/plugins/marketplace:
    get:
      tags: [plugins]
      summary: List available built-in marketplace plugins
      responses:
        '200':
          description: Built-in plugin catalog
          content:
            application/json:
              schema:
                type: object
                properties:
                  plugins:
                    type: array
                    items:
                      type: object

  /api/plugins/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [plugins]
      summary: Update plugin settings or toggle enabled state
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                description: { type: string }
                type: { type: string }
                config: { type: object }
                isEnabled: { type: boolean }
      responses:
        '200':
          description: Updated plugin
          content:
            application/json:
              schema:
                type: object
    delete:
      tags: [plugins]
      summary: Uninstall a plugin
      responses:
        '204':
          description: Plugin deleted

  /api/mcp:
    post:
      tags: [mcp]
      summary: Model Context Protocol (MCP) Streamable HTTP session initialization and message exchange
      description: Accepts JSON-RPC 2.0 messages conforming to the Model Context Protocol. Supports socrates.* discovery and read-only tools.
      parameters:
        - name: mcp-session-id
          in: header
          required: false
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: MCP response or session stream
        '400':
          description: Missing or unknown session ID
    get:
      tags: [mcp]
      summary: MCP server-sent event stream for an active session
      parameters:
        - name: mcp-session-id
          in: header
          required: true
          schema: { type: string }
      responses:
        '200':
          description: SSE event stream
          content:
            text/event-stream:
              schema: { type: string }
        '400':
          description: Unknown session ID
    delete:
      tags: [mcp]
      summary: Terminate an active MCP session
      parameters:
        - name: mcp-session-id
          in: header
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Session terminated
        '400':
          description: Unknown session ID

  /api/mcp/docs:
    post:
      tags: [mcp]
      summary: MCP Documentation Server session initialization and query exchange
      description: Curated read-only MCP server providing searchable access to Socrates developer and product documentation.
      parameters:
        - name: mcp-session-id
          in: header
          required: false
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: MCP docs response
        '400':
          description: Missing or unknown session ID
    get:
      tags: [mcp]
      summary: MCP Documentation Server event stream
      parameters:
        - name: mcp-session-id
          in: header
          required: true
          schema: { type: string }
      responses:
        '200':
          description: SSE event stream
          content:
            text/event-stream:
              schema: { type: string }
        '400':
          description: Unknown session ID
    delete:
      tags: [mcp]
      summary: Terminate an active MCP documentation session
      parameters:
        - name: mcp-session-id
          in: header
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Session terminated
        '400':
          description: Unknown session ID

  /api/chat-turns:
    get:
      tags: [agents]
      operationId: listChatTurns
      summary: List the authenticated user's recent chat turns
      parameters:
        - { name: sessionId, in: query, schema: { type: string, format: uuid } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        '200':
          description: Recent turns
          content:
            application/json:
              schema:
                type: object
                properties:
                  turns: { type: array, items: { $ref: '#/components/schemas/ChatTurn' } }
    post:
      tags: [agents]
      operationId: createChatTurn
      summary: Atomically create a chat turn and its initial event
      description: |
        Concurrent requests with the same (user, clientTurnId) return one
        durable turn. This creates a record; it does not itself start an LLM
        worker. Use the chat stream's turn binding to execute it. A clientTurnId
        cannot be rebound to a different session. The chat stream atomically
        claims a queued turn before model/tool work. Repeated execution attempts
        emit an SSE error with CONFLICT (the primed HTTP status remains 200).
        Reconnect to the event endpoint instead. Heartbeat-expired executions
        become interrupted and require an explicit new turn to retry.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [clientTurnId]
              properties:
                clientTurnId: { type: string, minLength: 1, maxLength: 200 }
                sessionId: { type: [string, 'null'], format: uuid }
                model: { type: [string, 'null'] }
                input: {}
      responses:
        '201':
          description: Created, with turn, created=true and capabilities.resumable=true
        '200':
          description: Existing turn, with created=false
        '400':
          description: Invalid clientTurnId or sessionId
        '404':
          description: Session does not exist or is not owned by the caller
        '409':
          description: clientTurnId was already bound to a different session
  /api/chat-turns/{id}:
    get:
      tags: [agents]
      operationId: getChatTurn
      summary: Read an owned turn and up to 200 initial events
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Turn snapshot and initial events; use the event stream to replay the full log
        '404':
          description: Turn does not exist or is not owned by the caller
  /api/chat-turns/{id}/events:
    get:
      tags: [agents]
      operationId: streamChatTurnEvents
      summary: Replay and tail an owned turn's durable events
      description: |
        Sends event: turn_event with {turnId, sequence, event, data} JSON,
        followed by chat-protocol aliases. Content aliases are default SSE
        data events containing delta; reasoning aliases contain reasoning.
        Other aliases use their original event name. Resume with after=lastSeq.
        Replay drains all available pages; a one-second database poll catches
        events written by another server instance. Disconnecting unsubscribes
        this reader and does not interrupt the worker. Event persistence does
        not by itself imply worker restart recovery.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: after, in: query, schema: { type: integer, minimum: 0, maximum: 2147483647, default: 0 } }
      responses:
        '200':
          description: Ordered SSE event envelopes and compatibility aliases
          content:
            text/event-stream:
              schema: { type: string }
        '400':
          description: Invalid event cursor
        '404':
          description: Turn does not exist or is not owned by the caller
  /api/chat-turns/{id}/interrupt:
    post:
      tags: [agents]
      operationId: interruptChatTurn
      summary: Mark an owned turn interrupted and emit its interruption event
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Updated turn and an idempotent boolean; worker cancellation is asynchronous
        '404':
          description: Turn does not exist or is not owned by the caller
  /api/mobile/bootstrap:
    get:
      tags: [mobile]
      operationId: getMobileBootstrap
      summary: Return the Android shell's same-origin API contract
      security: []
      responses:
        '200':
          description: Public, secret-free mobile endpoint configuration
          content:
            application/json:
              schema:
                type: object
                required: [ok, contractVersion, webBaseUrl, apiBaseUrl, canonicalApiBaseUrl, healthPath]
                properties:
                  ok: { type: boolean, const: true }
                  contractVersion: { type: integer, const: 1 }
                  product: { type: string, const: socrates }
                  platform: { type: string, const: android }
                  webBaseUrl: { type: string, format: uri }
                  apiBaseUrl: { type: string, format: uri, description: Cache-bypass API prefix used by mobile and web clients. }
                  canonicalApiBaseUrl: { type: string, format: uri }
                  healthPath: { type: string, const: /api/v2/health }

  # ========================================================================
  # P1.1 — Message operations
  # ========================================================================
  /api/messages/{messageId}:
    parameters:
      - $ref: '#/components/parameters/MessageId'
    patch:
      tags: [messages]
      operationId: editMessage
      summary: Edit the content of a user message (and optionally regenerate the assistant reply)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content: { type: string, minLength: 1, maxLength: 32000 }
                regenerate: { type: boolean, default: false, description: If true, also delete the assistant message that followed and trigger a new stream. }
      responses:
        '200':
          description: Updated message
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [messages]
      operationId: deleteMessage
      summary: Soft-delete a message (kept for audit, hidden from chat)
      responses:
        '204': { description: Deleted }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/messages/{messageId}/feedback:
    parameters:
      - $ref: '#/components/parameters/MessageId'
    put:
      tags: [messages]
      operationId: submitFeedback
      summary: Thumbs up/down + optional reason
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rating]
              properties:
                rating: { type: string, enum: [up, down, none] }
                reason: { type: string, maxLength: 500, description: Free-form feedback when rating is "down" }
                categories:
                  type: array
                  items: { type: string, enum: [hallucination, off_topic, too_long, too_short, wrong_format, harmful, other] }
      responses:
        '200':
          description: Stored
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FeedbackReceipt' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ========================================================================
  # P1.2 — Global search
  # ========================================================================
  /api/search:
    post:
      tags: [search]
      operationId: globalSearch
      summary: Search across sessions, messages, and artifacts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [q]
              properties:
                q: { type: string, minLength: 1, maxLength: 200 }
                scope: { type: string, enum: [all, sessions, messages, artifacts, memory], default: all }
                projectId: { type: string, format: uuid, nullable: true }
                tags: { type: array, items: { type: string } }
                limit: { type: integer, default: 20, maximum: 100 }
                cursor: { type: string, nullable: true, description: Opaque pagination cursor }
                from: { type: string, format: date, nullable: true }
                to: { type: string, format: date, nullable: true }
      responses:
        '200':
          description: Hits
          content:
            application/json:
              schema:
                type: object
                required: [hits]
                properties:
                  hits:
                    type: array
                    items: { $ref: '#/components/schemas/SearchHit' }
                  nextCursor: { type: string, nullable: true }
                  total: { type: integer }

  # ========================================================================
  # P1.3 — User preferences
  # ========================================================================
  /api/users/me:
    patch:
      tags: [users]
      operationId: updateMe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                displayName: { type: string, maxLength: 80 }
                customInstructions:
                  type: string
                  maxLength: 8000
                  description: Always prepended to the system prompt
                preferences:
                  type: object
                  additionalProperties: true
                  description: Free-form key/value bag (theme, fontStep, etc.)
                defaultModel: { type: string, nullable: true }
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }

  # ========================================================================
  # P2.1 — Projects
  # ========================================================================
  /api/projects:
    get:
      tags: [projects]
      operationId: listProjects
      responses:
        '200':
          description: List of projects the user owns or has access to
          content:
            application/json:
              schema:
                type: object
                properties:
                  projects: { type: array, items: { $ref: '#/components/schemas/Project' } }
    post:
      tags: [projects]
      operationId: createProject
      description: Database-backed idempotent JSON write; see the Idempotency-Key contract above.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 80 }
                description: { type: string, maxLength: 2000 }
                color: { type: string, pattern: "^#[0-9A-Fa-f]{6}$" }
                icon: { type: string, maxLength: 16, description: Emoji or short label }
                systemPrompt: { type: string, maxLength: 32000, description: Project-scoped system prompt additions }
                workspaceId: { type: string, format: uuid, nullable: true }
      responses:
        '409': { $ref: '#/components/responses/IdempotencyConflict' }
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/projects/{projectId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    patch:
      tags: [projects]
      operationId: updateProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                description: { type: string }
                color: { type: string }
                icon: { type: string }
                systemPrompt: { type: string }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
    delete:
      tags: [projects]
      operationId: deleteProject
      summary: Hard-delete a project and its related data
      description: Permanently deletes the project, its sessions and messages, project-scoped files, artifacts and versions, memories, execution records, and execution metadata.
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/NotFound' }

  # ========================================================================
  # P2.2 — Scheduled tasks, connectors and learning state
  # ========================================================================
  /api/scheduled-tasks:
    get:
      tags: [scheduled]
      operationId: listScheduledTasks
      responses:
        '200':
          description: Scheduled tasks owned by the current user
          content:
            application/json:
              schema:
                type: object
                properties:
                  tasks: { type: array, items: { $ref: '#/components/schemas/ScheduledTask' } }
    post:
      tags: [scheduled]
      operationId: createScheduledTask
      description: Database-backed idempotent JSON write; see the Idempotency-Key contract above.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, prompt]
              properties:
                title: { type: string }
                prompt: { type: string }
                sessionId: { type: string, format: uuid, nullable: true }
                cronExpression: { type: string, nullable: true }
                frequency: { type: string, enum: [once, hourly, daily, weekly, monthly, custom] }
                nextRunAt: { type: string, format: date-time, nullable: true }
      responses:
        '409': { $ref: '#/components/responses/IdempotencyConflict' }
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScheduledTask' }

  /api/scheduled-tasks/{taskId}:
    parameters:
      - in: path
        name: taskId
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [scheduled]
      operationId: updateScheduledTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                prompt: { type: string }
                sessionId: { type: string, format: uuid, nullable: true }
                cronExpression: { type: string, nullable: true }
                frequency: { type: string }
                status: { type: string, enum: [pending, active, paused, completed, failed] }
                nextRunAt: { type: string, format: date-time, nullable: true }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScheduledTask' }
    delete:
      tags: [scheduled]
      operationId: deleteScheduledTask
      responses:
        '204': { description: Deleted }

  /api/scheduled-tasks/{taskId}/run:
    parameters:
      - in: path
        name: taskId
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [scheduled]
      operationId: runScheduledTask
      summary: Execute a scheduled task immediately without moving its next slot
      description: |
        Manual and scheduled executions share a database lease. Completion
        commits result messages and bookkeeping together. A busy task returns
        409; sequential manual runs are distinct executions. Native LLM tasks
        whose worker dies can be reclaimed after lease expiry. Workspace-agent
        runs with unknown external effects are paused instead of automatically
        replayed; review their run history before manually retrying. Pauses and
        reschedules made during provider work are preserved.
      responses:
        '200':
          description: Updated task
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScheduledTask' }
        '409':
          description: Task already running or expired agent outcome uncertain; uncertain tasks are paused

  /api/project-connectors:
    get:
      tags: [connectors]
      operationId: listProjectConnectors
      responses:
        '200':
          description: Product-owned connector catalogue and opaque connection state
          content:
            application/json:
              schema:
                type: object
                properties:
                  mode: { type: string }
                  configured: { type: boolean }
                  connectors: { type: array, items: { $ref: '#/components/schemas/ProjectConnector' } }

  /api/project-connectors/{provider}/connect:
    parameters:
      - in: path
        name: provider
        required: true
        schema: { type: string }
    post:
      tags: [connectors]
      operationId: connectProjectConnector
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                apiKey: { type: string, format: password }
                values: { type: object, additionalProperties: { type: string } }
      responses:
        '201':
          description: OAuth request or connected account metadata
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  requestId: { type: string }
                  authorizationUrl: { type: string, format: uri }
                  expiresAt: { type: string, format: date-time }
                  connectedAccountId: { type: string }
                  displayName: { type: string, nullable: true }

  /api/project-connectors/{provider}/status:
    parameters:
      - in: path
        name: provider
        required: true
        schema: { type: string }
    get:
      tags: [connectors]
      operationId: getProjectConnectorStatus
      responses:
        '200':
          description: Opaque connection state
          content:
            application/json:
              schema:
                type: object
                properties:
                  connection:
                    allOf:
                      - $ref: '#/components/schemas/ProjectConnectorConnection'
                    nullable: true

  /api/knowledge-boundary:
    get:
      tags: [knowledge]
      operationId: listKnowledgeBoundary
      parameters:
        - in: query
          name: status
          schema: { type: string, enum: [fuzzy, internalized, blank] }
        - in: query
          name: sessionId
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Aggregated knowledge nodes
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/KnowledgeNode' } }
                  summary: { type: object, additionalProperties: { type: integer } }

  /api/mistakes:
    get:
      tags: [mistakes]
      operationId: listMistakes
      parameters:
        - in: query
          name: resolved
          schema: { type: boolean }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: User mistakes
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Mistake' } }
                  total: { type: integer }
    post:
      tags: [mistakes]
      operationId: createMistake
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [questionContent]
              properties:
                sessionId: { type: string, format: uuid, nullable: true }
                nodeName: { type: string, nullable: true }
                questionContent: { type: string }
                userAnswer: { type: string, nullable: true }
                correctAnswer: { type: string, nullable: true }
                source: { type: string, enum: [quiz, practice, manual] }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Mistake' }

  /api/mistakes/{mistakeId}:
    parameters:
      - in: path
        name: mistakeId
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [mistakes]
      operationId: updateMistake
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                isResolved: { type: boolean }
                resolvedAt: { type: string, format: date-time, nullable: true }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Mistake' }
    delete:
      tags: [mistakes]
      operationId: deleteMistake
      responses:
        '204': { description: Deleted }

  # ========================================================================
  # P2.3 — Tags & pinning
  # ========================================================================
  /api/sessions/{sessionId}/tags:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    put:
      tags: [tags]
      operationId: setSessionTags
      description: Atomically replace session tags. Supports database-backed Idempotency-Key replay across instances.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tags: { type: array, items: { type: string }, description: Only the first 12 entries are applied. }
      responses:
        '200':
          description: Requested tags
          content:
            application/json:
              schema:
                type: object
                properties:
                  tags: { type: array, items: { type: string } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }

  # ========================================================================
  # P2.3 — Archive / trash
  # ========================================================================
  /api/sessions/{sessionId}/archive:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    post:
      tags: [archive]
      operationId: archiveSession
      responses:
        '200':
          description: Archived
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionSummary' }
    delete:
      tags: [archive]
      operationId: restoreSession
      responses:
        '200':
          description: Restored
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionSummary' }

  /api/sessions/{sessionId}:
    delete:
      tags: [archive]
      operationId: purgeSession
      summary: Hard-delete (only valid for already-archived sessions)
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '204': { description: Purged }
        '409':
          description: Session is not archived; archive first
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  # ========================================================================
  # P3.1 — File upload
  # ========================================================================
  /api/files:
    get:
      tags: [files]
      operationId: listFiles
      summary: List user files with cursor pagination
      parameters:
        - in: query
          name: limit
          schema: { type: integer, default: 50, maximum: 200 }
        - in: query
          name: cursor
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: List of files
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/FileRef' }
    post:
      tags: [files]
      operationId: uploadFile
      summary: Multipart upload. Returns a fileId that can be attached to messages.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: Max 25 MB
                sessionId: { type: string, format: uuid, nullable: true, description: If provided, file is bound to the session for retention purposes. }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FileRef' }
        '413':
          description: File too large
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/files/extract:
    post:
      tags: [files]
      operationId: extractDocumentText
      summary: Extract plain text from PDF/Office documents
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Extracted text
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  text: { type: string }
                  truncated: { type: boolean }
                  name: { type: string }
                  kind: { type: string }

  /api/files/{fileId}:
    parameters:
      - $ref: '#/components/parameters/FileId'
    get:
      tags: [files]
      operationId: getFile
      responses:
        '200':
          description: File metadata
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FileRef' }
    patch:
      tags: [files]
      operationId: renameFile
      summary: Rename an uploaded file
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 255 }
      responses:
        '200':
          description: Renamed file
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  name: { type: string }
    delete:
      tags: [files]
      operationId: deleteFile
      responses:
        '204': { description: Deleted }

  /api/files/{fileId}/raw:
    parameters:
      - $ref: '#/components/parameters/FileId'
    get:
      tags: [files]
      operationId: getFileRaw
      responses:
        '200':
          description: File bytes
          content:
            application/octet-stream:
              schema: { type: string, format: binary }

  /api/files/{fileId}/content:
    parameters:
      - $ref: '#/components/parameters/FileId'
    get:
      tags: [files]
      operationId: getFilePreviewContent
      summary: Extract a bounded text preview for the library viewer
      responses:
        '200':
          description: Text preview
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  id: { type: string, format: uuid }
                  name: { type: string }
                  mimeType: { type: string }
                  kind: { type: string }
                  text: { type: string }
                  truncated: { type: boolean }
                  meta: { type: object, additionalProperties: true }
        '415': { $ref: '#/components/responses/BadRequest' }

  # ========================================================================
  # P4.1 — Artifacts
  # ========================================================================
  /api/artifacts:
    parameters:
      - $ref: '#/components/parameters/SessionIdOptional'
