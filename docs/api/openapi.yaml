          type: array
          items:
            type: object
            properties:
              id: { type: string }
              title: { type: string }
              topic: { type: string }
              estMinutes: { type: integer }
        enrolled: { type: boolean, default: false }
        progressPercent: { type: number }

    ShareResponse:
      type: object
      properties:
        token: { type: string }
        url: { type: string, format: uri }
        visibility: { type: string }
