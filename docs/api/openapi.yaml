    post:
      tags: [agents]
      operationId: createAgentRun
      summary: Create a durable project workspace run
      description: The server resolves the session/project owner, provider, workspace, sandbox, MCP catalog, and approval policy. The client cannot supply cwd, credentials, or policy overrides.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [task]
              properties:
                task: { type: string, maxLength: 20000 }
                sessionId: { type: string, format: uuid, nullable: true }
                projectId: { type: string, format: uuid, nullable: true }
                kind: { type: string, enum: [chat, tutor, scheduled, retry] }
                source: { type: string, enum: [chat, tutor, scheduled, api] }
      responses:
        '201':
          description: Durable run created; start a turn with the returned id
          content:
            application/json:
              schema:
                type: object
                properties:
                  run: { $ref: '#/components/schemas/AgentRuntimeRun' }
                  workspace: { type: object, properties: { id: { type: string, format: uuid, nullable: true } } }
