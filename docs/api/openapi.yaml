      responses:
        '200':
          description: Reset token info
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid: { type: boolean }
                  email: { type: string }
  /api/auth/password:
    post:
      tags: [users]
      summary: Change password for authenticated session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
