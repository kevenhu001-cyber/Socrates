  # ========================================================================
  # P6.1 — Real-time collaboration
  # ========================================================================
  /api/sessions/{sessionId}/collab:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    get:
      tags: [collaborators]
      operationId: openCollabSocket
      summary: Upgrade to WebSocket for real-time sync (Y.js over binary protocol)
      description: |
        Bidirectional WebSocket. The server stores the Y.Doc per
        session and broadcasts updates to all connected clients.
        Authentication via the same `sid` cookie + `X-CSRF-Token`
        header (sent in the WebSocket upgrade request).
      responses:
        '101':
          description: Switching protocols
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/sessions/{sessionId}/collab/presence:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    get:
      tags: [collaborators]
      operationId: getPresence
      responses:
        '200':
          description: Currently connected users
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items: { $ref: '#/components/schemas/PresenceUser' }

  /api/sessions/{sessionId}/collab/comments:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    get:
      tags: [collaborators]
      operationId: listComments
      responses:
        '200':
          description: Inline comments anchored to message ids
          content:
            application/json:
              schema:
                type: object
                properties:
                  comments: { type: array, items: { $ref: '#/components/schemas/Comment' } }
    post:
      tags: [collaborators]
      operationId: addComment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [anchor, body]
              properties:
                anchor: { type: string, description: MessageId or range }
                body: { type: string, maxLength: 4000 }
                parentId: { type: string, format: uuid, nullable: true, description: For threading replies }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Comment' }

