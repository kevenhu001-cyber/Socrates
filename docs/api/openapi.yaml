        tool definitions are used only by the streaming endpoint. Requests may
        set `response_speed` to `standard` or `fast`; unsupported priority
        service automatically falls back to standard and is reported in meta.
        An optional `assistantId` selects an owned configurable assistant; an
        owned `sessionId` restores that session's assistant when omitted.
        Instant mode uses `reasoning_effort: none` on OpenAI-compatible models,
        or allowlisted `extra_body` controls: `thinking: {type: disabled}`,
        `enable_thinking: false`, or `chat_template_kwargs: {enable_thinking: false}`.
        Explicit no-thinking controls are preserved during compatibility retries;
        providers that reject them return an error instead of silently enabling thinking.
  /api/chat/stream:
    post:
      tags: [users]
      summary: EXISTING — SSE chat
      description: >-
        The server injects the native tool contract from the exact tool
        registry for the current turn. Tool arguments are one JSON object that
        matches the supplied function schema, without an input or arguments
        wrapper. The stream shares the authenticated chat rate-limit bucket.
        Instant uses the same provider-specific no-thinking controls as `/api/chat`.
        A successful priority-service fallback emits `preference_fallback`
        before content frames.
        Optional `turn_event` frames provide the version 1 public turn runtime.
        Every event has `version: 1`, `turnId`, strictly increasing `seq`, `at`
        (Unix milliseconds), and `type`. Payloads are `activity.upsert` with
        an `activity` (stable id, kind, phase, startedAt, optional endedAt,
        public text, toolCallId and toolName), `generation` with phase streaming,
        `ui.begin` with surfaceId/toolCallId/textOffset, `ui.add` with surfaceId/node,
        `ui.patch` with surfaceId/nodeId/props, `ui.commit` with surfaceId/nodes,
        `ui.abort` with surfaceId, or `turn.done` with phase done/failed/stopped
        and optional durationMs. Additive evidence events are `source.upsert`
        with source `{id,url,title,snippet}` and `claim.annotate` with claim
        `{id,start,end,quote,citationIds}` plus citations `[{id,sourceId}]`.
        Claim offsets are UTF-16 indices into raw assistant text, end-exclusive;
        quote must match visible prose exactly. Sources originate only from
        successful web_search/web_fetch results; annotation does not imply
        independent verification of a claim. The native cite_sources tool binds
        already-written prose to registered source IDs. Unknown sources,
        ambiguous quotes, private/code/math spans and overlapping claims reject
        the complete tool batch. Sources/citations/claims persist in turnRuntime
        (limits 80/80/128). The SPA renders inline references, source previews and
        a Sources disclosure; legacy clients may continue showing tool cards.
        `ui.edit` carries surfaceId, baseRevision and atomic operations
        `[{op:patch,nodeId,props}|{op:add,node}|{op:remove,nodeId}]`.
        The native patch_intelligent_ui tool edits committed surfaces in the
        current live turn only. Revision starts at 0 and increments once per
        accepted transaction; stale revisions reject all operations. Remove
        also removes descendants. Full graph, URL, size and safety validation
        applies; at least one node must remain. Surviving node IDs and local
        control state are preserved. Activity phases are running/done/failed/stopped;
        kinds are waiting/reasoning/tool/synthesis/reasoning_summary. Only
        reasoning_summary entries carry public model-provided text. A generation
        event does not finish activities or tools. Clients deduplicate by turnId
        and seq; unknown versions/types may be ignored. UI patches cannot change
        node identity/type/parent and must pass the full UI validator. UI commit
        replaces the preview with the validated final document; abort retracts it.
        Only complete validated nodes stream before tool_use. Incomplete nodes
        and unresolved parents wait. Tool failure or malformed arguments retract
        the preview; successful execution commits it. Existing tool_use/tool_result
        frames and stored toolCalls remain the compatible final representation.
        The bounded turnRuntime snapshot is saved/restored on session messages.
        Detached turn event replay includes these same public runtime events.
        Optional `turn_activity` frames report public observations: `{type: thinking}`,
        `{type: tool, toolCallId, toolName}`, `{type: synthesizing}`, or
        `{type: done, durationMs}`. Clients must wait for stream playback to
        settle before mounting answer actions. Private reasoning is never
        activity copy. Older clients may ignore this additive event.
        Optional `turn_summary` frames carry `{summary}` for a completed activity
        retrospective. Completed summaries use observed execution facts and
        do not require another model request before the closing frame. Plain
        answers without reasoning or tools may omit the retrospective.
        The native `render_intelligent_ui` tool accepts `{version: 1, nodes: [...]}`
        with 1–80 unique typed nodes. Server validation rejects unsafe keys,
        URLs, invalid parents and cycles. UI data travels through ordinary
        tool_use/tool_result frames and stored toolCalls, separate from prose.
        Existing clients can display a generic tool result; legacy UI fences
        remain readable on the web for old sessions.
