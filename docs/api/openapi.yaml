  /api/codex/capabilities:
    get:
      tags: [codex]
      operationId: getCodexCapabilities
      summary: Whether the embedded Codex harness is enabled and how the caller's LLM key resolves
      security:
        - cookieAuth: []
        - csrfHeader: []
        - bearerAuth: []
      responses:
        '200':
          description: Harness capability + provider resolution for the caller
          content:
            application/json:
              schema:
                type: object
                required: [enabled, providerMode]
                properties:
                  enabled: { type: boolean, description: CODEX_ENABLED server flag }
                  providerMode:
                    type: string
                    enum: [user, server]
                    description: user = the caller's own Responses-capable key is injected; server = harness falls back to CODEX_HOME auth
                  model: { type: string, nullable: true }
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/codex/threads:
    post:
      tags: [codex]
      operationId: createCodexThread
      summary: Create an isolated Codex thread (per-user workspace + per-user provider override)
      description: |
        The server builds the per-thread config (provider base_url + bearer
        token from the caller's own API key, cwd workspace, `workspace-write`
        sandbox, `on-request` approval policy). The client never supplies
        config or policy. Requires a Responses-API-capable endpoint.
      security:
        - cookieAuth: []
        - csrfHeader: []
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                model: { type: string, description: Optional model override; defaults to the caller's configured provider model }
      responses:
        '201':
          description: Thread created
          content:
            application/json:
              schema:
                type: object
                required: [threadId, cwd]
                properties:
                  threadId: { type: string, format: uuid }
                  cwd: { type: string, description: Isolated workspace directory }
                  model: { type: string, nullable: true }
                  modelProvider: { type: string }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          description: Harness disabled or app-server failed to start
  /api/codex/threads/{threadId}:
    get:
      tags: [codex]
      operationId: getCodexThread
      summary: Thread status (owner-scoped)
      parameters:
        - $ref: '#/components/parameters/ThreadId'
      security:
        - cookieAuth: []
        - csrfHeader: []
        - bearerAuth: []
      responses:
        '200':
          description: Thread metadata + pending approvals
          content:
            application/json:
              schema:
                type: object
                required: [threadId]
                properties:
                  threadId: { type: string, format: uuid }
                  turnId: { type: string, nullable: true }
                  pendingApprovals: { type: integer, default: 0 }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Thread not found or not owned by the caller
    delete:
      tags: [codex]
      operationId: deleteCodexThread
      summary: Delete a thread and its workspace
      parameters:
        - $ref: '#/components/parameters/ThreadId'
      security:
        - cookieAuth: []
        - csrfHeader: []
        - bearerAuth: []
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, const: true }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Thread not found or not owned by the caller
  /api/codex/threads/{threadId}/turns:
    post:
      tags: [codex]
      operationId: startCodexTurn
      summary: Start a Codex turn and stream bridged events over SSE
      description: |
        POST-based SSE (EventSource cannot POST). Event names: codex_init,
        codex_turn_started, codex_delta, codex_reasoning, codex_tool,
        codex_tool_output, codex_item_started, codex_item_completed,
        codex_approval, codex_usage, codex_thread_status, codex_turn_completed,
        codex_done, codex_error. Approval requests are answered via
        POST /api/codex/threads/{threadId}/approvals with the `requestId`
        carried in the codex_approval event.
      parameters:
        - $ref: '#/components/parameters/ThreadId'
      security:
        - cookieAuth: []
        - csrfHeader: []
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [input]
              properties:
                input: { type: string, maxLength: 20000, description: User message that starts the turn }
      responses:
        '200':
          description: text/event-stream of codex_* events (see summary)
        '400':
          description: Missing/oversized input
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Thread not found or not owned by the caller
  /api/codex/threads/{threadId}/approvals:
    post:
      tags: [codex]
      operationId: decideCodexApproval
      summary: Answer a pending approval request (accept / decline / …)
      parameters:
        - $ref: '#/components/parameters/ThreadId'
      security:
        - cookieAuth: []
        - csrfHeader: []
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [requestId, decision]
              properties:
                requestId:
                  oneOf:
                    - { type: string }
                    - { type: integer }
                  description: Echo of the requestId from the codex_approval SSE event
                decision:
                  type: string
                  enum: [accept, acceptForSession, acceptWithExecpolicyAmendment, applyNetworkPolicyAmendment, decline, cancel]
      responses:
        '200':
          description: Decision forwarded to the agent
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, const: true }
        '400':
          description: Invalid decision
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Thread not owned by the caller or approval no longer pending
  /api/codex/threads/{threadId}/interrupt:
    post:
      tags: [codex]
      operationId: interruptCodexTurn
      summary: Interrupt the active turn
      parameters:
        - $ref: '#/components/parameters/ThreadId'
      security:
        - cookieAuth: []
        - csrfHeader: []
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                turnId: { type: string, description: Optional; falls back to the server's tracked last turn }
      responses:
        '200':
          description: Interrupt accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, const: true }
        '400':
          description: No active turn
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Thread not found or not owned by the caller

# ============================================================================
# Components
# ============================================================================
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sid
    csrfHeader:
      type: apiKey
      in: header
      name: X-CSRF-Token
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Socrates mobile access token (ma.<pair>.<secret>)

  parameters:
    MessageId:
      in: path
      name: messageId
      required: true
      schema: { type: string, format: uuid }
    SessionId:
      in: path
      name: sessionId
      required: true
      schema: { type: string, format: uuid }
    SessionIdOptional:
      in: query
      name: sessionId
      schema: { type: string, format: uuid }
    ProjectId:
      in: path
      name: projectId
      required: true
      schema: { type: string, format: uuid }
    FileId:
      in: path
      name: fileId
      required: true
      schema: { type: string, format: uuid }
    ArtifactId:
      in: path
      name: artifactId
      required: true
      schema: { type: string, format: uuid }
    MemoryId:
      in: path
      name: memoryId
      required: true
      schema: { type: string, format: uuid }
    WorkspaceId:
      in: path
      name: workspaceId
      required: true
      schema: { type: string, format: uuid }
    ThreadId:
      in: path
      name: threadId
      required: true
      schema: { type: string, format: uuid }

  responses:
    BadRequest:
      description: Malformed request
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Not signed in
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: CSRF missing or wrong, or wrong owner
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    MobileTokenPair:
      type: object
      required: [accessToken, refreshToken, expiresAt, refreshExpiresAt]
      properties:
        accessToken:
          type: string
          description: Short-lived bearer credential; send as Authorization Bearer.
          pattern: '^ma\\.[a-f0-9]{32}\\.[a-f0-9]{64}$'
        refreshToken:
          type: string
          description: Rotating opaque credential; only accepted by refresh/logout.
          pattern: '^mr\\.[a-f0-9]{32}\\.[a-f0-9]{64}$'
        expiresAt: { type: string, format: date-time }
        refreshExpiresAt: { type: string, format: date-time }

    MobileLoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }

    MobileAuthResponse:
      allOf:
        - $ref: '#/components/schemas/MobileTokenPair'
        - type: object
          required: [user]
          properties:
            user: { $ref: '#/components/schemas/User' }

    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string, example: NOT_FOUND }
        message: { type: string }
        detail: { type: object, additionalProperties: true }

    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        displayName: { type: string, nullable: true }
        tier: { type: string, enum: [diophantus, riemann, descartes, euclid] }
        plan: { type: string, nullable: true }
        isGuest: { type: boolean, default: false }
        verifiedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        customInstructions: { type: string, nullable: true }
        preferences: { type: object, additionalProperties: true, nullable: true }
        defaultModel: { type: string, nullable: true }

    Message:
      type: object
      properties:
        id: { type: string, format: uuid }
        sessionId: { type: string, format: uuid }
        role: { type: string, enum: [user, assistant, system] }
        content: { type: string }
        rawText: { type: string, nullable: true }
        html: { type: string, nullable: true }
        type: { type: string, nullable: true }
        model: { type: string, nullable: true }
        tokenCount: { type: integer, nullable: true }
        attachments:
          type: array
          items: { $ref: '#/components/schemas/FileRef' }
        createdAt: { type: string, format: date-time }
        editedAt: { type: string, format: date-time, nullable: true }
        parentId: { type: string, format: uuid, nullable: true, description: For regenerated/edited chains }

    FeedbackReceipt:
      type: object
      properties:
        id: { type: string, format: uuid }
        messageId: { type: string, format: uuid }
        rating: { type: string, enum: [up, down, none] }
        storedAt: { type: string, format: date-time }

    SearchHit:
      type: object
      properties:
        kind: { type: string, enum: [session, message, artifact, memory] }
        id: { type: string, format: uuid }
        sessionId: { type: string, format: uuid, nullable: true }
        title: { type: string }
        snippet: { type: string, description: Excerpt with <mark> highlights }
        score: { type: number }
        updatedAt: { type: string, format: date-time }

    SessionSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string, nullable: true }
        topic: { type: string, nullable: true }
        mode: { type: string, enum: [tutor, chat] }
        projectId: { type: string, format: uuid, nullable: true }
        tags:
          type: array
          items: { type: string }
        pinned: { type: boolean, default: false }
        archivedAt: { type: string, format: date-time, nullable: true }
        preview: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    Project:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string, nullable: true }
        color: { type: string, nullable: true }
        icon: { type: string, nullable: true }
        systemPrompt: { type: string, nullable: true }
        workspaceId: { type: string, format: uuid, nullable: true }
        createdAt: { type: string, format: date-time }
        sessionCount: { type: integer }

    ProjectDetail:
      allOf:
        - $ref: '#/components/schemas/Project'
        - type: object
          properties:
            recentSessions:
              type: array
              items: { $ref: '#/components/schemas/SessionSummary' }

    ScheduledTask:
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        prompt: { type: string }
        sessionId: { type: string, format: uuid, nullable: true }
