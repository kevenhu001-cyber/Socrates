          type: array
          items:
            type: object
            properties:
              mistakeId: { type: string, format: uuid }
              question: { type: string }
              affectedStudents: { type: integer }
        topicCompletion:
          type: array
          items:
            type: object
            properties:
              topic: { type: string }
              completion: { type: number }

    MistakeSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
