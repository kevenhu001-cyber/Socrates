        schema: { type: string, format: uuid }
    post:
      tags: [artifacts]
      operationId: createArtifact
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, source]
              properties:
                type: { type: string, enum: [html, react, svg, mermaid, code, markdown] }
                title: { type: string, maxLength: 200 }
                source: { type: string, description: Original code/markup }
                sessionId: { type: string, format: uuid }
                messageId: { type: string, format: uuid }
                language: { type: string, description: For code artifacts }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Artifact' }
    get:
      tags: [artifacts]
      operationId: listArtifacts
      responses:
        '200':
          description: User's artifacts
          content:
            application/json:
              schema:
                type: object
                properties:
                  artifacts: { type: array, items: { $ref: '#/components/schemas/Artifact' } }

  /api/artifacts/{artifactId}:
    parameters:
      - $ref: '#/components/parameters/ArtifactId'
    get:
      tags: [artifacts]
      operationId: getArtifact
      responses:
        '200':
          description: Artifact
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Artifact' }
    patch:
      tags: [artifacts]
      operationId: updateArtifact
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                source: { type: string }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Artifact' }
    delete:
      tags: [artifacts]
      operationId: deleteArtifact
      responses:
        '204': { description: Deleted }

  /api/artifacts/{artifactId}/versions:
    parameters:
      - $ref: '#/components/parameters/ArtifactId'
    get:
      tags: [artifacts]
      operationId: listArtifactVersions
      responses:
        '200':
          description: Version history
          content:
            application/json:
              schema:
                type: object
                properties:
                  versions: { type: array, items: { $ref: '#/components/schemas/ArtifactVersion' } }

  /api/artifacts/{artifactId}/share:
    parameters:
      - $ref: '#/components/parameters/ArtifactId'
    post:
      tags: [artifacts]
      operationId: shareArtifact
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                visibility: { type: string, enum: [public, unlisted, private] }
      responses:
        '201':
          description: Shared
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShareResponse' }
    delete:
      tags: [artifacts]
      operationId: unshareArtifact
      responses:
        '204': { description: Unshared }

  # ========================================================================
  # P4.4 — Memory
  # ========================================================================
  /api/memory:
    get:
      tags: [memory]
      operationId: listMemories
      parameters:
        - in: query
          name: includeDisabled
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: User memories
          content:
            application/json:
              schema:
                type: object
                properties:
                  memories: { type: array, items: { $ref: '#/components/schemas/MemoryEntry' } }
    post:
      tags: [memory]
      operationId: createMemory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, minLength: 1, maxLength: 2000 }
                scope: { type: string, enum: [global, project], default: global }
                projectId: { type: string, format: uuid, nullable: true }
                source: { type: string, enum: [user, extracted], default: user }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemoryEntry' }

  /api/memory/{memoryId}:
    parameters:
      - $ref: '#/components/parameters/MemoryId'
    patch:
      tags: [memory]
      operationId: updateMemory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                text: { type: string }
                enabled: { type: boolean }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemoryEntry' }
    delete:
      tags: [memory]
      operationId: deleteMemory
      responses:
        '204': { description: Deleted }

  /api/memory/{memoryId}/enable:
    parameters:
      - $ref: '#/components/parameters/MemoryId'
    post:
      tags: [memory]
      operationId: enableMemory
      responses:
        '200':
          description: Enabled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemoryEntry' }

  /api/memory/{memoryId}/disable:
    parameters:
      - $ref: '#/components/parameters/MemoryId'
    post:
      tags: [memory]
      operationId: disableMemory
      responses:
        '200':
          description: Disabled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemoryEntry' }

  # ========================================================================
  # P5.1 — Usage
  # ========================================================================
  /api/usage:
    get:
      tags: [usage]
      operationId: getUsage
      parameters:
        - in: query
          name: period
          schema: { type: string, enum: [day, week, month, all], default: month }
        - in: query
          name: groupBy
          schema: { type: string, enum: [model, project, day, none], default: model }
      responses:
        '200':
          description: Usage summary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Usage' }

  /api/usage/limits:
    get:
      tags: [usage]
      operationId: getUsageLimits
      responses:
        '200':
          description: Plan limits
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UsageLimits' }

  /api/usage/daily:
    get:
      tags: [usage]
      operationId: getUsageDaily
      summary: Daily token counts for heatmap (last 365 days)
      parameters:
        - in: query
          name: days
          schema: { type: string, default: '365' }
      responses:
        '200':
          description: Daily token usage entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  days: { type: integer }
                  entries:
                    type: array
                    items:
                      type: object
                      properties:
                        day: { type: string, format: date }
                        tokens: { type: integer }
                        messages: { type: integer }

  # ========================================================================
  # P5.2 — Notifications
  # ========================================================================
  /api/notifications/register:
    post:
      tags: [notifications]
      operationId: registerPush
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [platform, token]
              properties:
                platform: { type: string, enum: [web, android, ios] }
                token: { type: string }
                deviceId: { type: string, nullable: true }
                channels:
                  type: array
                  items: { type: string, enum: [long_tasks, mentions, replies, billing] }
      responses:
        '200':
          description: Registered
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationToken' }

  /api/notifications/unregister:
    delete:
      tags: [notifications]
      operationId: unregisterPush
      responses:
        '204': { description: Unregistered }

  # ========================================================================
  # P5.7 — Import
  # ====================================================================
  /api/import:
    post:
      tags: [imports]
      operationId: importConversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source, payload]
              properties:
                source: { type: string, enum: [chatgpt, claude, socrates, jsonl] }
                payload: { type: object, description: Source-native format }
                projectId: { type: string, format: uuid, nullable: true }
      responses:
        '202':
          description: Import started
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportJob' }
    get:
      tags: [imports]
      operationId: listImports
      responses:
        '200':
          description: Past imports
          content:
            application/json:
              schema:
                type: object
                properties:
                  jobs: { type: array, items: { $ref: '#/components/schemas/ImportJob' } }

  /api/import/{jobId}:
    parameters:
      - in: path
        name: jobId
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [imports]
      operationId: getImport
      responses:
        '200':
          description: Import job
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportJob' }

  # ========================================================================
  # P5.8 — Prompt templates
  # ========================================================================
  /api/prompts:
    get:
      tags: [prompts]
      operationId: listPromptTemplates
      parameters:
        - in: query
          name: scope
          schema: { type: string, enum: [builtin, mine, all], default: all }
      responses:
        '200':
          description: Templates
          content:
            application/json:
              schema:
                type: object
                properties:
                  templates: { type: array, items: { $ref: '#/components/schemas/PromptTemplate' } }
    post:
      tags: [prompts]
      operationId: createPromptTemplate
      description: Database-backed idempotent JSON write; see the Idempotency-Key contract above.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, body]
              properties:
                title: { type: string, maxLength: 80 }
                description: { type: string, maxLength: 200 }
                body: { type: string, maxLength: 32000 }
                icon: { type: string, maxLength: 16 }
                category: { type: string, enum: [writing, code, learning, analysis, creative, other] }
                shortcut: { type: string, maxLength: 20, description: Optional slash-command alias, e.g. "/summarize" }
                systemPrompt: { type: string, maxLength: 32000, description: Optional system prompt injected while the template is active }
      responses:
        '409': { $ref: '#/components/responses/IdempotencyConflict' }
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PromptTemplate' }

  /api/prompts/{templateId}:
    parameters:
      - in: path
        name: templateId
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [prompts]
      operationId: updatePromptTemplate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                description: { type: string }
                body: { type: string }
                icon: { type: string }
                category: { type: string }
                shortcut: { type: string }
                systemPrompt: { type: string, nullable: true }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PromptTemplate' }
    delete:
      tags: [prompts]
      operationId: deletePromptTemplate
      responses:
        '204': { description: Deleted }

  # ========================================================================
  # P6.3 — Classroom / spaced repetition
  # ========================================================================
  /api/classroom/classes:
    get:
      tags: [classroom]
      operationId: listClasses
      responses:
        '200':
          description: "Classes (teacher view: own; student view: enrolled)"
          content:
            application/json:
              schema:
                type: object
                properties:
                  classes: { type: array, items: { $ref: '#/components/schemas/ClassroomClass' } }
    post:
      tags: [classroom]
      operationId: createClass
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 80 }
                description: { type: string, maxLength: 500 }
                subject: { type: string, maxLength: 40 }
                gradeLevel: { type: string, maxLength: 20 }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClassroomClass' }

  /api/classroom/classes/{classId}/students:
    parameters:
      - in: path
        name: classId
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [classroom]
      operationId: listClassStudents
      responses:
        '200':
          description: Students
          content:
            application/json:
              schema:
                type: object
                properties:
                  students: { type: array, items: { $ref: '#/components/schemas/StudentSummary' } }
  /api/classroom/classes/{classId}/join:
    parameters:
      - in: path
        name: classId
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [classroom]
      operationId: joinClass
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [joinCode]
              properties:
                joinCode: { type: string, pattern: "^[A-Z0-9]{6}$" }
      responses:
        '200':
          description: Joined
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClassroomClass' }

  /api/classroom/classes/{classId}/dashboard:
    parameters:
      - in: path
        name: classId
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [classroom]
      operationId: getClassDashboard
      description: Teacher-only. Aggregate progress, mistake hotspots, completion rates.
      responses:
        '200':
          description: Dashboard
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClassDashboard' }

