<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" role="img" aria-label="Socrates — AI-powered Socratic tutor">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f1c17"/>
      <stop offset="1" stop-color="#2a241b"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3c769"/>
      <stop offset="1" stop-color="#d8a85b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.18" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#d8a85b" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#d8a85b" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#3a3326" stroke-width="0.5" stroke-opacity="0.5"/>
    </pattern>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#grid)"/>
  <rect width="640" height="320" fill="url(#glow)"/>

  <!-- concentric orbits (Socratic rings) -->
  <g transform="translate(220 160)" fill="none" stroke="#d8a85b" stroke-opacity="0.18">
    <circle r="38" stroke-width="1"/>
    <circle r="68" stroke-width="1"/>
    <circle r="98" stroke-width="1"/>
    <circle r="128" stroke-width="1"/>
  </g>

  <!-- dial face -->
  <g transform="translate(220 160)">
    <circle r="44" fill="#1a1813" stroke="url(#gold)" stroke-width="2"/>
    <circle r="32" fill="none" stroke="#d8a85b" stroke-opacity="0.5" stroke-width="1"/>
    <!-- tick marks -->
    <g stroke="#d8a85b" stroke-width="1.4" stroke-linecap="round">
      <line x1="0" y1="-40" x2="0" y2="-34"/>
      <line x1="0" y1="40" x2="0" y2="34"/>
      <line x1="-40" y1="0" x2="-34" y2="0"/>
      <line x1="40" y1="0" x2="34" y2="0"/>
    </g>
    <!-- hourglass/hand inside -->
    <circle r="6" fill="url(#gold)"/>
    <line x1="0" y1="0" x2="22" y2="-22" stroke="url(#gold)" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- wordmark -->
  <g transform="translate(340 130)" fill="#f3e9d0" font-family="Newsreader, ui-serif, Georgia, serif">
    <text x="0" y="0" font-size="68" font-weight="500" letter-spacing="-1">Socrates</text>
    <text x="2" y="44" font-size="18" fill="#a8a190" font-family="Inter, sans-serif" letter-spacing="0.5">AI-powered Socratic tutor</text>
  </g>

  <!-- tagline -->
  <g transform="translate(340 220)" fill="#d8c8a0" font-family="Inter, sans-serif">
    <text x="0" y="0" font-size="16" opacity="0.9">Streaming chat, viz canvases, LaTeX, projects, tags, archive,</text>
    <text x="0" y="22" font-size="16" opacity="0.9">prompts, agent mode, share links, Android client,</text>
    <text x="0" y="44" font-size="16" opacity="0.9">and a Socratic teacher prompt — all in a single-file SPA.</text>
  </g>

  <!-- right side: small capability chips -->
  <g transform="translate(960 80)" font-family="Inter, sans-serif" font-size="12" fill="#d8c8a0">
    <g>
      <rect x="0" y="0" width="100" height="26" rx="13" fill="#2a241b" stroke="#d8a85b" stroke-opacity="0.4"/>
      <text x="50" y="17" text-anchor="middle">streaming</text>
    </g>
    <g transform="translate(110 0)">
      <rect x="0" y="0" width="100" height="26" rx="13" fill="#2a241b" stroke="#d8a85b" stroke-opacity="0.4"/>
      <text x="50" y="17" text-anchor="middle">Socratic</text>
    </g>
    <g transform="translate(0 36)">
      <rect x="0" y="0" width="100" height="26" rx="13" fill="#2a241b" stroke="#d8a85b" stroke-opacity="0.4"/>
      <text x="50" y="17" text-anchor="middle">markdown</text>
    </g>
    <g transform="translate(110 36)">
      <rect x="0" y="0" width="100" height="26" rx="13" fill="#2a241b" stroke="#d8a85b" stroke-opacity="0.4"/>
      <text x="50" y="17" text-anchor="middle">KaTeX</text>
    </g>
    <g transform="translate(0 72)">
      <rect x="0" y="0" width="100" height="26" rx="13" fill="#2a241b" stroke="#d8a85b" stroke-opacity="0.4"/>
      <text x="50" y="17" text-anchor="middle">viz iframe</text>
    </g>
    <g transform="translate(110 72)">
      <rect x="0" y="0" width="100" height="26" rx="13" fill="#2a241b" stroke="#d8a85b" stroke-opacity="0.4"/>
      <text x="50" y="17" text-anchor="middle">Android</text>
    </g>
    <g transform="translate(0 108)">
      <rect x="0" y="0" width="100" height="26" rx="13" fill="#2a241b" stroke="#d8a85b" stroke-opacity="0.4"/>
      <text x="50" y="17" text-anchor="middle">projects</text>
    </g>
    <g transform="translate(110 108)">
      <rect x="0" y="0" width="100" height="26" rx="13" fill="#2a241b" stroke="#d8a85b" stroke-opacity="0.4"/>
      <text x="50" y="17" text-anchor="middle">share links</text>
    </g>
  </g>

  <!-- bottom strip -->
  <g transform="translate(0 296)" font-family="Inter, sans-serif" font-size="11" fill="#7a7160">
    <text x="20" y="0">app.topodrive.top</text>
    <text x="1260" y="0" text-anchor="end">v2.0 / streaming render v1.4</text>
  </g>
</svg>
