[workspace]
resolver = "2"
members = [
    "crates/socrates-protocol",
    "crates/socrates-format",
    "crates/socrates-stream",
    "crates/socrates-fetch",
    "crates/socrates-wasm",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"
tokio = { version = "1", features = ["macros", "net", "io-std", "io-util", "rt-multi-thread", "sync", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
url = "2"

[profile.release]
opt-level = "s"
lto = true
