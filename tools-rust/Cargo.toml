[workspace]
resolver = "2"
members = [
    "crates/socrates-protocol",
    "crates/socrates-format",
    "crates/socrates-stream",
    "crates/socrates-wasm",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"

[profile.release]
opt-level = "s"
lto = true
