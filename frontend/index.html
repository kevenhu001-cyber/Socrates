<!DOCTYPE html>
<html lang="en" data-theme="socrates" data-mode="dark">
<head>
<meta charset="UTF-8">
<!-- interactive-widget=resizes-content: on Chrome/Edge Android 108+ the
     layout viewport itself shrinks above the keyboard, so the 100dvh flex
     column reflows natively on the compositor (same approach as Open WebUI:
     h-screen max-h-[100dvh] + in-flow composer, zero JS motion). iOS Safari
     ignores this flag and stays in overlay mode; there the controller below
     (ui/keyboard) mirrors the visual viewport 1:1 into --keyboard-inset. -->
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<!-- Mobile browser chrome (iOS status bar tint, Android address bar) should
     follow the active theme instead of staying default white. displayPrefs.js
     rewrites this tag whenever data-mode changes; the value here is the dark
     shell default that the document starts with. -->
<meta name="theme-color" content="#121110">
<title>Socrates</title>
<link rel="icon" type="image/png" href="/favicon.png">
<!-- P_perf-resource-hints — the boot shell paints /logo.png in its very
     first frame; preloading it here (before the render-blocking CSS) saves
     the round trip the parser would otherwise spend discovering it.
     No cross-origin host is touched at boot: fonts, KaTeX, mermaid,
     plotly, echarts and highlight.js are all bundled (see
     src/vendor/lazy.ts). The one third-party script host left in the app
     is GeoGebra's CDN, and it is resolved lazily — only when a
     math_construction card actually mounts
     (src/render/visualizationAdapters.ts). An eager dns-prefetch used to
     sit here and burned a lookup on every page load for a host the vast
     majority of sessions never use; behind a network that drops the
     packets that lookup is not free either. -->
<link rel="preload" as="image" href="/logo.png" fetchpriority="high">
<meta http-equiv="X-DNS-Prefetch-Control" content="on">
<!-- P_perf-boot-prefetch — fire the three boot GETs the moment the parser
     reaches <head>, so /api/auth/me + /api/v2/config (+ the CSRF prime)
     overlap the entry-JS download instead of waiting for 200+ modules to
     evaluate. auth/boot.js prefers these promises and falls back to fresh
     apiFetch calls when the preflight is missing or failed, so behaviour
     is identical with or without it. Same-origin credentials:include, no
     custom headers — wire-identical to what apiFetch sends for GETs; the
     /api/v2/ prefix dodges the CDN-cached /api/ path and the cb= nonce
     keeps the CDN from ever caching the preflight URL itself, exactly
     like apiFetch. -->
<script>
(function () {
  try {
    var w = window;
    if (w.__bootApi) return;
    w.__bootApi = {};
    /* A URL-only route (?share, ?token, ?reset_token, ?oauth_error) returns
       from authBoot before startAuthRequests, so its preflight /me + CSRF
       are never consumed. Skip them there: a public share reader is
       anonymous and cannot use the session state they would cost. */
    var urlOnlyRoute = /(?:^|[?&])(share|token|reset_token|oauth_error)=/.test(location.search);
    var opts = { credentials: 'include' };
    var cb = '?cb=' + Date.now();
    function get(url) {
      return fetch(url + cb, opts).then(function (r) {
        return r.json().then(function (j) {
          return { status: r.status, json: j };
        }, function () {
          return { status: r.status, json: null };
        });
      }, function () {
        return { failed: true };
      });
    }
    if (!urlOnlyRoute) {
      w.__bootApi.me = get('/api/v2/auth/me');
      w.__bootApi.csrf = fetch('/api/v2/auth/csrf-token' + cb, opts).then(function () {
        return null;
      }, function () {
        return null;
      });
    }
    /* /api/v2/config is public: the share view still applies it. */
    w.__bootApi.config = get('/api/v2/config');
  } catch (_) { /* preflight is best effort */ }
})();
</script>
<script>
/* Resolve the theme preference before the stylesheet is parsed. This
   keeps the system-following option from flashing the default dark
   palette during a reload. `data-mode` remains the effective mode;
   `data-theme-preference` records whether it is user-selected or
   inherited from the OS. The pre-paint color is sourced from the
   shared design-token module so the `#ffffff` / `#212121`
   literals stay in one place. The bundle is an ES module and is not
   loaded yet at this point, so the values are inlined as a tiny
   function-style lookup that mirrors `resolveBackground()`. */
(function () {
  var initialPreference = "dark";
  try {
    var storedPreference = localStorage.getItem("socrates-theme");
    if (storedPreference === "light" || storedPreference === "dark" || storedPreference === "system") {
      initialPreference = storedPreference;
    }
  } catch (_) { /* ignore */ }
  var initialMode = initialPreference === "system"
    ? (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
    : initialPreference;
  var initialStyle = "socrates";
  try {
    var storedStyle = localStorage.getItem("socrates-theme-style");
    if (storedStyle === "socrates" || storedStyle === "philosophy") {
      initialStyle = storedStyle;
    }
  } catch (_) { /* ignore */ }
  document.documentElement.setAttribute('data-theme-preference', initialPreference);
  document.documentElement.setAttribute('data-mode', initialMode);
  document.documentElement.setAttribute('data-theme', initialStyle);
})();
</script>
<!-- Fetch the shared variable UI face before stylesheet discovery. CJK
     remains download-first and unicode-subset; code fonts stay on demand. -->
<link rel="preload" href="/src/assets/fonts/geist-sans-variable.woff2" as="font" type="font/woff2" crossorigin>
<!-- P_perf-self-host — fonts (Inter/Newsreader/Noto Sans SC),
     KaTeX CSS, marked,
     DOMPurify, KaTeX, highlight.js, and fuse.js are bundled by Vite from
     npm (see src/vendor/init.ts); mermaid / echarts / plotly are dynamic
     imports loaded only when a visualization actually mounts. Nothing on
     this page depends on fonts.googleapis.com or cdn.jsdelivr.net. -->
<!-- P0.6 — pre-boot marker. -->
<script>
(function(){
  try{document.documentElement.dataset.bootState="checking"}catch(_){}
  /* P_routed-session — detect routed session (?chat= or ?exam=) before first paint
     so a page reload never flashes the landing page greeting or starter cards. */
  try{
    var _s=location.search;
    if(/(?:^|[?&])(chat|chatId|exam|examId)=/.test(_s)){
      document.documentElement.dataset.routedSession="true";
      document.documentElement.dataset.mainView=/(?:^|[?&])(exam|examId)=/.test(_s)?"examView":"chatView";
    }
  }catch(_){}
  /* P_grid — restore grid preference before first paint so the
     boot-loading screen respects the user's choice immediately. */
  try{
    var _g=JSON.parse(localStorage.getItem("socrates-display"));
    if(_g&&_g.showGrid===true){document.documentElement.dataset.showGrid="true";}
    else{document.documentElement.dataset.showGrid="false";}
  }catch(_){}
  /* If no preference stored, grid is off by default. */
  /* Safety net: if authBoot() never replaces bootState within 12s
   * (offline / backend hung / unexpected error), default to the
   * sign-in form so the user always has a way out. */
  setTimeout(function(){
    try{
      if(document.documentElement.dataset.bootState==="checking"){
        document.documentElement.dataset.bootState="auth";
        var g=document.getElementById("authGate");if(g)g.classList.remove("hidden");
        var s=document.getElementById("appShell");if(s)s.classList.add("hidden");
      }
    }catch(_){}
  },12000);
})();
</script>
<!-- P_perf-css-split — the 955 KB single stylesheet blocked first paint.
     Critical slices stay render-blocking; below-fold leaves (hidden views,
     popovers, press polish — all @import/url-free, so Vite emits them
     verbatim) load at lowest priority via media=print and apply on load.
     Link order reproduces styles/index.css file-for-file (machine-checked
     by check-css-debt.mjs); themes.css still closes the cascade exactly
     once and last. -->
<link rel="stylesheet" href="/src/styles/critical-1.css">
<link rel="stylesheet" href="/src/styles/legacy/02-modals-library.css" media="print" onload="this.media='all'">
<link rel="stylesheet" href="/src/styles/legacy/03-workspace-panels.css" media="print" onload="this.media='all'">
<link rel="stylesheet" href="/src/styles/critical-2.css">
<link rel="stylesheet" href="/src/styles/legacy/08-exam.css" media="print" onload="this.media='all'">
<link rel="stylesheet" href="/src/styles/critical-3.css">
<link rel="stylesheet" href="/src/styles/restore/creation-surfaces.css" media="print" onload="this.media='all'">
<link rel="stylesheet" href="/src/styles/critical-4.css">
<link rel="stylesheet" href="/src/styles/polish/overlays.css" media="print" onload="this.media='all'">
<link rel="stylesheet" href="/src/styles/polish/workspace.css" media="print" onload="this.media='all'">
<link rel="stylesheet" href="/src/styles/critical-5.css">
<link rel="stylesheet" href="/src/styles/polish/press.css" media="print" onload="this.media='all'">
<link rel="stylesheet" href="/src/styles/critical-6.css">
<link rel="stylesheet" href="/src/styles/themes.css">
</head>
<body>

<!-- a11y skip link: first Tab stop on the page, parked off-screen until
     keyboard focus. The target carries tabindex="-1" so activating the
     link moves focus into the main content, not just the scroll position. -->
<a class="skip-link" href="#mainContent" data-i18n-key="a11y.skipToContent">Skip to content</a>

<!-- P0.6 — pre-boot loading shell. Visible only while
     data-boot-state="checking" (i.e. between the synchronous
     pre-boot script and authBoot() finishing /api/auth/me). The
     CSS rules for that data attribute set opacity:0 and
     pointer-events:none on this element as soon as bootState
     flips to "auth" or "app", so the transition is smooth. -->
<div class="boot-loading" id="bootLoading" aria-hidden="true">
  <div class="boot-loading-logo">
    <img src="/logo.png" width="20" height="20" alt="" class="logo-img">
    <span class="shimmer-text">Socrates</span>
    <span class="boot-loading-dots" aria-hidden="true"><span></span><span></span><span></span></span>
  </div>
</div>

<!-- ============================================================
     AUTH GATE
     Shown whenever the user is not signed in. Covers the whole
     viewport with a centered card. The app shell below stays in the
     DOM but is hidden behind it (display:none on the gate keeps the
     rest of the page inert). On successful login/registration/verify
     we hide the gate and reveal the app.
     ============================================================ -->
<!-- AUTH GATE host — the card is the React `AuthGate` tree
     (react/auth/AuthGate.tsx). The element itself stays here so pre-boot
     CSS, showGate()/hideGate() and the auth listeners keep one stable
     node to toggle and bind against. -->
<div class="auth-gate" id="authGate" role="dialog" aria-modal="true" aria-label="Sign in" data-i18n-aria="auth.signIn"></div>

<div class="app hidden" id="appShell">


<aside class="sidebar" id="sidebar">
  <div class="sidebar-inner">
    <!-- React renders the sidebar chrome and navigation; keep these stable
         hosts empty so the static shell does not duplicate control markup. -->
    <div class="sidebar-header" id="sidebarHeader"></div>
    <nav class="sidebar-nav" id="sidebarNav" aria-label="Primary navigation" data-i18n-aria="chrome.primaryNav"></nav>
    <!-- P_sidebar-parity — reference chat splits the rail into a destination
         block and a conversation block with a hairline between them, so the
         eye can find where navigation stops and history begins. -->
    <div class="sidebar-nav-sep" role="separator" aria-orientation="horizontal"></div>
    <div class="sidebar-more-popover hidden" id="moreNavPopover" role="menu" aria-label="更多"></div>
    <!-- Unified sidebar search + view switch. The search box filters the
         session list in place (setRecentsSearch → renderRecents). The two
         icon buttons are tutor-only entries to the Knowledge map and the
         Mistake book; they reuse the #tabKnowledge/#tabMistakes ids so the
         existing switchTab() logic drives panel visibility unchanged. In
         Chat mode both icons are hidden, so the row is just the search box
         over a single list. -->
    <div class="sidebar-search-row" id="sidebarSearchRow"></div>
    <div class="knowledge-panel tutor-only hidden" id="knowledgePanel">
      <div id="teachingPlanContent"></div>
      <div id="kbContent"><div class="kb-empty" data-i18n-key="tutor.kbTopicFirst">Set a topic to build your knowledge map.</div></div>
    </div>
    <div class="recents-panel" id="recentsPanel">
      <div class="recents-header"></div>
      <!-- P2.2 — tag filter chip row. "All" plus a few of the user's
           most-used tags. Renders inline; the active chip is highlighted. -->
      <div class="recents-filter-chips" id="recentsFilterChips"></div>
      <div id="recentsList"></div>
    </div>
    <div class="recents-panel hidden tutor-only" id="mistakesPanel">
      <div class="recents-header"><span class="recents-title" data-i18n-key="sidebar.mistakeBook">Mistake Book</span></div>
      <div id="mistakesList"></div>
    </div>

    <div class="sidebar-footer" id="sidebarFooter">
      <!-- Account row — avatar + name over plan tier, matching the reference
           drawer's two-line identity block (React's SidebarFooter replaces
           this pre-paint placeholder with the same structure). -->
      <div class="user-row" id="sidebarUserRow"><div class="user-avatar" aria-hidden="true">?</div><div class="user-identity"><div class="user-name"></div><div class="user-plan">Free</div></div></div>
      <div class="sidebar-footer-actions" id="sidebarFooterActions"></div>
    </div>
    <div class="sidebar-resize-handle" id="sidebarResizeHandle" aria-label="Drag to resize sidebar" title="Drag to resize sidebar" data-i18n-aria="chrome.resizeSidebar" data-i18n-title="chrome.resizeSidebar"></div>
  </div>
</aside>
<div class="sidebar-backdrop" id="sidebarBackdrop" aria-hidden="true"></div>

<main class="main">
  <div class="main-bg" aria-hidden="true"></div>
  <!-- React-owned: src/react/topbar/TopBar.tsx renders every control inside
       this host (mount spec `top-bar` in lib/boot/specs.tsx). The ids stay
       part of the shell contract for the legacy runtime, and geometry stays
       in parity/topbar.css until it is measured and retired
       (docs/adr/0024-shadcn-shell-geometry-ownership.md). -->
  <div class="top-bar" id="topBar"></div>
  <div class="main-content" id="mainContent" tabindex="-1">
    <div class="main-inner" id="mainInner">

      <div class="topic-setup" id="topicSetup">
        <!-- P_chatgpt-landing — Personalized greeting replaces the static
             "What would you like to explore?" copy. renderGreeting()
             (src/ui/greeting.js) writes the localized "{greeting} {name}."
             string into this element on boot and after profile changes.
             The data-i18n-key provides a fallback for the very first
             paint before JS runs. -->
        <h1 class="topic-title greeting" id="topicTitle" data-i18n-key="greeting.chat"></h1>
        <p class="topic-sub" id="topicSub"></p>
        <!-- .mobile-starter-prompts container removed: nothing ever
             populated it (see ui/homeSuggestions.ts, a no-op shim). -->
        <!-- Chat history surface — populated at runtime by main.js renderRecents()
             (server-sourced sessions) and the local fallback. Kept as an empty
             container so the layout reserves space without hard-coding demo
             items in markup. -->
        <div class="topic-composer-slot composer-slot" id="topicComposerSlot">
        <!-- P_composer-single — ONE composer shell for the whole app. The
             typed Composer controller places it here on landing and into
             #chatComposerSlot when a conversation view activates; the
             editor, draft, focus and chips travel with it, so the input box
             never rebuilds between surfaces. -->
        <div class="composer-input-wrap composer-shell" id="composerInputWrap"></div>
        </div>

        <!-- Landing shortcuts: each row delegates to an existing composer
             extension, so this is a real entry point rather than a decorative
             copy of the reference page. The previous AI-backed heuristic
             suggestions block (id="homeSuggestionsWrap") was removed — those
             chips read as noise on mobile and were the most-skipped UI on the
             landing surface. -->
        <div class="home-quick-actions" id="homeQuickActions" aria-label="Quick actions" data-i18n-aria="chrome.quickActions"></div>


        <section class="home-tutor-starters" id="homeTutorStarters" aria-labelledby="homeTutorHeading"></section>

      </div>

      <div class="diagnostic-view hidden tutor-only" id="diagnosticView"></div>

      <div class="shared-banner hidden" id="sharedBanner">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg>
        <span data-i18n-key="share.readOnlyBanner">Read-only view — this is a shared conversation.</span>
      </div>
      <!-- chat-view lifted out of .main-inner so the transcript
           scrollbar pins to the right edge of the main pane.
           See the sibling .chat-view-lifted below. -->

    <!-- Main-content pages for Library, Projects, Scheduled, Plugins -->
    <div class="library-panel main-page hidden" id="libraryPanel"></div>
    <div id="libraryUploadReactRoot"></div>
    <div class="spaces-panel main-page hidden" id="spacesPanel"></div>
    <div class="scheduled-panel main-page hidden" id="scheduledPanel"></div>
    <div class="plugins-panel main-page hidden" id="pluginsPanel"></div>
    <!-- Admin operator console (/admin). The React AdminPage owns
         #adminPanel when the route is active; the login form and the
         two config sections are rendered by React. -->
    <div class="admin-panel main-page hidden" id="adminPanel"></div>

    <p class="disclaimer" id="topicDisclaimer">Socrates asks questions to help you think. It does not judge your answers.</p>

    </div>

    <div class="exam-view hidden" id="examView">
      <!-- The visible exam title lives in the app top bar. Keep this heading
           for programmatic announcements without rendering a duplicate title. -->
      <h2 class="sr-only" id="examViewTitle">Generate Exam</h2>
      <div class="exam-view-body" id="examViewBody">
        <div class="exam-root-slot" id="examViewReactNav"></div>
        <div class="exam-root-slot" id="examViewReactBody"></div>
        <div class="exam-root-slot" id="examViewLegacyBody"></div>
      </div>
      <div class="exam-view-footer" id="examViewFooter">
        <div class="exam-root-slot" id="examViewReactFooter"></div>
        <div class="exam-root-slot" id="examViewLegacyFooter"></div>
      </div>
    </div>
    <!-- #chatPage is the single structural owner of the chat surface:
         transcript + composer live under it in one vertical flex column.
         It renders as display:contents, so its children still participate
         directly in the main-content flex column — #msgList's viewport
         ends at the real composer top and its scrollbar keeps spanning
         the main pane, exactly as before. Visibility is gated by
         .hidden on #chatPage: mainViewController toggles it in the same
         task as #chatView (same-task layout reads stay correct), and
         ui/layoutStateMirror re-syncs it for writers that bypass the
         controller. DOM order matches the visual order: transcript
         first, composer last. -->
    <div class="chat-page hidden" id="chatPage">
    <div class="msg-list" id="msgList"></div>
    <div class="chat-view chat-view-lifted hidden" id="chatView">

        <!-- P0.2 — In-session find bar. A browser-style "find on page"
             control scoped to #msgList (distinct from the global Cmd-K
             palette). Opened by Ctrl-F / the #findBtn header button;
             logic lives in src/ui/findInSession.js. -->
        <div class="find-bar hidden" id="findBar" role="search"></div>
        <div class="chat-input-bar" id="chatInputBar">
          <!-- P_socratic-suggestions — Proactive cognitive scaffolding chips in Tutor mode -->
          <div class="socratic-suggestions tutor-only hidden" id="socraticSuggestions" role="region" aria-label="启发式思维建议" data-i18n-aria="tutor.suggestion.prefix"></div>
          <!-- P_pill-anchor-composer — moved inside chat-input-bar so the
               pill anchors to the composer's top edge instead of
               chat-view's top edge. The CSS rule `.chat-input-bar >
               .new-reply-pill` keys off this parent. -->
          <div class="new-reply-pill" id="newReplyPill" role="button" tabindex="0" aria-label="Jump to new reply" data-i18n-aria="chrome.jumpToNewReply">↓ New reply</div>
          <!-- P_composer-single — typed Composer controller places the single shell here for a conversation. -->
          <div class="chat-composer-slot composer-slot" id="chatComposerSlot"></div>
        </div>
      </div>
    </div>

  </div>

  <!-- P_artifacts-workbench — Dual-pane side-by-side workspace & mobile bottom sheet for Code/Preview -->
  <aside class="artifacts-workbench hidden" id="artifactsWorkbench" aria-label="Artifacts and Canvas" role="complementary"></aside>
  <div class="artifacts-backdrop hidden" id="artifactsBackdrop" aria-hidden="true"></div>

</main>
</div>

<script type="module" src="/src/main.ts"></script>

<!-- Settings Modal -->
<!-- P1.2 — global search modal. Toggled by `Cmd/Ctrl+K` (and
     `Esc` to close). The modal owns a single file picker that drives
     a fuse.js fuzzy index over:
       - session titles + topics (SERVER_SESSIONS)
       - message raw text inside the active session
       - cached titles of older sessions loaded from localStorage
     Indexed on first open and rebuilt whenever a session is
     saved. Recent queries persist under socrates-search-recent. -->
<div class="cmd-k-overlay hidden" id="cmdKOverlay" role="dialog" aria-modal="true" aria-label="Command palette" data-i18n-aria="chrome.commandPalette">
  <!-- Inner markup is React-owned and mounted via createRoot at boot. -->
</div>

<div class="share-overlay hidden" id="shareOverlay" role="dialog" aria-modal="true" aria-label="Share chat" data-i18n-aria="chrome.shareChat">
  <!-- Inner markup is React-owned and mounted via createRoot at boot. -->
</div>

<!-- Settings modal is React-owned (M4 step 4.5b): SettingsModal.tsx
     renders #settingsOverlay into #settingsModalReactRoot at boot and
     handles its own Esc/focus/backdrop-close. No static markup here. -->

<!-- profile modal -->
<div class="profile-overlay hidden" id="profileOverlay" role="dialog" aria-modal="true" aria-label="Account" data-i18n-aria="profile.account">
  <!-- Inner markup is React-owned and mounted via createRoot at boot. -->
</div>

<!-- Confirm dialog is React-owned (M4 step 4.5c): ConfirmDialog.tsx
     renders #confirmDialog into #confirmDialogReactRoot at boot and
     handles its own Esc/focus/backdrop-close. No static markup here. -->

<!-- usage modal -->
<div class="usage-overlay hidden" id="usageOverlay" role="dialog" aria-modal="true" aria-label="Token usage" data-i18n-aria="profile.usage">
  <!-- Inner markup is React-owned and mounted via createRoot at boot. -->
</div>

<!-- First-visit consent controls render from the lightweight React boot slice. -->
<div id="cookieConsentReactRoot"></div>

</body>
</html>
