[versions]
agp                = "8.7.3"
kotlin             = "2.0.21"
ksp                = "2.0.21-1.0.27"
coreKtx            = "1.13.1"
lifecycle          = "2.8.7"
activityCompose    = "1.9.3"
composeBom         = "2024.10.01"
navigation         = "2.8.4"
retrofit           = "2.11.0"
okhttp             = "4.12.0"
kotlinxSerial      = "1.7.3"
retrofitKotlinx    = "1.0.0"
coil               = "2.7.0"
datastore          = "1.1.1"
room               = "2.6.1"
splashscreen       = "1.0.1"
material3          = "1.3.1"


[libraries]
androidx-core-ktx            = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime   = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-vm        = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-activity-compose    = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-navigation          = { module = "androidx.navigation:navigation-compose", version.ref = "navigation" }
androidx-splashscreen         = { module = "androidx.core:core-splashscreen", version.ref = "splashscreen" }
androidx-datastore-prefs      = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
androidx-room-runtime         = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-room-ktx             = { module = "androidx.room:room-ktx", version.ref = "room" }
androidx-room-compiler        = { module = "androidx.room:room-compiler", version.ref = "room" }
compose-bom                   = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui                    = { module = "androidx.compose.ui:ui" }
compose-ui-graphics           = { module = "androidx.compose.ui:ui-graphics" }
compose-ui-tooling            = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview    = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-material3             = { module = "androidx.compose.material3:material3", version.ref = "material3" }
compose-material-icons        = { module = "androidx.compose.material:material-icons-extended" }
compose-foundation            = { module = "androidx.compose.foundation:foundation" }
compose-runtime               = { module = "androidx.compose.runtime:runtime" }

retrofit                      = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
retrofit-kotlinx-serialization= { module = "com.jakewharton.retrofit:retrofit2-kotlinx-serialization-converter", version.ref = "retrofitKotlinx" }
okhttp                        = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-logging                = { module = "com.squareup.okhttp3:logging-interceptor", version.ref = "okhttp" }
okhttp-sse                    = { module = "com.squareup.okhttp3:okhttp-sse", version.ref = "okhttp" }
kotlinx-serialization-json    = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerial" }
kotlinx-coroutines            = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version = "1.8.1" }
coil-compose                  = { module = "io.coil-kt:coil-compose", version.ref = "coil" }
markwon-core                  = { module = "io.noties.markwon:core", version = "4.6.2" }
markwon-katex                 = { module = "io.noties.markwon:ext-katex", version = "4.6.2" }
markwon-prism4j               = { module = "io.noties.markwon:ext-prism4j", version = "4.6.2" }
markwon-recycler              = { module = "io.noties.markwon:recycler", version = "4.6.2" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android      = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose      = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp                 = { id = "com.google.devtools.ksp", version.ref = "ksp" }
